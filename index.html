                                        <h3 className="font-bold text-center text-yellow-300 text-xs mb-2">🎁 Возможные награды за 10 раундов</h3>

                                            {['🧸', '🧸 PRO', '🧱', '🍾', '💍', '25⭐️', '200⭐️', '350⭐️', '🔑'].map((e, i) => <span key={i} className="bg-gray-800/60 p-1.5 rounded-lg border border-white/10">{e}</span>)}
                                        </div>
                                    </div>
                                </>
                            ) : (
                                <div className="glass rounded-xl p-4 mb-3 text-center border border-yellow-500/30">
                                    <div className="text-3xl mb-2 animate-bounce">🪬</div>
                                    <div className="font-bold text-yellow-300 text-lg mb-2">Соверши 13 подвиг!</div>
                                    <div className="text-gray-400 text-xs mb-3">Сделай ставку и пройди 10 раундов</div>
                                    <div className="flex gap-2 mb-3">
                                        <input type="number" min="25" value={geraklBetInput} onChange={e => setGeraklBetInput(Math.max(25, Number(e.target.value)))} className="flex-1 bg-gray-800 border border-yellow-600 rounded-lg p-2.5 text-center text-lg text-white" />
                                        <button onClick={() => setGeraklBetInput(p => p + 25)} className="bg-yellow-700 hover:bg-yellow-600 px-3 rounded-lg font-bold transition text-sm">+25</button>
                                        <button onClick={() => setGeraklBetInput(p => p + 100)} className="bg-yellow-700 hover:bg-yellow-600 px-3 rounded-lg font-bold transition text-sm">+100</button>
                                    </div>
                                    <button onClick={startGeraklGame} disabled={balance < geraklBetInput || geraklBetInput < 25} className="w-full bg-gradient-to-r from-yellow-600 to-orange-600 hover:from-yellow-500 hover:to-orange-500 py-2.5 rounded-xl font-bold disabled:opacity-50 transition text-sm">Начать игру ({geraklBetInput}⭐️)</button>
                                    <p className="text-center text-xs text-gray-500 mt-1">Баланс: {balance.toFixed(0)}⭐️ | Мин: 25⭐️</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }
            
            if(isAdmin) {
                const filteredUsers = allUsers.filter(u => !adminUserSearch || (u.name && u.name.toLowerCase().includes(adminUserSearch.toLowerCase())) || (u.username && u.username.toLowerCase().includes(adminUserSearch.toLowerCase())) || (u.id && u.id.toLowerCase().includes(adminUserSearch.toLowerCase())));
                return (
                    <div className="min-h-screen bg-gray-900 p-4">
                        <div className="max-w-4xl mx-auto">
                            <div className="flex justify-between items-center mb-6">
                                <h1 className="text-2xl font-bold text-white">🔐 Админ-панель</h1>
                                <button onClick={() => setIsAdmin(false)} className="text-gray-400 hover:text-white">Выйти</button>
                            </div>
                            <div className="flex gap-2 mb-6 overflow-x-auto">
                                {['stats', 'users', 'rewards', 'settings'].map(tab => (
                                    <button key={tab} onClick={() => setAdminScreen(tab)} className={`px-4 py-2 rounded-lg ${adminScreen === tab ? 'bg-indigo-600' : 'bg-gray-700'} text-sm`}>
                                        {tab === 'stats' ? '📊 Стат.' : tab === 'users' ? '👥 Юзеры' : tab === 'rewards' ? '🎀 Награды' : '⚙️ Настр.'}
                                    </button>
                                ))}
                            </div>
                            <div className="glass rounded-xl p-6">
                                {adminScreen === 'stats' && (
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Игроков</div><div className="text-3xl font-bold">{allUsers.length}</div></div>
                                        <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Онлайн</div><div className="text-3xl font-bold text-green-400">{onlineCount}</div></div>
                                        <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Общий баланс</div><div className="text-2xl font-bold">{allUsers.reduce((s, u) => s + (u.balance || 0), 0).toFixed(0)}⭐️</div></div>
                                        <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Предметов</div><div className="text-3xl font-bold">{allUsers.reduce((s, u) => s + (u.inventory?.length || 0), 0)}</div></div>
                                    </div>
                                )}
                                {adminScreen === 'users' && !selectedUser && (
                                    <div>
                                        <div className="mb-4">
                                            <input type="text" placeholder="🔍 Поиск по имени, нику или ID..." value={adminUserSearch} onChange={e => setAdminUserSearch(e.target.value)} className="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-sm" />
                                        </div>
                                        <div className="space-y-2 max-h-96 overflow-y-auto">
                                            {filteredUsers.map(u => (
                                                <div key={u.id} onClick={() => setSelectedUser(u)} className="bg-gray-800 p-3 rounded-lg cursor-pointer hover:bg-gray-700 flex justify-between">
                                                    <div><div className="font-bold text-sm">{u.name}</div><div className="text-xs text-gray-400">{u.username || u.id.slice(0,12)}</div></div>
                                                    <div className="text-yellow-400 text-sm">{(u.balance || 0).toFixed(0)}⭐️</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {adminScreen === 'users' && selectedUser && (
                                    <div>
                                        <h3 className="font-bold mb-4 text-lg">👤 {selectedUser.name}</h3>
                                        <div className="grid grid-cols-3 gap-2 mb-4">
                                            <button onClick={() => adminGiveReward(selectedUser.id, {type:'stars', amount:100})} className="bg-green-600 p-2 rounded text-sm">+100⭐️</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, {type:'stars', amount:500})} className="bg-green-600 p-2 rounded text-sm">+500⭐️</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, {type:'stars', amount:1000})} className="bg-green-600 p-2 rounded text-sm">+1000⭐️</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, {type:'case', caseType:'diamond', count:5})} className="bg-blue-600 p-2 rounded text-sm">+5💎</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, {type:'case', caseType:'elite', count:2})} className="bg-red-600 p-2 rounded text-sm">+2🎖</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, {type:'unlock_collector'})} className="bg-pink-800 p-2 rounded text-sm">🔓 Коллекц.</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, {type:'reset_daily'})} className="bg-cyan-600 p-2 rounded text-sm">🗓️ Сброс дейли</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, {type:'item', item:{id:'random_case_box', name:'Случайный кейс', emoji:'📦', type:'random_case_box'}})} className="bg-amber-600 p-2 rounded text-sm">📦 Выдать ящик</button>
                                        </div>
                                        <button onClick={() => setSelectedUser(null)} className="w-full bg-gray-600 p-2 rounded text-sm">← Назад</button>
                                    </div>
                                )}
                                {adminScreen === 'rewards' && (
                                    <div>
                                        <h3 className="text-lg mb-4">Выдать себе:</h3>
                                        <div className="grid grid-cols-3 gap-2">
                                            <button onClick={() => adminGiveReward(user.id, {type:'stars', amount:10000})} className="bg-indigo-600 p-3 rounded text-sm">+10000⭐️</button>
                                            <button onClick={() => adminGiveReward(user.id, {type:'case', caseType:'diamond', count:10})} className="bg-blue-600 p-3 rounded text-sm">+10💎</button>
                                            <button onClick={() => adminGiveReward(user.id, {type:'unlock_collector'})} className="bg-pink-800 p-3 rounded text-sm">🔓 Коллекц.</button>
                                            <button onClick={() => adminGiveReward(user.id, {type:'reset_daily'})} className="bg-cyan-600 p-3 rounded text-sm">🗓️ Сброс дейли</button>
                                            <button onClick={() => adminGiveReward(user.id, {type:'item', item:{id:'random_case_box', name:'Случайный кейс', emoji:'📦', type:'random_case_box'}})} className="bg-amber-600 p-3 rounded text-sm">📦 Выдать ящик</button>
                                        </div>
                                    </div>
                                )}
                                {adminScreen === 'settings' && (
                                    <div>
                                        <h3 className="text-lg mb-4">Сбросить аккаунт</h3>

                                )}
                            </div>
                        </div>
                    </div>

                        backgroundPosition: 'center',

                                            <div className="flex-1">
                                                <div className="font-bold text-lg">{u.name}</div>
                                                <div className="text-yellow-400 text-sm">{u.olympusOpens} открытий</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                        </div>
                    </div>

                    { key: 'gold_ball', emoji: '⚽️', name: 'Золотой мяч', reward: { type: 'case', caseType: 'coal', count: 1, name: '1 кейс Уголёк' } },
                    { key: 'mikhaylov_ball', emoji: '🏐', name: 'Мяч Максима Михайлова', reward: { type: 'case', caseType: 'star', count: 1, name: '1 кейс Звездный⭐️' } },
                    { key: 'tyson_gloves', emoji: '🥊', name: 'Перчатки Майка Тайсона', reward: { type: 'slot', name: '+1 слот' } },
                    { key: 'steak', emoji: '🥩', name: 'Стейк', reward: { type: 'stars', amount: 100, name: '100⭐️' } },
                    { key: 'simba', emoji: '🦁', name: 'Симба', reward: { type: 'case', caseType: 'gold', count: 2, name: '2 кейса Золотой👑' } },
                    { key: 'wolf_wallstreet', emoji: '🐺', name: 'Волк с Уолл-стрит', reward: { type: 'unlock_collector', count: 2, name: 'Разблокировка + 2 кейса Коллекционер🎩' } },
                    { key: 'ice', emoji: '🧊', name: 'Лёд', reward: { type: 'choice', name: '25 кейсов Звездный⭐️ или 500⭐️' } },
                    { key: 'diamond_pro', emoji: '💎', name: 'Алмаз PRO', reward: { type: 'stars', amount: 125, name: '125⭐️' } },
                    { key: 'material', emoji: '🧱', name: 'Материал', reward: { type: 'stars', amount: 130, name: '130⭐️ (Выгодно!)' }, profitable: true }
                ];
                
                return (
                    <div className="min-h-screen pb-24" style={{
                        backgroundImage: `url('gefest.jpg')`,
                        backgroundSize: 'cover',
                        backgroundPosition: 'center',
                        backgroundBlendMode: 'overlay'
                    }}>
                        <div className="max-w-lg mx-auto p-4">
                            <div className="flex justify-between items-center mb-6">
                                <h1 className="olympus-header text-3xl">🏵️ Лавка Гефеста</h1>
                                <button onClick={() => setOlympusSubScreen(null)} className="bg-red-600/40 hover:bg-red-600 border border-red-500/50 px-3 py-1.5 rounded-xl font-bold transition text-sm">✕ Выйти</button>
                            </div>
                            
                            <div className="glass rounded-xl p-6 olympus-font">
                                <h2 className="text-xl font-bold text-center mb-6" style={{color: '#fbbf24', textShadow: '0 0 20px #fbbf24, 0 0 30px #f59e0b'}}>Обменяй свои коллекционные предметы на что-нибудь ценное💎</h2>
                                
                                <div className="grid grid-cols-2 gap-3">
                                    {gefestItems.map(item => {
                                        const invItem = inventory.find(i => i.key === item.key || (item.key === 'ice' && i.type === 'ice') || (item.key === 'diamond_pro' && i.name === 'Алмаз PRO 💎') || (item.key === 'material' && i.name === 'Материал 🧱'));
                                        return (
                                            <div key={item.key} className="bg-gray-800/80 p-3 rounded-xl border-2 border-yellow-500/50">
                                                <div className="text-3xl mb-2">{item.emoji}</div>
                                                <div className="font-bold text-sm mb-1" style={{color: '#fbbf24'}}>{item.name}</div>
                                                <div className={`text-xs ${item.profitable ? 'text-red-400 animate-pulse font-bold' : 'text-yellow-400'}`}>{item.reward.name}</div>
                                                {invItem ? (
                                                    <button onClick={() => gefestExchange(invItem, item.reward)} className="w-full mt-2 bg-yellow-600 hover:bg-yellow-500 py-2 rounded-lg text-xs font-bold">Обменять</button>
                                                ) : (
                                                    <div className="text-gray-500 text-xs mt-2 font-bold">Предмет не найден!</div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
            
            if(olympusSubScreen === 'treasure') {
                return (
                    <div className="min-h-screen pb-24" style={{
                        backgroundImage: `url('case.jpg')`,
                        backgroundSize: 'cover',
                        backgroundPosition: 'center',
                        backgroundBlendMode: 'overlay'
                    }}>
                        <div className="max-w-lg mx-auto p-4">
                            <div className="flex justify-between items-center mb-6">
                                <h1 className="olympus-header text-3xl">⚡️ Сокровище Олимпа</h1>
                                <button onClick={() => setOlympusSubScreen(null)} className="bg-red-600/40 hover:bg-red-600 border border-red-500/50 px-3 py-1.5 rounded-xl font-bold transition text-sm">✕ Выйти</button>
                            </div>
                            
                            <div className="glass rounded-xl p-6 olympus-font">
                                <h2 className="text-2xl font-bold text-center mb-4" style={{color: '#fbbf24', textShadow: '0 0 15px #fbbf24, 0 0 25px #f59e0b'}}>Кейс Олимп⚡️</h2>
                                
                                <div className="w-32 h-32 mx-auto rounded-2xl bg-gradient-to-br from-yellow-400 to-amber-600 flex items-center justify-center text-6xl mb-4 shadow-lg border-4 border-yellow-500">⚡️</div>
                                
                                <div className="text-center mb-4">
                                    <div className="text-3xl font-bold" style={{color: '#fbbf24', textShadow: '0 0 10px #fbbf24'}}>
                                        {cases.olympus?.freeCount > 0 ? 'Бесплатно!' : '77⭐️'}
                                    </div>
                                    {cases.olympus?.freeCount > 0 && <div className="text-green-400 text-sm mt-1 font-bold">Осталось бесплатных: {cases.olympus.freeCount}</div>}
                                </div>
                                
                                <button onClick={() => handleSelectCase(cases.olympus)} className="w-full olympus-btn py-3 rounded-xl font-bold text-lg text-white hover:scale-105 transition mb-4">Открыть⭐️</button>
                                
                                <h2 className="text-2xl font-bold text-center mb-4" style={{color: '#fbbf24', textShadow: '0 0 15px #fbbf24, 0 0 25px #f59e0b'}}>Лестница наград</h2>
                                
                                <div className="space-y-2">
                                    {olympusRewards.map((r, i) => {
                                        const progress = Math.min(100, (olympusOpens / r.opens) * 100);
                                        return (
                                            <div key={i} className="relative">
                                                <div className="flex justify-between items-center mb-1">
                                                    <div className="text-sm font-bold text-white">{r.opens} открытий</div>
                                                    <div className={`text-xs ${r.claimed ? 'text-green-400' : 'text-yellow-400'} font-bold`}>{r.reward}</div>
                                                </div>
                                                <div className="olympus-progress rounded-full h-4 overflow-hidden">
                                                    <div className="olympus-progress-fill h-full transition-all duration-500" style={{width: `${progress}%`}}></div>
                                                </div>
                                                {r.claimed && <div className="text-green-400 text-xs text-center mt-1 font-bold">✅ Получено</div>}
                                            </div>
                                        );
                                    })}
                                </div>
                                
                                <div className="text-center mt-4">
                                    <div className="text-yellow-400 font-bold text-lg" style={{textShadow: '0 0 10px #fbbf24'}}>Открыто: {olympusOpens}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="min-h-screen pb-24">
                    <header className="p-4 flex justify-between items-center glass sticky top-0 z-50">
                        <h1 onClick={handleTitleClick} className="text-xl font-bold cursor-pointer select-none hover:text-cyan-300 transition">Step By Step Game</h1>
                        <button onClick={() => setShowTopUp(true)} className="bg-gradient-to-r from-yellow-400 to-orange-500 px-4 py-2 rounded-full font-bold text-gray-900 shadow-lg text-sm">{balance.toFixed(2)} ⭐️</button>
                    </header>
                    
                    {paymentStatus && <div className="mx-4 mt-2 p-3 rounded-lg text-center text-xs bg-blue-500/20 border border-blue-500">{paymentStatus}</div>}
                    
                    {showRandomCaseModal && (
                        <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4">
                            <div className="glass rounded-2xl p-6 max-w-sm w-full text-center">
                                <div className="text-6xl mb-4 animate-bounce">📦</div>
                                <h3 className="text-xl font-bold mb-2">Случайный Кейс</h3>
                                <p className="mb-4 text-sm">Обменять этот ящик на один случайный бесплатный кейс из списка?</p>
                                <div className="space-y-3">
                                    <button onClick={exchangeRandomCaseBox} className="w-full bg-green-600 hover:bg-green-500 py-3 rounded-xl font-bold">Обменять</button>
                                    <button onClick={() => setShowRandomCaseModal(false)} className="w-full bg-gray-600 hover:bg-gray-500 py-2 rounded-xl text-sm font-bold">Отмена</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {showCollectibleModal && (
                        <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4">
                            <div className="glass rounded-2xl p-6 max-w-sm w-full text-center">
                                <div className="text-6xl mb-4 animate-bounce">{selectedCollectible?.emoji}</div>
                                <h3 className="text-xl font-bold mb-2">Коллекционный предмет!</h3>
                                <p className="mb-4 text-sm">Обратитесь к <a href="https://t.me/stepbystepdelision" target="_blank" className="text-blue-400 underline">администрации</a></p>
                                <button onClick={() => setShowCollectibleModal(false)} className="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold">Понятно</button>
                            </div>
                        </div>
                    )}
                    
                    {showIceGiftModal && (
                        <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4">
                            <div className="glass rounded-2xl p-6 max-w-sm w-full text-center border border-cyan-500/50">
                                <div className="text-6xl mb-4">🧊</div>
                                <h3 className="text-xl font-bold mb-2 text-cyan-300">Ледяной Подарок!</h3>
                                <div className="space-y-3">
                                    <button onClick={sellIceGift} className="w-full bg-orange-600 hover:bg-orange-500 py-3 rounded-xl font-bold transition">🔥 Продать за 25⭐️</button>
                                    <button onClick={() => { setShowIceGiftModal(false); setSelectedIceGift(null); }} className="w-full bg-cyan-600 hover:bg-cyan-500 py-3 rounded-xl font-bold transition">💎 Оставить</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {showOlympusItemModal && selectedOlympusItem && (
                        <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4">
                            <div className="glass rounded-2xl p-6 max-w-sm w-full text-center border border-yellow-500/50">
                                <div className="text-6xl mb-4">{selectedOlympusItem.emoji}</div>
                                <h3 className="text-xl font-bold mb-3 text-yellow-300">{selectedOlympusItem.name}</h3>
                                <p className="mb-4 text-sm text-gray-200">Продать {selectedOlympusItem.name} за {selectedOlympusItem.sellPrice}⭐️?</p>
                                <div className="space-y-3">
                                    <button onClick={sellOlympusItem} className="w-full bg-orange-600 hover:bg-orange-500 py-3 rounded-xl font-bold transition">Продать за {selectedOlympusItem.sellPrice}⭐️</button>
                                    <button onClick={() => { setShowOlympusItemModal(false); setSelectedOlympusItem(null); }} className="w-full bg-gray-600 hover:bg-gray-500 py-3 rounded-xl font-bold transition">Оставить</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {showAdminLogin && (
                        <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4">
                            <div className="glass rounded-2xl p-6 max-w-sm w-full">

                                {spinResult ? (
                                    <div className="text-center">
                                        <p className="text-xl font-bold mb-2">🎉 Выпало: {spinResult.name}!</p>
                                        {spinResult.type === 'collectible' && <p className="text-yellow-400 text-xs mb-4">⭐️ Коллекционный предмет!</p>}
                                        <button onClick={() => { setSpinResult(null); openCase(selectedCase.id); }} className="w-full bg-green-600 hover:bg-green-500 py-3 rounded-xl font-bold mb-2 transition">Забрать и открыть ещё</button>
                                        <button onClick={() => { setSelectedCase(null); setSpinResult(null); setFakeItems([]); }} className="w-full bg-gray-600 hover:bg-gray-500 py-2.5 rounded-xl font-bold transition text-sm">К кейсам</button>
                                    </div>
                                ) : (
                                    <button onClick={() => openCase(selectedCase.id)} disabled={isSpinning || (selectedCase.id === 'daily' && selectedCase.freeCount === 0)} className="w-full bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 py-4 rounded-xl font-bold text-lg disabled:opacity-50 shadow-lg transition">
                                        {isSpinning ? '🌀 Крутим...' : (selectedCase.id === 'daily' && selectedCase.freeCount === 0 ? dailyCaseTimeLeft : `Открыть за ${getCasePrice(selectedCase.id) === 0 ? 'Бесплатно' : getCasePrice(selectedCase.id) + '⭐️'}`)}
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                    
                    {showTopUp && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div className="glass rounded-2xl p-5 max-w-sm w-full">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold">💳 Пополнение</h3>
                                    <button onClick={() => setShowTopUp(false)} className="text-2xl hover:text-red-400 transition">×</button>
                                </div>
                                <p className="text-xs text-gray-400 text-center mb-3">⭐️ Telegram Stars</p>
                                <div className="space-y-2 mb-4">
                                    {STARS_PACKAGES.map(pkg => (
                                        <button key={pkg.stars} onClick={() => buyStars(pkg)} className="w-full glass p-3 rounded-xl flex justify-between items-center hover:bg-white/10 transition border border-white/10">
                                            <span className="font-bold text-yellow-400 text-sm">+{pkg.stars} ⭐️</span>
                                            <span className="text-gray-300 text-xs">Купить</span>
                                        </button>
                                    ))}
                                </div>
                                <div className="border-t border-gray-600 pt-4">
                                    <p className="text-xs text-gray-400 text-center mb-3">💎 TON</p>
                                    {TON_RATES.map(rate => (
                                        <button key={rate.stars} onClick={() => topUpBalance(rate.stars, rate.ton)} className="w-full glass p-3 rounded-xl flex justify-between items-center hover:bg-white/10 transition border border-white/10 mb-2">
                                            <span className="font-bold text-sm">+{rate.stars}⭐️</span>
                                            <span className="text-yellow-400 font-bold text-sm">{rate.ton} TON</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <nav className="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-2 z-40">
                        <div className="max-w-md mx-auto flex justify-around">
                            {[ { id: 'tasks', emoji: '📋', label: 'Задания' }, { id: 'cases', emoji: '🎁', label: 'Кейсы' }, { id: 'events', emoji: '🏛️', label: 'Ивенты' }, { id: 'games', emoji: '🎮', label: 'Игры' }, { id: 'profile', emoji: '👤', label: 'Профиль' } ].map(s => (
                                <button key={s.id} onClick={() => { setCurrentScreen(s.id); setOlympusSubScreen(null); }} className={`flex flex-col items-center p-2 rounded-lg transition ${currentScreen === s.id ? 'events-tab-active text-yellow-400 scale-110' : 'text-gray-400 hover:text-white'}`}>
                                    <span className="text-2xl">{s.emoji}</span>
                                    <span className="text-xs font-bold">{s.label}</span>
                                </button>
                            ))}
                        </div>
                    </nav>
                </div>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
