        }
        .ice-circle {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 4px solid rgba(0,210,255,0.5);
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle, rgba(0,210,255, 0%), rgba(0,128,255,0.2) 160px, rgba(0,128,255,0.4) 100%);

        }
        .ice-ball {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #fff, #00d2ff);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,210,255,0.8);
            z-index: 10;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255,255,255,0.5);
            transition: left 0.025s linear, top 0.025s linear;
        }
        .player-avatar {
            position: absolute;

            height: 40px;

            // Онлайн статус

            // Сохранение данных

            useEffect(() => {

            // Подписка на лобби

            const adminGiveReward = async (targetUserId, reward) => {

                }
                alert('Награда выдана!');

            const joinIceLobby = async (lobbyId) => {
                const lobbyRef = db.ref('iceLobbies/' + lobbyId);
                const snap = await lobbyRef.once('value');
                const data = snap.val() || {};

                // Если игра уже началась, заходим как наблюдатель
                if (data.gameStarted) {
                    setCurrentGame({ type: 'ice', lobbyId });
                    setObserverMode(true);
                    return;
                }

                // Если таймер активен (игроки готовятся), сбрасываем всё
                if (data.countdownStarted && data.status === 'betting') {
                    await lobbyRef.update({
                        status: 'waiting',
                        timerEnd: null,

                        readyPlayers: {},

                        allBetsPlaced: false
                    });

                }

                // Очищаем если статус finished
                if (data.status === 'finished' || data.status === 'playing') {
                    await lobbyRef.update({
                        status: 'waiting',
                        players: {},
                        winner: null,
                        prizes: [],
                        ballPosition: { x: 50, y: 50, vx: 0, vy: 0 },
                        timerEnd: null,
                        lastWinnerId: null,
                        allBetsPlaced: false,
                        prizeClaimed: {},
                        readyPlayers: {},
                        countdownStarted: false,
                        gameStarted: false,
                        observers: {}
                    });
                }

                setCurrentGame({ type: 'ice', lobbyId });
                setObserverMode(false);
            };

            const placeBet = async () => {
                if (balance < myBet) {
                    alert('Недостаточно звезд!');
                    return;
                }
                if (myBet < 25) {
                    alert('Минимум 25⭐️!');
                    return;
                }

                const lobbyRef = db.ref('iceLobbies/' + currentGame.lobbyId);
                const snap = await lobbyRef.once('value');
                const data = snap.val();

                // Проверяем, не началась ли игра
                if (data.gameStarted) {
                    alert('Игра уже началась! Вы можете только наблюдать.');
                    return;
                }

                // Проверяем количество игроков
                const playerCount = data.players ? Object.keys(data.players).length : 0;
                if (playerCount >= 15) {
                    alert('Лобби заполнено (максимум 15 игроков)!');
                    return;
                }

                // Списываем звёзды
                const newBalance = balance - myBet;
                setBalance(newBalance);
                await db.ref('users/' + user.id + '/balance').set(newBalance);

                await lobbyRef.child('players/' + user.id).set({
                    name: user.name,
                    avatar: user.avatar,
                    bet: myBet,
                    color: `hsl(${Math.random() * 360}, 70%, 50%)`,
                    timestamp: Date.now()
                });

                await lobbyRef.child('readyPlayers/' + user.id).remove();
                setIsReady(false);
            };

            const toggleReady = async () => {
                if (!hasBet) return;

                const lobbyRef = db.ref('iceLobbies/' + currentGame.lobbyId);
                const snap = await lobbyRef.once('value');
                const data = snap.val();

                if (data.gameStarted) return;

                const newReadyState = !isReady;
                setIsReady(newReadyState);

                if (newReadyState) {
                    await lobbyRef.child('readyPlayers/' + user.id).set(true);
                } else {
                    await lobbyRef.child('readyPlayers/' + user.id).remove();
                }

                // Проверяем условия начала игры
                const playersCount = Object.keys(data.players || {}).length;
                const readyPlayersCount = Object.keys(data.readyPlayers || {}).length + (newReadyState ? 1 : -1);

                if (playersCount >= 2 && readyPlayersCount >= 2 && readyPlayersCount === playersCount && !data.countdownStarted) {
                    // Запускаем таймер 10 секунд
                    const timerEnd = Date.now() + 10000;
                    await lobbyRef.update({
                        status: 'betting',
                        timerEnd: timerEnd,
                        countdownStarted: true,
                        allBetsPlaced: true
                    });

                    setTimeout(() => startIceGame(lobbyRef), 10000);
                }
            };

            const startIceGame = async (lobbyRef) => {
                const snap = await lobbyRef.once('value');
                const data = snap.val();

                // Проверяем, не сбросился ли таймер
                if (!data.countdownStarted || data.status !== 'betting') return;

                await lobbyRef.update({
                    status: 'playing',
                    gameStarted: true
                });

                let x = 50, y = 50, vx = (Math.random() - 0.5) * 20, vy = (Math.random() - 0.5) * 20;

                const interval = setInterval(async () => {
                    x += vx * 0.5;
                    y += vy * 0.5;

                    const dx = x - 50;
                    const dy = y - 50;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance >= 42) {
                        const angle = Math.atan2(dy, dx);
                        const normalX = Math.cos(angle);
                        const normalY = Math.sin(angle);
                        const dot = vx * normalX + vy * normalY;
                        vx = vx - 2 * dot * normalX;
                        vy = vy - 2 * dot * normalY;
                        x = 50 + 41 * Math.cos(angle);
                        y = 50 + 41 * Math.sin(angle);
                        vx *= 0.95;
                        vy *= 0.95;
                    }

                    vx *= 0.998;
                    vy *= 0.998;

                    await lobbyRef.child('ballPosition').set({ x, y, vx, vy });

                    if (Math.abs(vx) < 0.1 && Math.abs(vy) < 0.1) {
                        clearInterval(interval);
                        await finishIceGame(lobbyRef, x, y);
                    }
                }, 25);
            };

            const finishIceGame = async (lobbyRef, finalX, finalY) => {
                const snap = await lobbyRef.once('value');
                const data = snap.val();
                if (!data.players) return;

                const players = Object.entries(data.players);
                const totalBet = players.reduce((sum, [, p]) => sum + p.bet, 0);

                const dx = finalX - 50;
                const dy = finalY - 50;
                let angle = Math.atan2(dy, dx) * 180 / Math.PI;
                if (angle < 0) angle += 360;

                let currentAngle = 0, winner = null;
                const sorted = players.sort((a, b) => a[1].timestamp - b[1].timestamp);

                for (const [id, p] of sorted) {
                    const sector = (p.bet / totalBet) * 360;
                    if (angle >= currentAngle && angle < currentAngle + sector) {
                        winner = { id, ...p };
                        break;
                    }
                    currentAngle += sector;
                }

                if (!winner) winner = { id: sorted[0][0], ...sorted[0][1] };

                const rand = Math.random() * 100;
                let cum = 0, wonPrize = ICE_ARENA_PRIZES[0];
                for (const prize of ICE_ARENA_PRIZES) {
                    cum += prize.chance;
                    if (rand <= cum) {
                        wonPrize = prize;
                        break;
                    }
                }

                if (wonPrize.type === 'promo') {
                    const currentWonPromos = data.wonPromos || [];
                    await lobbyRef.child('wonPromos').set([...currentWonPromos, 'DELLKO']);
                    const userSnap = await db.ref('users/' + winner.id).once('value');
                    const userData = userSnap.val() || {};
                    const userWonPromos = userData.wonPromos || [];
                    await db.ref('users/' + winner.id + '/wonPromos').set([...userWonPromos, 'DELLKO']);
                    if (winner.id === user.id) setWonPromos(prev => [...prev, 'DELLKO']);
                }

                await lobbyRef.update({
                    status: 'finished',
                    winner,
                    prizes: [wonPrize],
                    finalBall: { x: finalX, y: finalY },
                    allBetsPlaced: false
                });

                // Начисляем 45% от общей ставки победителю
                if (winner.id === user.id) {
                    const winAmount = Math.floor(totalBet * 0.45);
                    const newBalance = balance + winAmount;
                    setBalance(newBalance);
                    await db.ref('users/' + user.id + '/balance').set(newBalance);
                }
            };

            const leaveLobby = async () => {

                    if (remainingPlayers.length === 0) {

            const openChest = async () => {

            const getCasePrice = (caseType) => {

            const openCase = async (caseType) => {
                const price = getCasePrice(caseType);

                // Проверяем бесплатные прокруты
                if (freeSpins[caseType] > 0) {
                    const newFreeSpins = { ...freeSpins, [caseType]: freeSpins[caseType] - 1 };

                if (price > 0 && balance < price) {

                // Списываем звёзды ТОЛЬКО если не бесплатный кейс
                if (price > 0) {

                    await db.ref('users/' + user.id + '/balance').set(newBalance);

                if (cases[caseType].freeCount > 0) {

            const performSpin = async (caseType, isFreeSpin) => {
                setIsSpinning(true);

                setTimeout(async () => {
                    const items = CASE_REWARDS[caseType];

                    let cum = 0, won = items[0];

                    for (const item of items) {
                        cum += item.realChance;
                        if (rand <= cum) {
                            won = item;
                            break;

                    }

                    setSpinResult(won);
                    setIsSpinning(false);

                    if (won.type === 'stars') {

            const addToInventory = async (item) => {
                if (inventory.length < inventorySlots) {

            const sellItem = async (item) => {

                }

                if (item.type === 'collectible') {
                    if (item.name && item.name.includes('🧊') && item.part === 3) {
                        if (confirm('Обменять 3 льда на 5 зимних кейсов и 1000⭐️?')) {
                            const newBalance = balance + 1000;
                            setBalance(newBalance);
                            setCases(prev => ({ ...prev, winter: { ...prev.winter, freeCount: prev.winter.freeCount + 5 } }));
                            const newInventory = inventory.filter(i => !(i.name && i.name.includes('🧊')));
                            setInventory(newInventory);
                            await db.ref(`users/${user.id}`).update({
                                balance: newBalance,
                                inventory: newInventory,
                                'cases/winter/freeCount': cases.winter.freeCount + 5
                            });

                        return;
                    }
                    setSelectedCollectible(item);
                    setShowCollectibleModal(true);
                    return;
                }

                if (confirm(`Продать ${item.name} за ${item.sellPrice}⭐️?`)) {
                    const newBalance = balance + item.sellPrice;
                    const newInventory = inventory.filter(i => i.uniqueId !== item.uniqueId);
                    setBalance(newBalance);
                    setInventory(newInventory);
                    await db.ref(`users/${user.id}`).update({ balance: newBalance, inventory: newInventory });
                }
            };

            const sellIceGift = async () => {
                if (!selectedIceGift) return;
                const newBalance = balance + 25;
                const newInventory = inventory.filter(i => i.uniqueId !== selectedIceGift.uniqueId);
                setBalance(newBalance);
                setInventory(newInventory);
                await db.ref(`users/${user.id}`).update({ balance: newBalance, inventory: newInventory });
                setShowIceGiftModal(false);
                setSelectedIceGift(null);
                alert('Продано за 25⭐️!');
            };

            const keepIceGift = () => {
                setShowIceGiftModal(false);
                setSelectedIceGift(null);
            };

            const unlockSlot = async () => {
                if (balance >= 50) {
                    if (confirm('Разблокировать слот за 50 ⭐️?')) {
                        const newBalance = balance - 50;
                        const newSlots = inventorySlots + 1;
                        setBalance(newBalance);
                        setInventorySlots(newSlots);
                        await db.ref(`users/${user.id}`).update({ balance: newBalance, inventorySlots: newSlots });
                    }
                } else {
                    alert('Недостаточно звезд!');
                }
            };

            const checkPromo = async () => {
                const code = promoCode.toUpperCase();
                if (usedPromos.includes(code)) {
                    setPromoError('Уже использован!');
                    return;
                }

                if (code === 'DELLKO') {
                    if (!wonPromos.includes('DELLKO')) {
                        setPromoError('Этот промокод можно активировать только если вы выиграли его в Ледяном Катке!');
                        return;
                    }
                    const newCases = { ...cases, money: { ...cases.money, freeCount: cases.money.freeCount + 3 } };
                    setCases(newCases);
                    await addToInventory({ name: '🧊 Лёд (1/3)', emoji: '🧊', type: 'ice', part: 1, uniqueId: Date.now() });
                    setPromoSuccess('Промокод активирован! +3 денежных кейса + 🧊');
                    setPromoCode('');
                    const newPromos = [...usedPromos, code];
                    setUsedPromos(newPromos);
                    await db.ref(`users/${user.id}/usedPromos`).set(newPromos);
                } else if (code === 'DIAMOND') {
                    const newCases = { ...cases, diamond: { ...cases.diamond, freeCount: cases.diamond.freeCount + 2 } };
                    setCases(newCases);
                    setPromoSuccess('+2 кейса Алмаз!');
                    setPromoCode('');
                    const newPromos = [...usedPromos, code];
                    setUsedPromos(newPromos);
                    await db.ref(`users/${user.id}/usedPromos`).set(newPromos);
                } else {
                    setPromoError('Неверный промокод');
                    return;
                }
            };

            const generatePaymentId = () => {
                return 'PAY_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            };

            const topUpBalance = async (stars, ton) => {
                const paymentId = generatePaymentId();
                const memo = `SBS_${user.id}_${stars}_${paymentId}`;
                const newPayment = {
                    id: paymentId,
                    stars: stars,
                    ton: ton,
                    memo: memo,
                    status: 'pending',
                    createdAt: Date.now(),
                    userId: user.id
                };
                setPendingPayments(prev => [...prev, newPayment]);

                const tonLink = `ton://transfer/${ADMIN_WALLET}?amount=${Math.round(ton * 1000000000)}&text=${encodeURIComponent(memo)}`;
                window.open(tonLink, '_blank');
                setPaymentStatus(`Отправьте ${ton} TON с комментарием: ${memo}`);
                setShowTopUp(false);
                setTimeout(() => checkPayment(paymentId), 10000);
            };

            const checkPayment = async (paymentId) => {
                const payment = pendingPayments.find(p => p.id === paymentId);
                if (!payment || payment.status === 'completed') return;

                setCheckingPayment(true);
                setPaymentStatus('Проверяем платеж...');

                try {
                    const response = await fetch(`${TONCENTER_API}/getTransactions?address=${ADMIN_WALLET}&limit=20`);
                    const data = await response.json();

                    if (data.result && Array.isArray(data.result)) {
                        const foundTx = data.result.find(tx => {
                            const msg = tx.in_msg;
                            if (!msg) return false;
                            const amount = parseInt(msg.value) / 1000000000;
                            const comment = msg.message || '';
                            return comment.includes(payment.memo) && Math.abs(amount - payment.ton) < 0.01;
                        });

                        if (foundTx) {
                            const newBalance = balance + payment.stars;
                            const newTotalDeposits = totalDeposits + payment.stars;
                            setBalance(newBalance);
                            setTotalDeposits(newTotalDeposits);

                            const newPayments = pendingPayments.map(p =>
                                p.id === paymentId ? {...p, status: 'completed', txHash: foundTx.transaction_id.hash} : p
                            );
                            setPendingPayments(newPayments);
                            setPaymentStatus(`✅ Успешно! Зачислено ${payment.stars} звезд`);

                            await db.ref(`users/${user.id}`).update({
                                balance: newBalance,
                                totalDeposits: newTotalDeposits
                            });

                            // Проверяем задания
                            if (!tasks.deposit.completed && newTotalDeposits >= 100) {
                                const newTasks = { ...tasks, deposit: { completed: true } };
                                const newCases = { ...cases, gold: { ...cases.gold, freeCount: cases.gold.freeCount + 1 } };
                                setTasks(newTasks);
                                setCases(newCases);
                                await db.ref(`users/${user.id}`).update({ tasks: newTasks, cases: newCases });
                            }

                            if (!tasks.depositMajor.completed && newTotalDeposits >= 350) {
                                const newTasks = { ...tasks, depositMajor: { completed: true } };
                                const newCases = { ...cases, collector: { ...cases.collector, locked: false, freeCount: cases.collector.freeCount + 1 } };
                                setTasks(newTasks);
                                setCases(newCases);
                                await db.ref(`users/${user.id}`).update({ tasks: newTasks, cases: newCases });
                            }

                            setTimeout(() => setPaymentStatus(''), 3000);
                        } else {
                            setPaymentStatus('Платеж не найден. Попробуйте через минуту...');
                        }
                    }
                } catch (error) {
                    setPaymentStatus('Ошибка проверки. Попробуйте позже.');
                } finally {
                    setCheckingPayment(false);
                }
            };

            const buyStars = async (pkg) => {
                try {
                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/createInvoiceLink`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title: `${pkg.stars} звезд`,
                            description: `Покупка ${pkg.stars} звезд в Step By Step Game`,
                            payload: `stars_${user.id}_${pkg.stars}_${Date.now()}`,
                            currency: 'XTR',
                            prices: [{ label: `${pkg.stars} звезд`, amount: pkg.price }]
                        })
                    });

                    const data = await response.json();
                    if (data.ok && data.result) {
                        if (TelegramWebApp) {
                            TelegramWebApp.openInvoice(data.result, async (status) => {
                                if (status === 'paid') {
                                    const newBalance = balance + pkg.stars;
                                    const newTotalDeposits = totalDeposits + pkg.stars;
                                    setBalance(newBalance);
                                    setTotalDeposits(newTotalDeposits);
                                    await db.ref(`users/${user.id}`).update({
                                        balance: newBalance,
                                        totalDeposits: newTotalDeposits
                                    });

                                    if (!tasks.deposit.completed && newTotalDeposits >= 100) {
                                        const newTasks = { ...tasks, deposit: { completed: true } };
                                        const newCases = { ...cases, gold: { ...cases.gold, freeCount: cases.gold.freeCount + 1 } };
                                        setTasks(newTasks);
                                        setCases(newCases);
                                        await db.ref(`users/${user.id}`).update({ tasks: newTasks, cases: newCases });
                                    }

                                    if (!tasks.depositMajor.completed && newTotalDeposits >= 350) {
                                        const newTasks = { ...tasks, depositMajor: { completed: true } };
                                        const newCases = { ...cases, collector: { ...cases.collector, locked: false, freeCount: cases.collector.freeCount + 1 } };
                                        setTasks(newTasks);
                                        setCases(newCases);
                                        await db.ref(`users/${user.id}`).update({ tasks: newTasks, cases: newCases });
                                    }

                                    alert(`✅ Успешно! Зачислено ${pkg.stars} звезд!`);
                                } else {
                                    alert('Оплата не завершена');
                                }
                            });
                        } else {
                            window.open(data.result, '_blank');
                            alert('После оплаты нажмите ОК для проверки');
                            const newBalance = balance + pkg.stars;
                            const newTotalDeposits = totalDeposits + pkg.stars;
                            setBalance(newBalance);
                            setTotalDeposits(newTotalDeposits);
                            await db.ref(`users/${user.id}`).update({
                                balance: newBalance,
                                totalDeposits: newTotalDeposits
                            });

                            if (!tasks.deposit.completed && newTotalDeposits >= 100) {
                                const newTasks = { ...tasks, deposit: { completed: true } };
                                const newCases = { ...cases, gold: { ...cases.gold, freeCount: cases.gold.freeCount + 1 } };
                                setTasks(newTasks);
                                setCases(newCases);
                                await db.ref(`users/${user.id}`).update({ tasks: newTasks, cases: newCases });
                            }

                            if (!tasks.depositMajor.completed && newTotalDeposits >= 350) {
                                const newTasks = { ...tasks, depositMajor: { completed: true } };
                                const newCases = { ...cases, collector: { ...cases.collector, locked: false, freeCount: cases.collector.freeCount + 1 } };
                                setTasks(newTasks);
                                setCases(newCases);
                                await db.ref(`users/${user.id}`).update({ tasks: newTasks, cases: newCases });
                            }
                        }
                    } else {
                        alert('Ошибка создания платежа: ' + (data.description || 'Unknown error'));
                    }
                } catch (error) {
                    console.error('Stars payment error:', error);
                    alert('Ошибка платежа. Попробуйте позже.');
                }
            };

            const completeTask = async (taskId) => {
                if (taskId === 'subscribe') {
                    window.open('https://t.me/stepbystepdelision', '_blank');
                    setTimeout(async () => {
                        if (!tasks.subscribe.completed) {
                            const newTasks = { ...tasks, subscribe: { completed: true } };
                            // Даём 1 бесплатный прокрут кейса Элита
                            const newFreeSpins = { ...freeSpins, elite: (freeSpins.elite || 0) + 1 };
                            setTasks(newTasks);
                            setFreeSpins(newFreeSpins);
                            await db.ref(`users/${user.id}`).update({
                                tasks: newTasks,

                            alert('🎉 Получен бесплатный прокрут кейса Элита!');

                    setShowTopUp(true);
                } else if (taskId === 'depositMajor') {
                    setShowTopUp(true);
                } else if (taskId === 'invite') {
                    const link = 'https://t.me/share/url?url=' + encodeURIComponent(`https://t.me/stepbystep_game_bot?start=${user.id}`);
                    window.open(link, '_blank');

            };

            const handleWithdraw = () => {

                    alert('Для получения награды обратитесь к администрации, предоставив скриншоты выбора! https://t.me/stepbystepdelision');

            const confirmWithdraw = (type) => {
                alert('Для получения награды обратитесь к администрации, предоставив скриншоты выбора! https://t.me/stepbystepdelision');
                setShowWithdrawModal(false);
                setWithdrawAmount('');
            };

            const renderIceArenaField = () => {
                if (!iceLobby?.players) return null;
                const players = Object.entries(iceLobby.players);
                const totalBet = players.reduce((sum, [, p]) => sum + p.bet, 0);
                let currentAngle = 0;

                return players.map(([id, player], idx) => {
                    const percentage = totalBet > 0 ? (player.bet / totalBet) * 100 : 50;
                    const sectorAngle = (player.bet / totalBet) * 360;
                    const midAngle = currentAngle + sectorAngle / 2;
                    const avatarRadius = 35 * (percentage / 100);
                    const avatarX = 50 + avatarRadius * Math.cos((midAngle - 90) * Math.PI / 180);
                    const avatarY = 50 + avatarRadius * Math.sin((midAngle - 90) * Math.PI / 180);
                    currentAngle += sectorAngle;

                    return (
                        <React.Fragment key={id}>
                            <div className="absolute inset-0" style={{
                                background: `conic-gradient(from ${currentAngle - sectorAngle}deg, ${player.color}${Math.round(percentage) > 50 ? 'cc' : '99'} 0deg, ${player.color}${Math.round(percentage) > 50 ? 'cc' : '99'} ${sectorAngle}deg, transparent ${sectorAngle}deg)`,
                                clipPath: 'circle(50% at 50% 50%)',
                                boxShadow: `inset 0 0 30px ${player.color}40`
                            }} />
                            <div className="absolute text-2xl font-bold pointer-events-none" style={{
                                left: `${50 + 25 * Math.cos((midAngle - 90) * Math.PI / 180)}%`,
                                top: `${50 + 25 * Math.sin((midAngle - 90) * Math.PI / 180)}%`,
                                transform: 'translate(-50%, -50%)',
                                color: 'white',
                                textShadow: '0 0 10px black, 0 0 20px black'
                            }}>
                                {Math.round(percentage)}%
                            </div>
                            <div className="player-avatar" style={{
                                left: `${avatarX}%`,
                                top: `${avatarY}%`,
                                borderColor: player.color,
                                boxShadow: `0 0 15px ${player.color}`
                            }}>
                                {player.avatar ? (
                                    <img src={player.avatar} className="w-full h-full object-cover" />
                                ) : (
                                    <div className="w-full h-full bg-gray-600 flex items-center justify-center text-sm font-bold">
                                        {player.name[0]}
                                    </div>
                                )}
                            </div>
                        </React.Fragment>
                    );
                });
            };

            if (isAdmin) {
                return (
                    <div className="min-h-screen bg-gray-900 p-4">
                        <div className="max-w-4xl mx-auto">
                            <div className="flex justify-between items-center mb-6">
                                <h1 className="text-2xl font-bold text-white">🔐 Админ-панель</h1>
                                <button onClick={() => setIsAdmin(false)} className="text-gray-400 hover:text-white">Выйти</button>
                            </div>
                            <div className="flex gap-2 mb-6 overflow-x-auto">
                                {['stats', 'users', 'rewards', 'settings'].map(tab => (
                                    <button key={tab} onClick={() => setAdminScreen(tab)}
                                        className={`px-4 py-2 rounded-lg capitalize ${adminScreen === tab ? 'bg-indigo-600' : 'bg-gray-700'}`}>
                                        {tab === 'stats' && '📊'}
                                        {tab === 'users' && '👥'}
                                        {tab === 'rewards' && '🎁'}
                                        {tab === 'settings' && '⚙️'}
                                        {tab}
                                    </button>
                                ))}
                            </div>
                            <div className="glass rounded-xl p-6">
                                {adminScreen === 'stats' && (
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-gray-800 p-4 rounded-lg">
                                            <div className="text-gray-400">Всего игроков</div>
                                            <div className="text-3xl font-bold">{allUsers.length}</div>
                                        </div>
                                        <div className="bg-gray-800 p-4 rounded-lg">
                                            <div className="text-gray-400">Онлайн</div>
                                            <div className="text-3xl font-bold text-green-400">{onlineCount}</div>
                                        </div>
                                        <div className="bg-gray-800 p-4 rounded-lg">
                                            <div className="text-gray-400">Общий баланс</div>
                                            <div className="text-3xl font-bold">{allUsers.reduce((sum, u) => sum + (u.balance || 0), 0).toFixed(2)} ⭐️</div>
                                        </div>
                                        <div className="bg-gray-800 p-4 rounded-lg">
                                            <div className="text-gray-400">Подарков</div>
                                            <div className="text-3xl font-bold">{allUsers.reduce((sum, u) => sum + (u.inventory?.length || 0), 0)}</div>
                                        </div>
                                    </div>
                                )}
                                {adminScreen === 'users' && selectedUser && (
                                    <div className="bg-gray-800 p-4 rounded-lg mb-4">
                                        <h3 className="font-bold mb-4 text-xl">{selectedUser.name}</h3>
                                        <div className="grid grid-cols-2 gap-4 mb-4">
                                            <div className="bg-gray-700 p-3 rounded">
                                                <div className="text-gray-400 text-sm">Баланс</div>
                                                <div className="text-2xl font-bold text-yellow-400">{selectedUser.balance || 0}⭐️</div>
                                            </div>
                                            <div className="bg-gray-700 p-3 rounded">
                                                <div className="text-gray-400 text-sm">Кейсов</div>
                                                <div className="text-2xl font-bold text-blue-400">
                                                    {Object.values(selectedUser.cases || {}).reduce((a,b) => a + (b.freeCount || 0), 0)}
                                                </div>
                                            </div>
                                            <div className="bg-gray-700 p-3 rounded">
                                                <div className="text-gray-400 text-sm">Предметов</div>
                                                <div className="text-2xl font-bold text-purple-400">{selectedUser.inventory?.length || 0}</div>
                                            </div>
                                            <div className="bg-gray-700 p-3 rounded">
                                                <div className="text-gray-400 text-sm">Слотов</div>
                                                <div className="text-2xl font-bold">{selectedUser.inventorySlots || 5}</div>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-4 gap-2">
                                            <button onClick={() => adminGiveReward(selectedUser.id, { type: 'stars', amount: 100 })} className="bg-green-600 p-2 rounded">+100⭐️</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, { type: 'case', caseType: 'diamond', count: 5 })} className="bg-blue-600 p-2 rounded">+5💎</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, { type: 'case', caseType: 'winter', count: 3 })} className="bg-cyan-600 p-2 rounded">+3☃️</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, { type: 'case', caseType: 'elite', count: 2 })} className="bg-red-600 p-2 rounded">+2🎖</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, { type: 'case', caseType: 'money', count: 3 })} className="bg-green-500 p-2 rounded">+3💵</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, { type: 'ice_gift' })} className="bg-cyan-500 p-2 rounded">🧊 Лёд</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, { type: 'ice_cube' })} className="bg-blue-400 p-2 rounded">🧊 Кубик</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, { type: 'promo_dellko' })} className="bg-yellow-600 p-2 rounded">🎫 DELLKO</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, { type: 'unlock_collector' })} className="bg-purple-600 p-2 rounded">🔓 Коллекционер</button>
                                            <button onClick={() => setSelectedUser(null)} className="bg-gray-600 p-2 rounded col-span-4">Назад</button>
                                        </div>
                                    </div>
                                )}
                                {adminScreen === 'users' && !selectedUser && (
                                    <div className="space-y-2 max-h-96 overflow-y-auto">
                                        {allUsers.map(u => (
                                            <div key={u.id} onClick={() => setSelectedUser(u)}
                                                className="bg-gray-800 p-3 rounded-lg cursor-pointer hover:bg-gray-700 flex justify-between items-center">
                                                <div>
                                                    <div className="font-bold">{u.name}</div>
                                                    <div className="text-sm text-gray-400">{u.username || u.id.slice(0, 10)}</div>
                                                </div>

                                                    <div className="text-xs text-gray-500">{u.inventory?.length || 0} предметов</div>

                                            <button onClick={() => adminGiveReward(user.id, { type: 'item', item: { name: 'Алмаз PRO 💎', emoji: '💎', type: 'collectible', uniqueId: Date.now() } })} className="bg-pink-600 p-3 rounded">💎 Алмаз PRO</button>
                                            <button onClick={() => adminGiveReward(user.id, { type: 'ice_gift' })} className="bg-cyan-600 p-3 rounded">🧊 Лёд</button>
                                            <button onClick={() => adminGiveReward(user.id, { type: 'ice_cube' })} className="bg-blue-400 p-3 rounded">🧊 Кубик льда</button>
                                            <button onClick={() => adminGiveReward(user.id, { type: 'case', caseType: 'diamond', count: 10 })} className="bg-blue-600 p-3 rounded">+10 Алмаз</button>
                                            <button onClick={() => adminGiveReward(user.id, { type: 'case', caseType: 'winter', count: 5 })} className="bg-cyan-500 p-3 rounded">+5 Зимних</button>
                                            <button onClick={() => adminGiveReward(user.id, { type: 'case', caseType: 'collector', count: 3 })} className="bg-rose-600 p-3 rounded">+3 Коллекционер</button>
                                            <button onClick={() => adminGiveReward(user.id, { type: 'promo_dellko' })} className="bg-yellow-600 p-3 rounded">🎫 DELLKO</button>

                                {adminScreen === 'settings' && (

                                        }} className="bg-red-600 px-4 py-2 rounded-lg">🗑 Сбросить мой аккаунт</button>

            if (currentGame?.type === 'ice') {
