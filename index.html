    <style>
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

        @keyframes purpleGlow { 0%,100%{text-shadow:0 0 5px #a855f7,0 0 10px #a855f7} 50%{text-shadow:0 0 20px #a855f7,0 0 30px #9333ea} }
        @keyframes greenGlow { 0%,100%{box-shadow:0 0 5px #22c55e,0 0 10px #22c55e} 50%{box-shadow:0 0 15px #22c55e,0 0 25px #16a34a} }
        @keyframes yellowGlow { 0%,100%{text-shadow:0 0 5px #fbbf24,0 0 10px #fbbf24} 50%{text-shadow:0 0 20px #fbbf24,0 0 30px #f59e0b} }
        @keyframes olympGlow { 0%,100%{text-shadow:0 0 10px #fff7b0,0 0 22px #fbbf24,0 0 40px #f59e0b,0 3px 0 #000} 50%{text-shadow:0 0 20px #fff,0 0 40px #fbbf24,0 0 60px #f59e0b,0 3px 0 #000} }
        @keyframes btnGlow { 0%,100%{box-shadow:0 0 10px rgba(251,191,36,.5),0 8px 25px rgba(245,158,11,.4)} 50%{box-shadow:0 0 25px rgba(251,191,36,.9),0 8px 35px rgba(245,158,11,.7)} }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }
        @keyframes neonRed { 0%,100%{text-shadow:0 0 5px #f87171,0 0 10px #ef4444} 50%{text-shadow:0 0 15px #f87171,0 0 25px #ef4444} }

        .pulse-glow { animation: pulseGlow 2s ease-in-out infinite; }
        .special-header { animation: purpleGlow 3s infinite; }
        .ordinary-header { animation: goldGlow 3s infinite; }
        .olympus-font { font-family: 'Cinzel', serif; font-weight: 700; }
        .olympus-font-black { font-family: 'Cinzel', serif; font-weight: 900; }

        .glass { background:rgba(255,255,255,.1); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.2); }

        .daily-timer { color:#4ade80; font-family:monospace; font-weight:bold; font-size:14px; background:rgba(0,0,0,.6); padding:2px 8px; border-radius:6px; border:1px solid #22c55e; animation:greenGlow 2s infinite; display:inline-block; }
        .events-tab-active { background:linear-gradient(135deg,rgba(251,191,36,.3),rgba(245,158,11,.2)); border:2px solid rgba(251,191,36,.6); box-shadow:0 0 20px rgba(251,191,36,.4); }

        .roulette-container { position:relative; width:100%; height:160px; overflow:hidden; background:rgba(0,0,0,.4); border-radius:16px; border:2px solid rgba(255,255,255,.1); margin:20px 0; }
        .roulette-inner { display:flex; position:absolute; left:0; top:20px; transition:transform 6.5s cubic-bezier(.1,0,.1,1); will-change:transform; }
        .roulette-item { width:120px; height:120px; flex-shrink:0; margin:0 8px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.05)); border-radius:12px; border:1px solid rgba(255,255,255,.1); }
        .roulette-item .emoji { font-size:3.5rem; }
        .roulette-item .name { font-size:11px; opacity:.8; text-align:center; margin-top:4px; }
        .roulette-pointer { position:absolute; left:50%; top:0; bottom:0; width:4px; background:#ff4757; z-index:20; transform:translateX(-50%); box-shadow:0 0 20px #ff4757; }
        .roulette-pointer::before { content:''; position:absolute; top:-5px; left:50%; transform:translateX(-50%); border-left:10px solid transparent; border-right:10px solid transparent; border-top:15px solid #ff4757; }
        .roulette-pointer::after { content:''; position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); border-left:10px solid transparent; border-right:10px solid transparent; border-bottom:15px solid #ff4757; }

        /* Olympus Styles */
        .olympus-title {
            font-family:'Cinzel',serif; font-weight:900;
            color:#fff7b0;
            text-shadow:0 0 12px #fff7b0,0 0 25px #fbbf24,0 0 45px #f59e0b,0 3px 0 #000;
            animation: olympGlow 3s ease-in-out infinite;
        }
        .olympus-label {
            font-family:'Cinzel',serif; font-weight:700;

        }
        .hephaestus-text {
            font-family:'Cinzel',serif; font-weight:700;
            color:#ffffff;
            text-shadow:0 0 12px #fff,0 0 25px #fb923c,0 0 40px rgba(249,115,22,.9),0 3px 0 #000;
        }
        .olympus-btn {
            font-family:'Cinzel',serif; font-weight:900;

            border:2.5px solid rgba(255,237,74,1);
            border-radius:14px;
            padding:14px 22px;
            color:#fff7c2;
            text-shadow:0 0 10px #fff7c2,0 0 22px #f59e0b,0 2px 0 #000;
            cursor:pointer;
            transition:all .3s;
            backdrop-filter:blur(8px);
            box-shadow:0 8px 28px rgba(245,158,11,.5);
            animation: btnGlow 2.5s ease-in-out infinite;
            letter-spacing:.5px;
            font-size:15px;
            white-space:nowrap;
        }
        .olympus-btn:hover { background:linear-gradient(135deg,rgba(255,214,10,.6),rgba(245,158,11,.5)); transform:scale(1.06); }
        .olympus-btn:active { transform:scale(.97); }

        .progress-step { position:relative; padding:12px; border-radius:10px; border:2px solid rgba(251,191,36,.35); background:rgba(0,0,0,.5); margin-bottom:8px; transition:all .3s; }
        .progress-step.completed { border-color:#22c55e; background:rgba(34,197,94,.2); box-shadow:0 0 10px rgba(34,197,94,.4); }
        .progress-step.active { border-color:#fbbf24; background:rgba(251,191,36,.2); animation:pulse 2s infinite; }

        .line-thru { text-decoration:line-through; opacity:.6; color:#ef4444; text-decoration-color:#ef4444; text-decoration-thickness:2px; }

/* ═══════════════════════════════════════════════════════════════
   APP
═══════════════════════════════════════════════════════════════ */
function App() {
    /* ── base state ── */
    const [currentScreen, setCurrentScreen] = useState('cases');
    const [balance,        setBalance]        = useState(0);
    const [cases,          setCases]          = useState(INITIAL_CASES);
    const [inventory,      setInventory]      = useState([]);
    const [inventorySlots, setInventorySlots] = useState(5);
    const [tasks, setTasks] = useState({
        subscribe:    { completed:false },
        deposit:      { completed:false },
        depositMajor: { completed:false },
        inviteThree:  { completed:false, count:0, required:3, reward:25 },
        cardboard7:   { completed:false, count:0, required:7 },
        deposit50:    { completed:false },
    });
    const [user,         setUser]         = useState(null);
    const [isLoading,    setIsLoading]    = useState(true);
    const [dailyCaseTimeLeft, setDailyCaseTimeLeft] = useState('');
    const [onlineCount,  setOnlineCount]  = useState(Math.floor(Math.random()*300)+200);
    const [paymentStatus,setPaymentStatus]= useState('');
    const [totalDeposits,setTotalDeposits]= useState(0);
    const [freeEliteSpin,setFreeEliteSpin]= useState(0);
    const [usedPromos,   setUsedPromos]   = useState([]);
    const [wonPromos,    setWonPromos]    = useState([]);
    const [promoCode,    setPromoCode]    = useState('');
    const [promoError,   setPromoError]   = useState('');
    const [promoSuccess, setPromoSuccess] = useState('');

    /* ── roulette / case open ── */
    const [selectedCase,   setSelectedCase]   = useState(null);
    const [isSpinning,     setIsSpinning]      = useState(false);
    const [spinResult,     setSpinResult]      = useState(null);
    const [rouletteOffset, setRouletteOffset]  = useState(0);
    const [fakeItems,      setFakeItems]        = useState([]);
    const [rouletteKey,    setRouletteKey]      = useState(0);
    const rouletteContainerRef = useRef(null);

    /* ── modals ── */
    const [showTopUp,             setShowTopUp]             = useState(false);
    const [showWithdrawModal,     setShowWithdrawModal]     = useState(false);
    const [withdrawAmount,        setWithdrawAmount]        = useState('');
    const [showAdminLogin,        setShowAdminLogin]        = useState(false);
    const [adminLogin,            setAdminLogin]            = useState('');
    const [adminPassword,         setAdminPassword]         = useState('');
    const [isAdmin,               setIsAdmin]               = useState(false);
    const [adminScreen,           setAdminScreen]           = useState('stats');
    const [allUsers,              setAllUsers]              = useState([]);
    const [selectedUser,          setSelectedUser]          = useState(null);
    const [adminUserSearch,       setAdminUserSearch]       = useState('');
    const [adminAttempts,         setAdminAttempts]         = useState(0);
    const [showCollectibleModal,  setShowCollectibleModal]  = useState(false);
    const [selectedCollectible,   setSelectedCollectible]   = useState(null);
    const [showRandomCaseModal,   setShowRandomCaseModal]   = useState(false);
    const [randomCaseItem,        setRandomCaseItem]        = useState(null);

    /* ── olympus item result modal ── */
    const [showOlympusItemModal,  setShowOlympusItemModal]  = useState(false);
    const [selectedOlympusItem,   setSelectedOlympusItem]   = useState(null);

    /* ── poseidon / hades / zeus choice modals ── */
    const [showPoseidonModal, setShowPoseidonModal] = useState(false);
    const [showHadesModal,    setShowHadesModal]    = useState(false);
    const [showZeusModal,     setShowZeusModal]     = useState(false);

    /* ── gefest ── */
    const [showGefestModal,   setShowGefestModal]   = useState(false);
    const [gefestCooldownEnd, setGefestCooldownEnd] = useState(0);
    const [gefestCooldownStr, setGefestCooldownStr] = useState('');
    const [showGefestChoice,  setShowGefestChoice]  = useState(false);
    const [gefestChoiceCtx,   setGefestChoiceCtx]   = useState(null);

    /* ── events ── */
    const [eventScreen,      setEventScreen]      = useState('main');
    const [olympusOpens,     setOlympusOpens]     = useState(0);
    const [olympusProgress,  setOlympusProgress]  = useState([]);
    const [olympusTopPlayers,setOlympusTopPlayers]= useState([]);
    const [treasureBg,       setTreasureBg]       = useState(localStorage.getItem('olymp_bg') || 'case.jpg');

    /* ── gerakl ── */
    const [currentGame,       setCurrentGame]       = useState(null);
    const [geraklGameActive,  setGeraklGameActive]  = useState(false);
    const [geraklBetAmount,   setGeraklBetAmount]   = useState(25);
    const [geraklBetInput,    setGeraklBetInput]    = useState(25);
    const [geraklRound,       setGeraklRound]       = useState(0);
    const [geraklMultiplier,  setGeraklMultiplier]  = useState(1.0);
    const [geraklCurrentWin,  setGeraklCurrentWin]  = useState(0);
    const [geraklTimer,       setGeraklTimer]       = useState(25);
    const [geraklResult,      setGeraklResult]      = useState(null);
    const [geraklBoxOpened,   setGeraklBoxOpened]   = useState(false);
    const [geraklBoxPrize,    setGeraklBoxPrize]    = useState(null);

    /* ════ INIT ════ */
    useEffect(() => {
        const init = async () => {
            let userId = null;
            let userData = { name:'Гость', username:null, avatar:null };
            if (TelegramWebApp) {
                TelegramWebApp.ready(); TelegramWebApp.expand();
                const tg = TelegramWebApp.initDataUnsafe?.user;
                if (tg) {
                    userId = tg.id.toString();
                    userData = { name: tg.first_name + (tg.last_name ? ' '+tg.last_name : ''), username: tg.username ? '@'+tg.username : null, avatar: tg.photo_url || null };
                }
            }
            if (!userId) { userId = localStorage.getItem('sbs_user_id') || ('guest_'+Date.now()); }
            localStorage.setItem('sbs_user_id', userId);

            try {
                const snap = await db.ref('users/'+userId).once('value');
                const data = snap.val();
                if (data) {
                    const stored = data.cases || {};
                    const merged = {};
                    for (const cid in INITIAL_CASES) {
                        merged[cid] = { ...INITIAL_CASES[cid] };
                        const s = stored[cid];
                        if (s) {
                            merged[cid].freeCount = s.freeCount || 0;
                            if (s.locked !== undefined) merged[cid].locked = s.locked;
                            if (cid === 'daily' && s.lastOpened) merged[cid].lastOpened = s.lastOpened;
                        }
                    }
                    // ensure olympus case
                    if (!merged.olympus) {
                        merged.olympus = { id:'olympus', name:'Олимп⚡️', emoji:'⚡️', price:77, color:'from-yellow-400 to-amber-600', locked:false, freeCount:2, type:'event' };
                    } else {
                        merged.olympus = stored.olympus || { id:'olympus', name:'Олимп⚡️', emoji:'⚡️', price:77, color:'from-yellow-400 to-amber-600', locked:false, freeCount:2, type:'event' };
                        if ((merged.olympus.everGiven !== true) && (merged.olympus.freeCount || 0) < 2) {
                            merged.olympus.freeCount = 2;
                        }
                    }

                    setUser({ id:userId, ...userData, ...data });
                    setBalance(data.balance || 0);
                    setCases(merged);
                    setInventory(data.inventory || []);
                    const savedTasks = data.tasks || {};
                    setTasks({
                        subscribe:    savedTasks.subscribe    || { completed:false },
                        deposit:      savedTasks.deposit      || { completed:false },
                        depositMajor: savedTasks.depositMajor || { completed:false },
                        inviteThree:  savedTasks.inviteThree  || { completed:false, count:0, required:3, reward:25 },
                        cardboard7:   savedTasks.cardboard7   || { completed:false, count:0, required:7 },
                        deposit50:    savedTasks.deposit50    || { completed:false },
                    });
                    setInventorySlots(data.inventorySlots || 5);
                    setUsedPromos(data.usedPromos || []);
                    setWonPromos(data.wonPromos || []);
                    setTotalDeposits(data.totalDeposits || 0);
                    setFreeEliteSpin(data.freeEliteSpin || 0);
                    setOlympusOpens(data.olympusOpens || 0);
                    setOlympusProgress(data.olympusProgress || []);
                    setGefestCooldownEnd(data.gefestCooldownEnd || 0);
                    await db.ref('users/'+userId).update({ name:userData.name, username:userData.username||'', cases: merged });
                } else {
                    const olympCase = { id:'olympus', name:'Олимп⚡️', emoji:'⚡️', price:77, color:'from-yellow-400 to-amber-600', locked:false, freeCount:2, everGiven:true, type:'event' };
                    const newCases = { ...INITIAL_CASES, daily:{ ...INITIAL_CASES.daily, freeCount:1, lastOpened:0 }, diamond:{ ...INITIAL_CASES.diamond, freeCount:5 }, olympus: olympCase };
                    const newUser = { balance:0, cases:newCases, inventory:[], tasks:{ subscribe:{completed:false}, deposit:{completed:false}, depositMajor:{completed:false}, inviteThree:{completed:false,count:0,required:3,reward:25}, cardboard7:{completed:false,count:0,required:7}, deposit50:{completed:false} }, inventorySlots:5, usedPromos:[], wonPromos:[], createdAt:Date.now(), lastActive:Date.now(), totalDeposits:0, freeEliteSpin:0, olympusOpens:0, olympusProgress:[], gefestCooldownEnd:0, name:userData.name, username:userData.username||'' };
                    setCases(newCases);
                    setUser({ id:userId, ...userData });
                    await db.ref('users/'+userId).set(newUser);
                }
            } catch(e) { console.error(e); }
            setIsLoading(false);
        };
        init();
    }, []);

    /* ── online ── */
    useEffect(() => {
        if (!user?.id) return;
        const ref = db.ref('online/'+user.id);
        ref.set({ name:user.name, timestamp:Date.now() });
        ref.onDisconnect().remove();
        db.ref('online').on('value', snap => setOnlineCount(Math.floor(Math.random()*300)+200+snap.numChildren()));
        return () => ref.remove();
    }, [user?.id]);

    /* ── autosave ── */
    useEffect(() => {
        if (!user?.id || isLoading) return;
        const iv = setInterval(() => {
            db.ref('users/'+user.id).update({ balance, inventory, tasks, inventorySlots, usedPromos, wonPromos, lastActive:Date.now(), totalDeposits, freeEliteSpin, olympusOpens, olympusProgress, gefestCooldownEnd, 'cases/daily/lastOpened': cases.daily?.lastOpened, 'cases/daily/freeCount': cases.daily?.freeCount, 'cases/olympus/freeCount': cases.olympus?.freeCount||0, 'cases/olympus/everGiven': true });
        }, 5000);
        return () => clearInterval(iv);
    }, [balance, cases, inventory, tasks, inventorySlots, usedPromos, wonPromos, user?.id, isLoading, totalDeposits, freeEliteSpin, olympusOpens, olympusProgress, gefestCooldownEnd]);

    /* ── daily timer ── */
    useEffect(() => {
        if (isLoading || !cases.daily) return;
        const COOLDOWN = 23*60*60*1000;
        const timer = setInterval(() => {
            const last = cases.daily.lastOpened || 0;
            const diff = COOLDOWN - (Date.now()-last);
            if (diff <= 0) {
                if (cases.daily.freeCount === 0) setCases(p => ({ ...p, daily:{ ...p.daily, freeCount:1 } }));
                setDailyCaseTimeLeft('Доступно!');
            } else {
                const h = Math.floor(diff/(1000*60*60)), m = Math.floor((diff%(1000*60*60))/(1000*60)), s = Math.floor((diff%(1000*60))/1000);
                setDailyCaseTimeLeft(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`);
            }
        }, 1000);
        return () => clearInterval(timer);
    }, [cases.daily, isLoading]);

    /* ── gefest cooldown timer ── */
    useEffect(() => {
        const t = setInterval(() => {
            const remaining = gefestCooldownEnd - Date.now();
            if (remaining > 0) {
                const m = Math.floor(remaining/60000), s = Math.floor((remaining%60000)/1000);
                setGefestCooldownStr(`${m}:${String(s).padStart(2,'0')}`);
            } else {
                setGefestCooldownStr('');
            }
        }, 1000);
        return () => clearInterval(t);
    }, [gefestCooldownEnd]);

    /* ── gerakl timer ── */
    useEffect(() => {
        if (!geraklGameActive || geraklResult) return;
        const iv = setInterval(() => {
            setGeraklTimer(prev => { if (prev <= 1) { handleGeraklIce(); return 0; } return prev-1; });
        }, 1000);
        return () => clearInterval(iv);
    }, [geraklGameActive, geraklResult]);

    /* ── olympus top players ── */
    useEffect(() => {
        if (eventScreen !== 'heroes') return;
        const ref = db.ref('users');
        ref.on('value', snap => {
            const arr = [];
            snap.forEach(c => {
                const d = c.val() || {};
                if ((d.olympusOpens||0) > 0) arr.push({ id:c.key, name:d.name||'Игрок', avatar:d.avatar||null, olympusOpens:d.olympusOpens||0 });
            });
            arr.sort((a,b) => b.olympusOpens - a.olympusOpens);
            setOlympusTopPlayers(arr.slice(0,5));
        });
        return () => ref.off();
    }, [eventScreen]);

    /* ════ HELPERS ════ */
    const addToInventory = async (item) => {
        if (inventory.length >= inventorySlots) { alert('Инвентарь полон!'); return false; }
        const ni = [...inventory, { ...item, uniqueId:Date.now(), collected:Date.now() }];
        setInventory(ni);
        await db.ref(`users/${user.id}/inventory`).set(ni);
        return true;
    };

    const getCasePrice = (ct) => {
        const c = cases[ct]; if (!c) return 0;
        if (c.id === 'daily' && c.freeCount > 0) return 0;
        if (c.freeCount > 0) return 0;
        if (c.discountPrice && c.discountPrice !== c.price) return c.discountPrice;
        return c.price;
    };

    /* ════ PROMO ════ */
    const checkPromo = async () => {
        const code = promoCode.toUpperCase().trim();
        setPromoError(''); setPromoSuccess('');
        if (!code) return;
        if (usedPromos.includes(code)) { setPromoError('Уже использован!'); return; }
        if (code === 'DELLKO') {
            if (!wonPromos.includes('DELLKO')) { setPromoError('Только если выиграли в 13 Подвиге Геракла!'); return; }
            const nc = { ...cases, money:{ ...cases.money, freeCount:(cases.money.freeCount||0)+3 } };
            setCases(nc); await addToInventory({ name:'🧊 Лёд (1/3)', emoji:'🧊', type:'ice', part:1 });
            setPromoSuccess('+3 денежных кейса + 🧊!');
            const np = [...usedPromos, code]; setUsedPromos(np); setPromoCode('');
            await db.ref(`users/${user.id}/usedPromos`).set(np);
        } else if (code === 'DIAMOND') {
            const nc = { ...cases, diamond:{ ...cases.diamond, freeCount:(cases.diamond.freeCount||0)+2 } };
            setCases(nc); setPromoSuccess('+2 кейса Алмаз!');

                <div className="flex justify-between items-center mb-3">
                    <h1 className="text-xl font-bold">🪬 13 Подвиг Геракла 🌊</h1>
                    <button onClick={exitGeraklGame} className="bg-red-600/40 hover:bg-red-600 border border-red-500/50 px-3 py-1.5 rounded-xl font-bold transition text-sm">✕ Выйти</button>
                </div>
                {geraklResult ? (
                    <div className="glass rounded-xl p-4 mb-3 text-center border border-yellow-500/30">
                        {geraklResult.type==='ice' ? (<>
                            <div className="text-5xl mb-2">🧊</div>
                            <div className="font-bold text-red-400 text-xl mb-2">ЛЁД!</div>
                            <div className="text-gray-300 text-sm mb-1">Раундов: {geraklResult.round}</div>
                            <div className="text-gray-400 text-sm mb-3">Ставка: {geraklBetAmount}⭐️ | Выигрыш: 0</div>
                            <button onClick={exitGeraklGame} className="w-full bg-gray-600 hover:bg-gray-500 py-2.5 rounded-xl font-bold text-sm">Выйти</button>
                        </>) : (<>
                            <div className="text-5xl mb-2">🎉</div>
                            <div className="font-bold text-green-400 text-xl mb-2">Вы забрали выигрыш!</div>
                            <div className="text-yellow-400 font-bold text-lg mb-1">{geraklResult.win}⭐️</div>
                            <div className="text-green-400 text-sm mb-3">+{geraklResult.profit}⭐️ прибыли</div>
                            {geraklBoxPrize && !geraklBoxOpened && (<>
                                <div className="text-7xl mb-3 cursor-pointer hover:scale-110 transition-transform select-none" onClick={openGeraklBox}>📦</div>
                                <p className="text-cyan-300 text-xs animate-pulse mb-3">Нажмите на коробку!</p>
                            </>)}
                            {geraklBoxPrize && geraklBoxOpened && (
                                <div className="bg-gray-800/60 rounded-xl p-3 mb-3">
                                    <p className="text-3xl">{geraklBoxPrize.emoji}</p>
                                    <p className="text-white font-bold mt-1">{geraklBoxPrize.name}</p>
                                </div>
                            )}
                            <button onClick={exitGeraklGame} className="w-full bg-green-600 hover:bg-green-500 py-2.5 rounded-xl font-bold text-sm">Выйти</button>
                        </>)}
                    </div>
                ) : geraklGameActive ? (<>
                    <div className="glass rounded-xl p-4 mb-3 text-center border border-yellow-500/30">
                        <div className="text-5xl font-bold text-yellow-400 mb-1">{geraklTimer}</div>
                        <div className="text-gray-400 text-xs mb-3">сек. до выбора</div>
                        <div className="grid grid-cols-2 gap-4 mb-4">
                            <div className="bg-gray-800/60 rounded-lg p-3"><div className="text-gray-400 text-xs mb-1">Выигрыш</div><div className="text-2xl font-bold text-yellow-400">{geraklCurrentWin}⭐️</div></div>
                            <div className="bg-gray-800/60 rounded-lg p-3"><div className="text-gray-400 text-xs mb-1">Множитель</div><div className="text-2xl font-bold text-orange-400">{geraklMultiplier}x</div></div>
                        </div>
                        <div className="flex gap-2 mb-4">
                            <button onClick={handleGeraklFlame} className="flex-1 bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 py-3 rounded-xl font-bold text-sm">🔥 Пламя</button>
                            <button onClick={handleGeraklCashout} className="flex-1 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 py-3 rounded-xl font-bold text-sm">🧊 Забрать</button>
                        </div>
                        <div className="flex justify-center flex-wrap">
                            {[...Array(10)].map((_,i)=><div key={i} className={`round-box ${i<geraklRound?'completed':i===geraklRound?'current':''}`}>{i+1}</div>)}
                        </div>
                    </div>
                    <div className="glass rounded-xl p-3">
                        <h3 className="font-bold text-center text-yellow-300 text-xs mb-2">🎁 Награды за 10 раундов</h3>
                        <div className="flex flex-wrap justify-center gap-1.5 text-xl">
                            {['🧸','🧸','🧱','🍾','💍','25⭐️','200⭐️','350⭐️','🔑'].map((e,i)=><span key={i} className="bg-gray-800/60 p-1.5 rounded-lg border border-white/10">{e}</span>)}
                        </div>
                    </div>
                </>) : (
                    <div className="glass rounded-xl p-4 mb-3 text-center border border-yellow-500/30">
                        <div className="text-3xl mb-2 animate-bounce">🪬</div>
                        <div className="font-bold text-yellow-300 text-lg mb-2">Соверши 13 подвиг!</div>
                        <div className="text-gray-400 text-xs mb-3">Сделай ставку и пройди 10 раундов</div>
                        <div className="flex gap-2 mb-3">
                            <input type="number" min="25" value={geraklBetInput} onChange={e=>setGeraklBetInput(Math.max(25,Number(e.target.value)))} className="flex-1 bg-gray-800 border border-yellow-600 rounded-lg p-2.5 text-center text-lg text-white" />
                            <button onClick={()=>setGeraklBetInput(p=>p+25)} className="bg-yellow-700 hover:bg-yellow-600 px-3 rounded-lg font-bold text-sm">+25</button>
                            <button onClick={()=>setGeraklBetInput(p=>p+100)} className="bg-yellow-700 hover:bg-yellow-600 px-3 rounded-lg font-bold text-sm">+100</button>
                        </div>
                        <button onClick={startGeraklGame} disabled={balance<geraklBetInput||geraklBetInput<25} className="w-full bg-gradient-to-r from-yellow-600 to-orange-600 hover:from-yellow-500 hover:to-orange-500 py-2.5 rounded-xl font-bold disabled:opacity-50 text-sm">Начать игру ({geraklBetInput}⭐️)</button>
                        <p className="text-center text-xs text-gray-500 mt-1">Баланс: {balance.toFixed(0)}⭐️ | Мин: 25⭐️</p>
                    </div>
                )}
            </div>
        </div>
    );

    /* ════════════════════════════════════
       RENDER – ADMIN
    ════════════════════════════════════ */
    if (isAdmin) {
        const filtered = allUsers.filter(u => !adminUserSearch || (u.name||'').toLowerCase().includes(adminUserSearch.toLowerCase()) || (u.username||'').toLowerCase().includes(adminUserSearch.toLowerCase()) || (u.id||'').toLowerCase().includes(adminUserSearch.toLowerCase()));
        return (
            <div className="min-h-screen bg-gray-900 p-4">
                <div className="max-w-4xl mx-auto">
                    <div className="flex justify-between items-center mb-6">
                        <h1 className="text-2xl font-bold">🔐 Админ-панель</h1>
                        <button onClick={()=>setIsAdmin(false)} className="text-gray-400 hover:text-white">Выйти</button>
                    </div>
                    <div className="flex gap-2 mb-6 overflow-x-auto">
                        {['stats','users','rewards','settings'].map(t=>(
                            <button key={t} onClick={()=>setAdminScreen(t)} className={`px-4 py-2 rounded-lg ${adminScreen===t?'bg-indigo-600':'bg-gray-700'} text-sm`}>
                                {t==='stats'?'📊 Стат.':t==='users'?'👥 Юзеры':t==='rewards'?'🎀 Награды':'⚙️ Настр.'}
                            </button>
                        ))}
                    </div>
                    <div className="glass rounded-xl p-6">
                        {adminScreen==='stats' && (
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Игроков</div><div className="text-3xl font-bold">{allUsers.length}</div></div>
                                <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Онлайн</div><div className="text-3xl font-bold text-green-400">{onlineCount}</div></div>
                                <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Баланс всего</div><div className="text-2xl font-bold">{allUsers.reduce((s,u)=>s+(u.balance||0),0).toFixed(0)}⭐️</div></div>
                                <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Предметов</div><div className="text-3xl font-bold">{allUsers.reduce((s,u)=>s+(u.inventory?.length||0),0)}</div></div>
                            </div>
                        )}
                        {adminScreen==='users' && !selectedUser && (<div>
                            <input type="text" placeholder="🔍 Поиск..." value={adminUserSearch} onChange={e=>setAdminUserSearch(e.target.value)} className="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-sm mb-4" />
                            <div className="space-y-2 max-h-96 overflow-y-auto">
                                {filtered.map(u=>(
                                    <div key={u.id} onClick={()=>setSelectedUser(u)} className="bg-gray-800 p-3 rounded-lg cursor-pointer hover:bg-gray-700 flex justify-between">
                                        <div><div className="font-bold text-sm">{u.name}</div><div className="text-xs text-gray-400">{u.username||u.id?.slice(0,12)}</div></div>
                                        <div className="text-yellow-400 text-sm">{(u.balance||0).toFixed(0)}⭐️</div>
                                    </div>
                                ))}
                            </div>
                        </div>)}
                        {adminScreen==='users' && selectedUser && (<div>
                            <h3 className="font-bold mb-4 text-lg">👤 {selectedUser.name}</h3>
                            <div className="grid grid-cols-3 gap-2 mb-4">
                                <button onClick={()=>adminGiveReward(selectedUser.id,{type:'stars',amount:100})} className="bg-green-600 p-2 rounded text-sm">+100⭐️</button>
                                <button onClick={()=>adminGiveReward(selectedUser.id,{type:'stars',amount:500})} className="bg-green-600 p-2 rounded text-sm">+500⭐️</button>
                                <button onClick={()=>adminGiveReward(selectedUser.id,{type:'stars',amount:1000})} className="bg-green-600 p-2 rounded text-sm">+1000⭐️</button>
                                <button onClick={()=>adminGiveReward(selectedUser.id,{type:'case',caseType:'diamond',count:5})} className="bg-blue-600 p-2 rounded text-sm">+5💎</button>
                                <button onClick={()=>adminGiveReward(selectedUser.id,{type:'case',caseType:'elite',count:2})} className="bg-red-600 p-2 rounded text-sm">+2🎖</button>
                                <button onClick={()=>adminGiveReward(selectedUser.id,{type:'unlock_collector'})} className="bg-pink-800 p-2 rounded text-sm">🔓 Коллекц.</button>
                                <button onClick={()=>adminGiveReward(selectedUser.id,{type:'reset_daily'})} className="bg-cyan-600 p-2 rounded text-sm">🗓️ Сброс дейли</button>
                                <button onClick={()=>adminGiveReward(selectedUser.id,{type:'item',item:{id:'random_case_box',name:'Случайный кейс',emoji:'📦',type:'random_case_box'}})} className="bg-amber-600 p-2 rounded text-sm">📦 Выдать ящик</button>
                                <button onClick={()=>adminGiveReward(selectedUser.id,{type:'stars',amount:10000})} className="bg-purple-600 p-2 rounded text-sm">+10000⭐️</button>
                            </div>
                            <button onClick={()=>setSelectedUser(null)} className="w-full bg-gray-600 p-2 rounded text-sm">← Назад</button>
                        </div>)}
                        {adminScreen==='rewards' && (<div>
                            <h3 className="text-lg mb-4">Выдать себе:</h3>
                            <div className="grid grid-cols-3 gap-2">
                                <button onClick={()=>adminGiveReward(user.id,{type:'stars',amount:10000})} className="bg-indigo-600 p-3 rounded text-sm">+10000⭐️</button>
                                <button onClick={()=>adminGiveReward(user.id,{type:'case',caseType:'diamond',count:10})} className="bg-blue-600 p-3 rounded text-sm">+10💎</button>
                                <button onClick={()=>adminGiveReward(user.id,{type:'unlock_collector'})} className="bg-pink-800 p-3 rounded text-sm">🔓 Коллекц.</button>
                                <button onClick={()=>adminGiveReward(user.id,{type:'reset_daily'})} className="bg-cyan-600 p-3 rounded text-sm">🗓️ Дейли</button>
                                <button onClick={()=>adminGiveReward(user.id,{type:'item',item:{id:'random_case_box',name:'Случайный кейс',emoji:'📦',type:'random_case_box'}})} className="bg-amber-600 p-3 rounded text-sm">📦 Ящик</button>
                            </div>
                        </div>)}
                        {adminScreen==='settings' && (<div>
                            <h3 className="text-lg mb-4">Сбросить аккаунт</h3>
                            <button onClick={async()=>{ if(confirm('Удалить ВСЕ данные?')){ await db.ref('users/'+user.id).remove(); localStorage.removeItem('sbs_user_id'); window.location.reload(); } }} className="bg-red-600 px-4 py-2 rounded-lg text-sm">🗑 Сбросить</button>
                        </div>)}
                    </div>
                </div>
            </div>
        );
    }

    /* ════════════════════════════════════
       RENDER – MAIN
    ════════════════════════════════════ */
    return (
        <div className="min-h-screen pb-24">
            {/* HEADER */}
            <header className="p-4 flex justify-between items-center glass sticky top-0 z-50">
                <h1 onClick={handleTitleClick} className="text-xl font-bold cursor-pointer select-none hover:text-cyan-300 transition">Step By Step Game</h1>
                <button onClick={()=>setShowTopUp(true)} className="bg-gradient-to-r from-yellow-400 to-orange-500 px-4 py-2 rounded-full font-bold text-gray-900 shadow-lg text-sm">{balance.toFixed(2)} ⭐️</button>
            </header>

            {paymentStatus && <div className="mx-4 mt-2 p-3 rounded-lg text-center text-xs bg-blue-500/20 border border-blue-500">{paymentStatus}</div>}

            {/* ─── MODALS ─── */}
            {showRandomCaseModal && (
                <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4">
                    <div className="glass rounded-2xl p-6 max-w-sm w-full text-center">
                        <div className="text-6xl mb-4 animate-bounce">📦</div>
                        <h3 className="text-xl font-bold mb-2">Случайный Кейс</h3>
                        <p className="mb-4 text-sm">Обменять ящик на один случайный бесплатный кейс?</p>
                        <button onClick={exchangeRandomCaseBox} className="w-full bg-green-600 hover:bg-green-500 py-3 rounded-xl font-bold mb-2">Обменять</button>
                        <button onClick={()=>setShowRandomCaseModal(false)} className="w-full bg-gray-600 hover:bg-gray-500 py-2 rounded-xl text-sm font-bold">Отмена</button>
                    </div>
                </div>
            )}
            {showCollectibleModal && (
                <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4">
                    <div className="glass rounded-2xl p-6 max-w-sm w-full text-center">
                        <div className="text-6xl mb-4 animate-bounce">{selectedCollectible?.emoji}</div>
                        <h3 className="text-xl font-bold mb-2">Коллекционный предмет!</h3>
                        <p className="mb-4 text-sm">Обратитесь к <a href="https://t.me/stepbystepdelision" target="_blank" className="text-blue-400 underline">администрации</a> для получения награды.</p>
                        <button onClick={()=>setShowCollectibleModal(false)} className="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold">Понятно</button>
                    </div>
                </div>
            )}
            {/* Olympus item result */}
            {showOlympusItemModal && selectedOlympusItem && (
                <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4">
                    <div className="glass rounded-2xl p-6 max-w-sm w-full text-center olympus-font">
                        <div className="text-6xl mb-3">{selectedOlympusItem.emoji}</div>
                        <h3 className="text-xl font-bold mb-1 olympus-label">{selectedOlympusItem.name}</h3>
                        {selectedOlympusItem.type==='olympus_item' && <p className="text-sm text-gray-300 mb-4">Продать за {selectedOlympusItem.sellPrice}⭐️ или сохранить</p>}
                        {selectedOlympusItem.type==='olympus_slot' && <p className="text-sm text-gray-300 mb-4">+1 слот в инвентаре!</p>}
                        {selectedOlympusItem.type==='olympus_exchange_stars' && <p className="text-sm text-gray-300 mb-4">+{selectedOlympusItem.value}⭐️</p>}
                        {selectedOlympusItem.type==='olympus_star_cases' && <p className="text-sm text-gray-300 mb-4">+{selectedOlympusItem.count} кейсов «Звездный⭐️»</p>}
                        <button onClick={()=>handleOlympusItemAction(selectedOlympusItem)} className="w-full bg-gradient-to-r from-yellow-600 to-amber-600 hover:from-yellow-500 hover:to-amber-500 py-3 rounded-xl font-bold transition">Получить!</button>
                        {selectedOlympusItem.type==='olympus_item' && (
                            <button onClick={()=>{setShowOlympusItemModal(false);setSelectedOlympusItem(null);}} className="w-full bg-gray-600 hover:bg-gray-500 py-2 rounded-xl text-sm font-bold mt-2">Сохранить в инвентаре</button>
                        )}
                    </div>
                </div>
            )}
            {/* Poseidon */}
            {showPoseidonModal && (
                <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4">
                    <div className="glass rounded-2xl p-6 max-w-sm w-full text-center olympus-font border-2 border-blue-400/50">
                        <div className="text-6xl mb-3">🔱</div>
                        <h3 className="text-xl font-bold mb-2 olympus-label">Посейдон🔱</h3>
                        <p className="text-sm text-gray-300 mb-5">Выберите свою награду!</p>
                        <button onClick={()=>handlePoseidon(1)} className="w-full bg-gradient-to-r from-yellow-600 to-amber-600 hover:from-yellow-500 hover:to-amber-500 py-3 rounded-xl font-bold mb-3 transition">💰 200⭐️</button>
                        <button onClick={()=>handlePoseidon(2)} className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 py-3 rounded-xl font-bold transition">💎 5 кейсов «Платина»</button>
                    </div>
                </div>
            )}
            {/* Hades */}
            {showHadesModal && (
                <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4">
                    <div className="glass rounded-2xl p-6 max-w-sm w-full text-center olympus-font border-2 border-red-500/50">
                        <div className="text-6xl mb-3">🔥</div>
                        <h3 className="text-xl font-bold mb-2 olympus-label">Аид🔥</h3>
                        <p className="text-sm text-gray-300 mb-5">Выберите свою награду!</p>
                        <button onClick={()=>handleHades(1)} className="w-full bg-gradient-to-r from-yellow-600 to-amber-600 hover:from-yellow-500 hover:to-amber-500 py-3 rounded-xl font-bold mb-3 transition">💰 250⭐️</button>
                        <button onClick={()=>handleHades(2)} className="w-full bg-gradient-to-r from-pink-700 to-rose-700 hover:from-pink-600 hover:to-rose-600 py-3 rounded-xl font-bold transition">🎩 Разблокировка «Коллекционер» + 1 прокрут</button>
                    </div>
                </div>
            )}
            {/* Zeus */}
            {showZeusModal && (
                <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4">
                    <div className="glass rounded-2xl p-6 max-w-sm w-full text-center olympus-font border-2 border-yellow-400/70">
                        <div className="text-6xl mb-3">⚡️</div>
                        <h3 className="text-xl font-bold mb-2 olympus-label">Зевс⚡️</h3>
                        <p className="text-sm text-gray-200 mb-5">Разбудите Зевса⚡️ сейчас и получите 2 Кейса «Коллекционер» (+разблокировка) или оставьте его и получите награду лучше позже!</p>
                        <button onClick={()=>handleZeus('wake')} className="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 py-3 rounded-xl font-bold mb-3 transition">⚡️ Разбудить</button>
                        <button onClick={()=>handleZeus('sleep')} className="w-full bg-gradient-to-r from-gray-600 to-gray-700 hover:from-gray-500 hover:to-gray-600 py-3 rounded-xl font-bold transition">💤 Оставить</button>
                    </div>
                </div>
            )}
            {/* Gefest */}
            {showGefestModal && (
                <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4 overflow-y-auto">
                    <div className="rounded-2xl p-5 max-w-md w-full olympus-font gefest-bg" style={{backgroundBlendMode:'overlay',background:'rgba(30,20,10,0.85)'}}>
                        <div className="flex justify-between items-center mb-3">
                            <h3 className="text-xl font-bold hephaestus-text">Лавка Гефеста🏵️</h3>
                            <button onClick={()=>setShowGefestModal(false)} className="text-2xl hover:text-red-400">×</button>
                        </div>
                        <p className="text-center hephaestus-text text-sm mb-3">Обменяй свои коллекционные предметы на что-нибудь ценное💎</p>
                        {gefestCooldownStr && <div className="bg-red-500/20 border border-red-500 rounded-lg p-2 mb-3 text-center text-sm font-bold">⏰ Следующий обмен через: {gefestCooldownStr}</div>}
                        <div className="space-y-2 max-h-[60vh] overflow-y-auto">
                            {Object.entries(GEFEST_EXCHANGES).map(([key,ex])=>{
                                const has = inventory.find(i=>i.key===key||i.id===key);
                                return (
                                    <div key={key} className={`glass rounded-xl p-3 border ${has?'border-green-500':'border-white/10 opacity-60'}`}>
                                        <div className="flex justify-between items-center mb-1">
                                            <span className="font-bold text-sm">{ex.name}</span>
                                            {has && <span className="text-green-400 text-xs font-bold">✓ Есть</span>}
                                        </div>
                                        <div className="text-xs text-gray-200 mb-2">
                                            {ex.highlight && <span className="text-red-400 font-bold neon-red mr-1">⚡ Выгодно!</span>}
                                            → {ex.rewardText}
                                        </div>
                                        <button onClick={()=>handleGefestExchange(key)} disabled={!has||gefestCooldownStr!==''} className="w-full bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-500 hover:to-red-500 py-2 rounded-lg font-bold text-xs disabled:opacity-40 disabled:cursor-not-allowed transition">Обменять</button>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            )}
            {/* Gefest choice */}
            {showGefestChoice && gefestChoiceCtx && (
                <div className="fixed inset-0 bg-black/90 z-[70] flex items-center justify-center p-4">
                    <div className="glass rounded-2xl p-6 max-w-sm w-full text-center olympus-font">
                        <div className="text-5xl mb-3">🧊</div>
                        <h3 className="text-xl font-bold mb-4 text-cyan-300">Выберите награду!</h3>
                        <button onClick={()=>handleGefestChoice(1)} className="w-full bg-gradient-to-r from-yellow-600 to-amber-600 hover:from-yellow-500 hover:to-amber-500 py-3 rounded-xl font-bold mb-3 transition">25 кейсов «Звездный⭐️»</button>
                        <button onClick={()=>handleGefestChoice(2)} className="w-full bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 py-3 rounded-xl font-bold transition">500⭐️</button>
                    </div>
                </div>
            )}
            {/* Admin login */}
            {showAdminLogin && (
                <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4">
                    <div className="glass rounded-2xl p-6 max-w-sm w-full">
                        <h2 className="text-xl font-bold text-center mb-4">🔐 Вход в админ-панель</h2>
                        <input type="text" placeholder="Логин" value={adminLogin} onChange={e=>setAdminLogin(e.target.value)} className="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-3 mb-3 text-center text-sm" />
                        <input type="password" placeholder="Пароль" value={adminPassword} onChange={e=>setAdminPassword(e.target.value)} className="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-3 mb-4 text-center text-sm" />
                        <button onClick={checkAdminLogin} className="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold mb-2">Войти</button>
                        <button onClick={()=>setShowAdminLogin(false)} className="w-full bg-gray-700 hover:bg-gray-600 py-2 rounded-xl text-sm">Отмена</button>
                    </div>
                </div>
            )}
            {/* Withdraw */}
            {showWithdrawModal && (
                <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4">
                    <div className="glass rounded-2xl p-6 max-w-sm w-full text-center">
                        <h2 className="text-xl font-bold mb-4">📊 Вывод призов</h2>
                        {tasks.depositMajor?.completed
                            ? <p className="text-green-400 text-sm mb-4">Обратитесь к администрации для вывода призов! <a href="https://t.me/stepbystepdelision" className="underline">@stepbystepdelision</a></p>
                            : <p className="text-yellow-400 text-sm mb-4">Чтобы вывести NFT призы, звезды выполните задание «Пополни на 350⭐️»</p>
                        }
                        <button onClick={()=>setShowWithdrawModal(false)} className="w-full bg-gray-700 hover:bg-gray-600 py-2 rounded-xl text-sm">Закрыть</button>
                    </div>
                </div>
            )}
            {/* TopUp */}
            {showTopUp && (
                <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                    <div className="glass rounded-2xl p-5 max-w-sm w-full">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-bold">💳 Пополнение</h3>
                            <button onClick={()=>setShowTopUp(false)} className="text-2xl hover:text-red-400">×</button>
                        </div>
                        <p className="text-xs text-gray-400 text-center mb-3">⭐️ Telegram Stars</p>
                        <div className="space-y-2 mb-4">
                            {STARS_PACKAGES.map(pkg=>(
                                <button key={pkg.stars} onClick={()=>buyStars(pkg)} className="w-full glass p-3 rounded-xl flex justify-between items-center hover:bg-white/10 transition border border-white/10">
                                    <span className="font-bold text-yellow-400 text-sm">+{pkg.stars} ⭐️</span>
                                    <span className="text-gray-300 text-xs">Купить</span>
                                </button>
                            ))}
                        </div>
                        <div className="border-t border-gray-600 pt-4">
                            <p className="text-xs text-gray-400 text-center mb-3">💎 TON</p>
                            {TON_RATES.map(rate=>(
                                <button key={rate.stars} onClick={()=>topUpBalance(rate.stars,rate.ton)} className="w-full glass p-3 rounded-xl flex justify-between items-center hover:bg-white/10 transition border border-white/10 mb-2">
                                    <span className="font-bold text-sm">+{rate.stars}⭐️</span>
                                    <span className="text-yellow-400 font-bold text-sm">{rate.ton} TON</span>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            )}

            {/* ─── MAIN CONTENT ─── */}
            <main className="p-4 max-w-md mx-auto">

                {/* ══ CASES SCREEN ══ */}
                {currentScreen==='cases' && (
                    <div>
                        <h2 className="text-2xl font-bold mb-4 text-center">🎰 Кейсы</h2>
                        {/* free case banners */}
                        {cases.diamond?.freeCount>0 && <div className="bg-green-500/20 border border-green-500 rounded-lg p-3 mb-3 text-center text-sm animate-pulse">🎁 Бесплатных кейсов Алмаз: {cases.diamond.freeCount}</div>}
                        {cases.elite?.freeCount>0 && <div className="bg-green-500/20 border border-green-500 rounded-lg p-3 mb-3 text-center text-sm animate-pulse">🎁 Бесплатных кейсов Элита: {cases.elite.freeCount}</div>}
                        {cases.collector?.freeCount>0 && <div className="bg-pink-500/20 border border-pink-500 rounded-lg p-3 mb-3 text-center text-sm animate-pulse">🎁 Бесплатных кейсов Коллекционер: {cases.collector.freeCount}</div>}
                        {cases.cardboard?.freeCount>0 && <div className="bg-amber-500/20 border border-amber-500 rounded-lg p-3 mb-3 text-center text-sm animate-pulse">🎁 Бесплатных кейсов Картон: {cases.cardboard.freeCount}</div>}
                        {cases.coal?.freeCount>0 && <div className="bg-gray-500/20 border border-gray-500 rounded-lg p-3 mb-3 text-center text-sm animate-pulse">🎁 Бесплатных кейсов Уголёк: {cases.coal.freeCount}</div>}
                        {cases.platinum?.freeCount>0 && <div className="bg-gray-300/20 border border-gray-300 rounded-lg p-3 mb-3 text-center text-sm animate-pulse">🎁 Бесплатных кейсов Платина: {cases.platinum.freeCount}</div>}
                        {cases.gold?.freeCount>0 && <div className="bg-yellow-500/20 border border-yellow-500 rounded-lg p-3 mb-3 text-center text-sm animate-pulse">🎁 Бесплатных кейсов Золотой: {cases.gold.freeCount}</div>}
                        {cases.money?.freeCount>0 && <div className="bg-green-500/20 border border-green-500 rounded-lg p-3 mb-3 text-center text-sm animate-pulse">🎁 Бесплатных кейсов Денежный: {cases.money.freeCount}</div>}
                        {cases.star?.freeCount>0 && <div className="bg-amber-400/20 border border-amber-400 rounded-lg p-3 mb-3 text-center text-sm animate-pulse">🎁 Бесплатных кейсов Звездный: {cases.star.freeCount}</div>}

                        {/* Special cases (no olympus here!) */}
                        <div className="mb-6">
                            <h3 className="text-lg font-bold text-center mb-3 text-purple-300 special-header">🔮 Особые 🔮</h3>
                            <div className="grid grid-cols-2 gap-4">
                                {Object.values(cases).filter(c=>c.type==='special').map(c=>{
                                    const isDaily=c.id==='daily', isDailyWait=isDaily&&c.freeCount===0;
                                    if (c.id==='collector'&&c.locked) return (
                                        <div key={c.id} className="rounded-xl p-4 relative case-collector opacity-80 overflow-hidden">
                                            <div className="absolute inset-0 bg-black/50 z-20 flex items-center justify-center"><span className="text-5xl">🔒</span></div>
                                            <div className="w-16 h-16 mx-auto rounded-lg bg-white/20 flex items-center justify-center text-3xl mb-2 relative z-10">{c.emoji}</div>
                                            <h3 className="font-bold text-center text-sm relative z-10">{c.name}</h3>
                                            <p className="text-center text-xs opacity-75 mb-2 relative z-10">{c.price}⭐️</p>
                                            <button disabled className="w-full py-2 rounded-lg font-bold text-sm bg-gray-800/80 cursor-not-allowed text-gray-400 relative z-10">Недоступно</button>
                                        </div>
                                    );
                                    return (
                                        <div key={c.id} className={`glass rounded-xl p-4 relative overflow-hidden hover:scale-105 transition ${c.id==='collector'?'case-collector':''}`}>
                                            <div className={`w-16 h-16 mx-auto rounded-lg ${c.id==='collector'?'bg-white/20':`bg-gradient-to-br ${c.color}`} flex items-center justify-center text-3xl mb-2 shadow-lg`}>{c.emoji}</div>
                                            <h3 className="font-bold text-center text-sm">{c.name}</h3>
                                            <p className="text-center text-xs opacity-75 mb-2 h-4 flex items-center justify-center">
                                                {isDaily?(c.freeCount>0?<span className="text-green-400 font-bold">Бесплатно!</span>:<span className="daily-timer">{dailyCaseTimeLeft}</span>):(c.price>0?c.price+'⭐️':'')}
                                            </p>
                                            <button onClick={()=>handleSelectCase(c)} disabled={c.locked} className="w-full py-2 rounded-lg font-bold text-sm bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 transition">
                                                {c.locked?'🔒':(isDailyWait?'👁 Смотреть':'Открыть')}
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Ordinary cases */}
                        <div className="mb-6">
                            <h3 className="text-lg font-bold text-center mb-3 text-yellow-300 ordinary-header">🎁 Обычные 🎁</h3>
                            <div className="grid grid-cols-2 gap-4">
                                {Object.values(cases).filter(c=>!c.type&&!c.locked).map(c=>(
                                    <div key={c.id} className={`glass rounded-xl p-4 relative overflow-hidden hover:scale-105 transition ${c.id==='cardboard'?'case-cardboard':''}`}>
