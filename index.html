                            const nc = { ...cases, [step.reward.cases.caseType]: { ...cases[step.reward.cases.caseType], freeCount: (cases[step.reward.cases.caseType].freeCount || 0) + step.reward.cases.count } };

                            await db.ref(`users/${user.id}/cases/${step.reward.cases.caseType}/freeCount`).set((cases[step.reward.cases.caseType].freeCount || 0) + step.reward.cases.count);
                        }
                        alert(`🎉 Достигнута ступень ${step.step}! Награда: ${step.name}`);
                    }
                }
            };
            
            const wakeZeus = async () => {
                const nc = { ...cases, collector: { ...cases.collector, locked: false, freeCount: (cases.collector.freeCount || 0) + 2 } };
                setCases(nc);
                await db.ref(`users/${user.id}/cases/collector`).update({ locked: false, freeCount: (cases.collector.freeCount || 0) + 2 });
                setShowZeusModal(false);
                setZeusItem(null);
                alert('⚡️ Зевс разбужен! Получено 2 кейса Коллекционер!');
            };
            
            const addToInventory = async (item) => {
                if(inventory.length >= inventorySlots) { alert('Инвентарь полон!'); return; }
                const ni = [...inventory, { ...item, uniqueId: Date.now(), collected: Date.now() }];
                setInventory(ni);
                await db.ref(`users/${user.id}/inventory`).set(ni);
            };
            
            const sellItem = async (item) => {
                if(item.type === 'random_case_box') { setRandomCaseItem(item); setShowRandomCaseModal(true); return; }
                if(item.type === 'collectible' || item.type === 'olympus_item') { 
                    setSelectedCollectible(item); 
                    setShowCollectibleModal(true); 
                    return; 
                }
                if(item.type === 'olympus_exchange') {
                    if(confirm(`Обменять ${item.name} на ${item.exchangeValue}⭐️?`)) {
                        const nb = balance + item.exchangeValue;
                        const ni = inventory.filter(i => i.uniqueId !== item.uniqueId);
                        setBalance(nb); setInventory(ni);
                        await db.ref(`users/${user.id}`).update({ balance: nb, inventory: ni });
                    }
                    return;
                }
                if(item.type === 'olympus_choice') {
                    const choice = confirm(`Посейдон 🔱\n\nOK - Получить 200⭐️\nОтмена - Получить 5 кейсов Платина`);
                    const nb = balance + (choice ? 200 : 0);
                    if(choice) setBalance(nb);
                    const nc = choice ? cases : { ...cases, platinum: { ...cases.platinum, freeCount: (cases.platinum.freeCount || 0) + 5 } };
                    if(!choice) setCases(nc);
                    const ni = inventory.filter(i => i.uniqueId !== item.uniqueId);
                    setInventory(ni);
                    await db.ref(`users/${user.id}`).update({ 
                        balance: choice ? nb : balance, 
                        cases: nc, 
                        inventory: ni 
                    });
                    return;
                }
                if(item.type === 'olympus_choice2') {
                    const choice = confirm(`Аид 🔥\n\nOK - Получить 250⭐️\nОтмена - Разблокировать Коллекционер`);
                    const nb = balance + (choice ? 250 : 0);
                    if(choice) setBalance(nb);
                    const nc = choice ? cases : { ...cases, collector: { ...cases.collector, locked: false } };
                    if(!choice) setCases(nc);
                    const ni = inventory.filter(i => i.uniqueId !== item.uniqueId);
                    setInventory(ni);
                    await db.ref(`users/${user.id}`).update({ 
                        balance: choice ? nb : balance, 
                        cases: nc, 
                        inventory: ni 
                    });
                    return;
                }
                if(item.type === 'olympus_slot') {
                    const nb = inventorySlots + 1;
                    setInventorySlots(nb);
                    const ni = inventory.filter(i => i.uniqueId !== item.uniqueId);
                    setInventory(ni);
                    await db.ref(`users/${user.id}`).update({ inventorySlots: nb, inventory: ni });
                    alert('Получен +1 слот в инвентаре!');
                    return;
                }
                if(item.type === 'olympus_cases') {
                    const nc = { ...cases, [item.caseType]: { ...cases[item.caseType], freeCount: (cases[item.caseType].freeCount || 0) + item.count } };
                    setCases(nc);
                    const ni = inventory.filter(i => i.uniqueId !== item.uniqueId);
                    setInventory(ni);
                    await db.ref(`users/${user.id}`).update({ cases: nc, inventory: ni });
                    alert(`Получено ${item.count} кейсов ${cases[item.caseType].name}!`);
                    return;
                }
                if(confirm(`Продать ${item.name} за ${item.sellPrice}⭐️?`)) {
                     const nb = balance + item.sellPrice;
                     const ni = inventory.filter(i => i.uniqueId !== item.uniqueId);
                     setBalance(nb); setInventory(ni);
                     await db.ref(`users/${user.id}`).update({ balance: nb, inventory: ni });
                }
            };
            
            const exchangeRandomCaseBox = async () => {
                 const keys = ['cardboard','coal','platinum','diamond','money','gold','elite','collector'];
                 const rKey = keys[Math.floor(Math.random()*keys.length)];
                 const ni = inventory.filter(i => i.uniqueId !== randomCaseItem.uniqueId);
                 const nc = { ...cases, [rKey]: { ...cases[rKey], freeCount: (cases[rKey].freeCount||0)+1 } };
                 if(rKey === 'collector') nc.collector.locked = false;
                 setInventory(ni); setCases(nc);
                 await db.ref(`users/${user.id}`).update({ inventory: ni, cases: nc });
                 setShowRandomCaseModal(false); setRandomCaseItem(null);
                 alert(`Выпал кейс: ${cases[rKey].name}!`);
            };
            
            const unlockSlot = async () => {
                 if(balance < 50) return;
                 setBalance(b => b - 50); setInventorySlots(s => s + 1);
                 await db.ref(`users/${user.id}`).update({ balance: balance - 50, inventorySlots: inventorySlots + 1 });
            };
            
            const startGeraklGame = async () => {
                if (balance < geraklBetInput || geraklBetInput < 25) {
                    alert('Недостаточно звезд или ставка меньше 25!');
                    return;
                }
                setBalance(b => b - geraklBetInput);
                await db.ref(`users/${user.id}/balance`).set(balance - geraklBetInput);
                setGeraklBetAmount(geraklBetInput);
                setGeraklRound(0);
                setGeraklMultiplier(1.0);
                setGeraklCurrentWin(geraklBetInput);
                setGeraklTimer(25);
                setGeraklGameActive(true);
                setGeraklResult(null);
                setGeraklBoxOpened(false);
                setGeraklBoxPrize(null);
            };
            
            const handleGeraklFlame = async () => {
                if (geraklRound >= 10) {
                    handleGeraklCashout();
                    return;
                }
                const iceChance = GERAKL_ICE_CHANCES[geraklRound];
                const randomValue = Math.random();
                
                if (randomValue < iceChance) {
                    handleGeraklIce();
                } else {
                    const nextRound = geraklRound + 1;
                    const nextMultiplier = GERAKL_MULTIPLIERS[nextRound];
                    const nextWin = Math.floor(geraklBetAmount * nextMultiplier);
                    setGeraklRound(nextRound);
                    setGeraklMultiplier(nextMultiplier);
                    setGeraklCurrentWin(nextWin);
                    setGeraklTimer(25);
                }
            };
            
            const handleGeraklCashout = async () => {
                const profit = geraklCurrentWin - geraklBetAmount;
                setBalance(b => b + geraklCurrentWin);
                await db.ref(`users/${user.id}/balance`).set(balance + geraklCurrentWin);
                setGeraklResult({
                    type: 'cashout',
                    round: geraklRound,
                    win: geraklCurrentWin,
                    profit: profit
                });
                setGeraklGameActive(false);
                
                if (geraklRound >= 10) {
                    const prize = getGeraklBoxPrize();
                    setGeraklBoxPrize(prize);
                    if (prize.type === 'stars') {
                        const totalWin = geraklCurrentWin + prize.value;
                        setBalance(b => b + prize.value);
                        await db.ref(`users/${user.id}/balance`).set(balance + prize.value);
                    } else if (prize.type === 'item' || prize.type === 'collectible') {
                        await addToInventory(prize);
                    } else if (prize.type === 'promo') {
                        await addToInventory(prize);
                    }
                }
            };
            
            const handleGeraklIce = () => {
                setGeraklResult({
                    type: 'ice',
                    round: geraklRound
                });
                setGeraklGameActive(false);
            };
            
            const getGeraklBoxPrize = () => {
                let cum = 0, r = Math.random() * 100;
                for (const prize of GERAKL_10_REWARDS) {
                    cum += prize.chance;
                    if (r <= cum) return prize;
                }
                return GERAKL_10_REWARDS[0];
            };
            
            const openGeraklBox = async () => {
                setGeraklBoxOpened(true);
                if (geraklBoxPrize.type === 'promo') {
                    const np = [...wonPromos, geraklBoxPrize.code];
                    setWonPromos(np);
                    await db.ref(`users/${user.id}/wonPromos`).set(np);
                }
            };
            
            const exitGeraklGame = () => {
                setGeraklGameActive(false);
                setGeraklResult(null);
                setGeraklBoxOpened(false);
                setGeraklBoxPrize(null);
                setCurrentGame(null);
            };
            
            const exchangeItem = async (exchange) => {
                if(exchangeCooldown > 0) {
                    alert(`Подождите ${Math.ceil(exchangeCooldown/1000)} секунд!`);
                    return;
                }
                
                const item = inventory.find(i => i.id === exchange.id);
                if(!item) {
                    alert('Предмет не найден!');
                    return;
                }
                
                setLastExchangeTime(Date.now());
                
                const ni = inventory.filter(i => i.uniqueId !== item.uniqueId);
                setInventory(ni);
                
                if(exchange.reward.type === 'stars') {
                    const nb = balance + exchange.reward.value;
                    setBalance(nb);
                    await db.ref(`users/${user.id}`).update({ balance: nb, inventory: ni });
                } else if(exchange.reward.type === 'case') {
                    const nc = { ...cases, [exchange.reward.caseType]: { ...cases[exchange.reward.caseType], freeCount: (cases[exchange.reward.caseType].freeCount || 0) + exchange.reward.count } };
                    setCases(nc);
                    await db.ref(`users/${user.id}`).update({ cases: nc, inventory: ni });
                } else if(exchange.reward.type === 'cases') {
                    const nc = { ...cases, [exchange.reward.caseType]: { ...cases[exchange.reward.caseType], freeCount: (cases[exchange.reward.caseType].freeCount || 0) + exchange.reward.count } };
                    setCases(nc);
                    await db.ref(`users/${user.id}`).update({ cases: nc, inventory: ni });
                } else if(exchange.reward.type === 'slot') {
                    const nb = inventorySlots + exchange.reward.count;
                    setInventorySlots(nb);
                    await db.ref(`users/${user.id}`).update({ inventorySlots: nb, inventory: ni });
                } else if(exchange.reward.type === 'unlock_collector') {
                    const nc = { ...cases, collector: { ...cases.collector, locked: false, freeCount: (cases.collector.freeCount || 0) + exchange.reward.cases.count } };
                    setCases(nc);
                    await db.ref(`users/${user.id}`).update({ cases: nc, inventory: ni });
                } else if(exchange.reward.type === 'choice') {
                    const choice = confirm(`🧊 Лёд\n\nOK - Получить 500⭐️\nОтмена - Получить 25 кейсов Звездный`);
                    if(choice) {
                        const nb = balance + exchange.reward.stars;
                        setBalance(nb);
                        await db.ref(`users/${user.id}`).update({ balance: nb, inventory: ni });
                    } else {
                        const nc = { ...cases, star: { ...cases.star, freeCount: (cases.star.freeCount || 0) + exchange.reward.cases.count } };
                        setCases(nc);
                        await db.ref(`users/${user.id}`).update({ cases: nc, inventory: ni });
                    }
                }
                
                alert('Обмен совершен!');
            };
            
            const hasItem = (id) => inventory.some(i => i.id === id);
            
            if (currentGame?.type === 'gerakl') {
                return (
                    <div className="min-h-screen bg-gradient-to-b from-red-900 via-orange-900 to-red-800 pb-4" style={{
                        backgroundImage: `url('gerakl.jpg')`,
                        backgroundSize: 'cover',
                        backgroundPosition: 'center',
                        backgroundBlendMode: 'overlay'
                    }}>
                        <div className="max-w-lg mx-auto p-3">
                            <div className="flex justify-between items-center mb-3">
                                <div>
                                    <h1 className="text-xl font-bold text-white">🪬 13 Подвиг Геракла 🌊</h1>
                                </div>
                                <button onClick={exitGeraklGame} className="bg-red-600/40 hover:bg-red-600 border border-red-500/50 px-3 py-1.5 rounded-xl font-bold transition text-sm">✕ Выйти</button>
                            </div>
                            
                            {geraklResult ? (
                                <div className="glass rounded-xl p-4 mb-3 text-center border border-yellow-500/30">
                                    {geraklResult.type === 'ice' ? (
                                        <>
                                            <div className="text-5xl mb-2">🧊</div>
                                            <div className="font-bold text-red-400 text-xl mb-2">ЛЁД!</div>
                                            <div className="text-gray-300 text-sm mb-1">Вы продержались: {geraklResult.round} раундов</div>
                                            <div className="text-gray-400 text-sm mb-3">Ставка: {geraklBetAmount}⭐️ | Выигрыш: 0⭐️</div>
                                            <button onClick={exitGeraklGame} className="w-full bg-gray-600 hover:bg-gray-500 py-2.5 rounded-xl font-bold transition text-sm">Выйти</button>
                                        </>
                                    ) : (
                                        <>
                                            <div className="text-5xl mb-2">🎉</div>
                                            <div className="font-bold text-green-400 text-xl mb-2">Вы забрали выигрыш!</div>
                                            <div className="text-gray-300 text-sm mb-1">Раундов: {geraklResult.round}</div>
                                            <div className="text-yellow-400 font-bold text-lg mb-1">Выигрыш: {geraklResult.win}⭐️</div>
                                            <div className="text-green-400 text-sm mb-3">Чистая прибыль: +{geraklResult.profit}⭐️</div>
                                            {geraklBoxPrize && !geraklBoxOpened && (
                                                <>
                                                    <div className="text-7xl mb-3 cursor-pointer hover:scale-110 transition-transform active:scale-95 select-none" onClick={openGeraklBox}>📦</div>
                                                    <p className="text-cyan-300 text-xs animate-pulse mb-3">Нажмите на коробку!</p>
                                                </>
                                            )}
                                            {geraklBoxPrize && geraklBoxOpened && (
                                                <div className="bg-gray-800/60 rounded-xl p-3 mb-3">
                                                    <p className="text-gray-400 text-xs mb-1">Бонусный приз:</p>
                                                    <p className="text-3xl">{geraklBoxPrize.emoji}</p>
                                                    <p className="text-white font-bold mt-1">{geraklBoxPrize.name}</p>
                                                </div>
                                            )}
                                            <button onClick={exitGeraklGame} className="w-full bg-green-600 hover:bg-green-500 py-2.5 rounded-xl font-bold transition text-sm">Выйти</button>
                                        </>
                                    )}
                                </div>
                            ) : geraklGameActive ? (
                                <>
                                    <div className="glass rounded-xl p-4 mb-3 text-center border border-yellow-500/30">
                                        <div className="text-3xl mb-2">⏱️</div>
                                        <div className="text-5xl font-bold text-yellow-400 mb-2">{geraklTimer}</div>
                                        <div className="text-gray-400 text-xs mb-3">секунд до выбора</div>
                                        
                                        <div className="grid grid-cols-2 gap-4 mb-4">
                                            <div className="bg-gray-800/60 rounded-lg p-3">
                                                <div className="text-gray-400 text-xs mb-1">Текущий выигрыш</div>
                                                <div className="text-2xl font-bold text-yellow-400">{geraklCurrentWin}⭐️</div>
                                            </div>
                                            <div className="bg-gray-800/60 rounded-lg p-3">
                                                <div className="text-gray-400 text-xs mb-1">Множитель</div>
                                                <div className="text-2xl font-bold text-orange-400">{geraklMultiplier}x</div>
                                            </div>
                                        </div>
                                        
                                        <div className="flex gap-2 mb-4">
                                            <button onClick={handleGeraklFlame} className="flex-1 bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 py-3 rounded-xl font-bold transition text-sm">🔥 Пламя</button>
                                            <button onClick={handleGeraklCashout} className="flex-1 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 py-3 rounded-xl font-bold transition text-sm">🧊 Забрать</button>
                                        </div>
                                        
                                        <div className="flex justify-center flex-wrap">
                                            {[...Array(10)].map((_, i) => (
                                                <div key={i} className={`round-box ${i < geraklRound ? 'completed' : i === geraklRound ? 'current' : ''}`}>
                                                    {i + 1}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    <div className="glass rounded-xl p-3">
                                        <h3 className="font-bold text-center text-yellow-300 text-xs mb-2">🎁 Возможные награды за 10 раундов</h3>
                                        <div className="flex flex-wrap justify-center gap-1.5 text-xl">
                                            {['🧸', '🧸 PRO', '🧱', '🍾', '💍', '25⭐️', '200⭐️', '350⭐️', '🔑'].map((e, i) => <span key={i} className="bg-gray-800/60 p-1.5 rounded-lg border border-white/10">{e}</span>)}
                                        </div>
                                    </div>
                                </>
                            ) : (
                                <div className="glass rounded-xl p-4 mb-3 text-center border border-yellow-500/30">
                                    <div className="text-3xl mb-2 animate-bounce">🪬</div>
                                    <div className="font-bold text-yellow-300 text-lg mb-2">Соверши 13 подвиг!</div>
                                    <div className="text-gray-400 text-xs mb-3">Сделай ставку и пройди 10 раундов</div>
                                    
                                    <div className="flex gap-2 mb-3">
                                        <input type="number" min="25" value={geraklBetInput} onChange={e => setGeraklBetInput(Math.max(25, Number(e.target.value)))} className="flex-1 bg-gray-800 border border-yellow-600 rounded-lg p-2.5 text-center text-lg text-white" />
                                        <button onClick={() => setGeraklBetInput(p => p + 25)} className="bg-yellow-700 hover:bg-yellow-600 px-3 rounded-lg font-bold transition text-sm">+25</button>
                                        <button onClick={() => setGeraklBetInput(p => p + 100)} className="bg-yellow-700 hover:bg-yellow-600 px-3 rounded-lg font-bold transition text-sm">+100</button>
                                    </div>
                                    <button onClick={startGeraklGame} disabled={balance < geraklBetInput || geraklBetInput < 25} className="w-full bg-gradient-to-r from-yellow-600 to-orange-600 hover:from-yellow-500 hover:to-orange-500 py-2.5 rounded-xl font-bold disabled:opacity-50 transition text-sm">Начать игру ({geraklBetInput}⭐️)</button>
                                    <p className="text-center text-xs text-gray-500 mt-1">Баланс: {balance.toFixed(0)}⭐️ | Мин: 25⭐️</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }
            
            if(isAdmin) {
                const filteredUsers = allUsers.filter(u => !adminUserSearch || (u.name && u.name.toLowerCase().includes(adminUserSearch.toLowerCase())) || (u.username && u.username.toLowerCase().includes(adminUserSearch.toLowerCase())) || (u.id && u.id.toLowerCase().includes(adminUserSearch.toLowerCase())));
                return (
                    <div className="min-h-screen bg-gray-900 p-4">
                        <div className="max-w-4xl mx-auto">
                            <div className="flex justify-between items-center mb-6">
                                <h1 className="text-2xl font-bold text-white">🔐 Админ-панель</h1>
                                <button onClick={() => setIsAdmin(false)} className="text-gray-400 hover:text-white">Выйти</button>
                            </div>
                            <div className="flex gap-2 mb-6 overflow-x-auto">
                                {['stats', 'users', 'rewards', 'settings'].map(tab => (
                                    <button key={tab} onClick={() => setAdminScreen(tab)} className={`px-4 py-2 rounded-lg ${adminScreen === tab ? 'bg-indigo-600' : 'bg-gray-700'} text-sm`}>
                                        {tab === 'stats' ? '📊 Стат.' : tab === 'users' ? '👥 Юзеры' : tab === 'rewards' ? '🎀 Награды' : '⚙️ Настр.'}
                                    </button>
                                ))}
                            </div>
                            <div className="glass rounded-xl p-6">
                                {adminScreen === 'stats' && (
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Игроков</div><div className="text-3xl font-bold">{allUsers.length}</div></div>
                                        <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Онлайн</div><div className="text-3xl font-bold text-green-400">{onlineCount}</div></div>
                                        <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Общий баланс</div><div className="text-2xl font-bold">{allUsers.reduce((s, u) => s + (u.balance || 0), 0).toFixed(0)}⭐️</div></div>
                                        <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Предметов</div><div className="text-3xl font-bold">{allUsers.reduce((s, u) => s + (u.inventory?.length || 0), 0)}</div></div>
                                    </div>
                                )}
                                {adminScreen === 'users' && !selectedUser && (
                                    <div>
                                        <div className="mb-4">
                                            <input type="text" placeholder="🔍 Поиск по имени, нику или ID..." value={adminUserSearch} onChange={e => setAdminUserSearch(e.target.value)} className="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-sm" />
                                        </div>
                                        <div className="space-y-2 max-h-96 overflow-y-auto">
                                            {filteredUsers.map(u => (
                                                <div key={u.id} onClick={() => setSelectedUser(u)} className="bg-gray-800 p-3 rounded-lg cursor-pointer hover:bg-gray-700 flex justify-between">
                                                    <div><div className="font-bold text-sm">{u.name}</div><div className="text-xs text-gray-400">{u.username || u.id.slice(0,12)}</div></div>
                                                    <div className="text-yellow-400 text-sm">{(u.balance || 0).toFixed(0)}⭐️</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {adminScreen === 'users' && selectedUser && (
                                    <div>
                                        <h3 className="font-bold mb-4 text-lg">👤 {selectedUser.name}</h3>
                                        <div className="grid grid-cols-3 gap-2 mb-4">
                                            <button onClick={() => adminGiveReward(selectedUser.id, {type:'stars', amount:100})} className="bg-green-600 p-2 rounded text-sm">+100⭐️</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, {type:'stars', amount:500})} className="bg-green-600 p-2 rounded text-sm">+500⭐️</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, {type:'stars', amount:1000})} className="bg-green-600 p-2 rounded text-sm">+1000⭐️</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, {type:'case', caseType:'diamond', count:5})} className="bg-blue-600 p-2 rounded text-sm">+5💎</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, {type:'case', caseType:'elite', count:2})} className="bg-red-600 p-2 rounded text-sm">+2🎖</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, {type:'unlock_collector'})} className="bg-pink-800 p-2 rounded text-sm">🔓 Коллекц.</button>

                                                <div className="name">{item.name}</div>
                                            </div>

                                                <span className="text-yellow-400 font-bold">{r.displayChance}</span>
                                            </div>

                                        <button onClick={() => { setSelectedCase(null); setSpinResult(null); setFakeItems([]); }} className="w-full bg-gray-600 hover:bg-gray-500 py-2.5 rounded-xl font-bold transition text-sm">К кейсам</button>
                                    </div>

                                    <button onClick={() => openCase(selectedCase.id)} disabled={isSpinning || (selectedCase.id === 'daily' && selectedCase.freeCount === 0)} className="w-full bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 py-4 rounded-xl font-bold text-lg disabled:opacity-50 shadow-lg transition">

                                            <span className="text-yellow-400 font-bold text-sm">{rate.ton} TON</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                    <nav className="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-2 z-40">

            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
