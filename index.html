    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(0,210,255,0.3); }
            50% { box-shadow: 0 0 30px rgba(0,210,255,0.8); }
        }
        @keyframes readyPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(0,255,100,0.3); }
            50% { box-shadow: 0 0 30px rgba(0,255,100,0.8); }
        }
        @keyframes specialGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.8); }
        }
        @keyframes regularGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(250, 204, 21, 0.4); }
            50% { box-shadow: 0 0 40px rgba(250, 204, 21, 0.8); }
        }
        @keyframes eventGlow {
            0%, 100% { text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
            50% { text-shadow: 0 0 30px rgba(255, 215, 0, 1); }
        }
        .pulse-glow { animation: pulseGlow 2s ease-in-out infinite; }
        .ready-glow { animation: readyPulse 1.5s ease-in-out infinite; }
        .special-glow { animation: specialGlow 2s ease-in-out infinite; }
        .regular-glow { animation: regularGlow 2s ease-in-out infinite; }
        .event-glow { animation: eventGlow 2s ease-in-out infinite; }
        
        .roulette-container {
            position: relative;
            width: 100%;
            height: 160px;
            overflow: hidden;
            background: rgba(0,0,0,0.4);
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            margin: 20px 0;
        }
        .roulette-inner {
            display: flex;
            position: absolute;
            left: 0;
            top: 20px;
            transition: transform 6.5s cubic-bezier(0.1, 0, 0.1, 1);
            will-change: transform;
        }
        .roulette-item {
            width: 120px;
            height: 120px;
            flex-shrink: 0;
            margin: 0 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .roulette-item .emoji { font-size: 3.5rem; }
        .roulette-item .name { font-size: 11px; opacity: 0.8; text-align: center; margin-top: 4px; }
        .roulette-pointer {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #ff4757;
            z-index: 20;
            transform: translateX(-50%);
            box-shadow: 0 0 20px #ff4757;
        }
        .roulette-pointer::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid #ff4757;
        }
        .roulette-pointer::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 15px solid #ff4757;
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .ice-circle {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 4px solid rgba(0,210,255,0.6);
            position: relative;
            overflow: hidden;
            background: rgba(0, 40, 80, 0.6);
            box-shadow: 0 0 40px rgba(0,210,255,0.4), inset 0 0 60px rgba(0,0,0,0.5);
        }
        .ice-ball {
            position: absolute;
            width: 32px;
            height: 32px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #00d2ff, #0066ff);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,210,255,0.9), 0 0 30px rgba(0,150,255,0.5);
            z-index: 20;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255,255,255,0.8);
            transition: left 0.025s linear, top 0.025s linear;
        }
        .player-avatar {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid white;
            overflow: hidden;
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .case-cardboard {
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 50%, #8B4513 100%);
            border: 3px solid #A0522D;
        }
        .case-collector {
            background: linear-gradient(135deg, #DC143C 0%, #FF1493 50%, #8B008B 100%);
            border: 3px solid #FFD700;
        }
        .player-row-ready {
            border-color: rgba(0,255,100,0.5) !important;
            background: rgba(0,255,100,0.1) !important;
        }
        .player-row-waiting {
            border-color: rgba(255,200,0,0.4) !important;
            background: rgba(255,200,0,0.05) !important;
        }
        .player-row-presence {
            border-color: rgba(150,150,150,0.3) !important;
        }
        .fullscreen-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            overflow-y: auto;
        }
    </style>

            const [victoryPrize, setVictoryPrize] = useState(null);
            const [boxOpened, setBoxOpened] = useState(false);
            const [prizeClaimedLocal, setPrizeClaimedLocal] = useState(false);
            
            const gameIntervalRef = useRef(null);
            
            // ===== INIT =====
            useEffect(() => {
                const initApp = async () => {
                    let userId = null;
                    let userData = { name: 'Гость', username: null, avatar: null };
                    
                    if (TelegramWebApp) {
                        TelegramWebApp.ready();
                        TelegramWebApp.expand();
                        const tgUser = TelegramWebApp.initDataUnsafe?.user;
                        if (tgUser) {
                            userId = tgUser.id.toString();
                            userData = {
                                name: tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : ''),
                                username: tgUser.username ? '@' + tgUser.username : null,
                                avatar: tgUser.photo_url || null
                            };
                        }
                    }
                    
                    if (!userId) {
                        userId = localStorage.getItem('sbs_user_id') || ('guest_' + Date.now());
                        localStorage.setItem('sbs_user_id', userId);
                    } else {
                        localStorage.setItem('sbs_user_id', userId);
                    }
                    
                    try {
                        const snap = await db.ref('users/' + userId).once('value');
                        const data = snap.val();
                        
                        if (data) {
                            // ПРИНУДИТЕЛЬНО ОБНОВЛЯЕМ ЦЕНЫ КЕЙСОВ ИЗ КОДА
                            const storedCases = data.cases || {};
                            const mergedCases = { ...INITIAL_CASES };
                            
                            for (const [key, value] of Object.entries(storedCases)) {
                                if (mergedCases[key]) {
                                    mergedCases[key] = {
                                        ...mergedCases[key],
                                        freeCount: value.freeCount || 0
                                    };
                                } else {
                                    mergedCases[key] = value;
                                }
                            }
                            
                            await db.ref('users/' + userId + '/cases').set(mergedCases);
                            
                            setUser({ id: userId, ...userData, ...data });
                            setBalance(data.balance || 0);
                            setCases(mergedCases);
                            setInventory(data.inventory || []);
                            setTasks(data.tasks || {
                                subscribe: { completed: false },
                                deposit: { completed: false },
                                depositMajor: { completed: false },
                                inviteThree: { completed: false, count: 0, required: 3, reward: 25 }
                            });
                            setInventorySlots(data.inventorySlots || 5);
                            setUsedPromos(data.usedPromos || []);
                            setWonPromos(data.wonPromos || []);
                            setTotalDeposits(data.totalDeposits || 0);
                            setFreeEliteSpin(data.freeEliteSpin || 0);
                            setDailyCaseRemainMs(data.dailyCaseRemainMs || null);
                            
                            db.ref('users/' + userId).update({
                                name: userData.name,
                                username: userData.username || ''
                            });
                        } else {
                            const newCases = { ...INITIAL_CASES, diamond: { ...INITIAL_CASES.diamond, freeCount: 5 } };
                            const newUser = {
                                balance: 0,
                                cases: newCases,
                                inventory: [],
                                tasks: {
                                    subscribe: { completed: false },
                                    deposit: { completed: false },
                                    depositMajor: { completed: false },
                                    inviteThree: { completed: false, count: 0, required: 3, reward: 25 }
                                },
                                inventorySlots: 5,
                                usedPromos: [],
                                wonPromos: [],
                                createdAt: Date.now(),
                                lastActive: Date.now(),
                                totalDeposits: 0,
                                freeEliteSpin: 0,
                                name: userData.name,
                                username: userData.username || '',
                                dailyCaseRemainMs: null
                            };
                            
                            setCases(newCases);
                            setUser({ id: userId, ...userData });
                            await db.ref('users/' + userId).set(newUser);
                        }
                    } catch (e) {
                        console.error(e);
                    }
                    
                    setIsLoading(false);
                };
                
                initApp();
            }, []);
            
            // Online presence
            useEffect(() => {
                if (!user?.id) return;
                const ref = db.ref('online/' + user.id);
                ref.set({ name: user.name, timestamp: Date.now() });
                ref.onDisconnect().remove();
                
                db.ref('online').on('value', snap => {
                    setOnlineCount(Math.floor(Math.random() * 300) + 200 + snap.numChildren());
                });
                
                return () => ref.remove();
            }, [user?.id]);
            
            // Auto-save
            useEffect(() => {
                if (!user?.id || isLoading) return;
                
                const iv = setInterval(() => {
                    db.ref('users/' + user.id).update({
                        balance,
                        cases,
                        inventory,
                        tasks,
                        inventorySlots,
                        usedPromos,
                        wonPromos,
                        lastActive: Date.now(),
                        totalDeposits,
                        freeEliteSpin,
                        dailyCaseRemainMs
                    });
                }, 5000);
                
                return () => clearInterval(iv);
            }, [balance, cases, inventory, tasks, inventorySlots, usedPromos, wonPromos, user?.id, isLoading, totalDeposits, freeEliteSpin, dailyCaseRemainMs]);
            
            // Daily case timer
            useEffect(() => {
                if (!user?.id) return;
                
                const timer = setInterval(() => {
                    if (dailyCaseRemainMs && dailyCaseRemainMs > 0) {
                        const newRemain = Math.max(0, dailyCaseRemainMs - 1000);
                        setDailyCaseRemainMs(newRemain);
                        
                        if (newRemain <= 0) {
                            // Кейс стал доступен
                            const nc = { ...cases, daily: { ...cases.daily, freeCount: 1 } };
                            setCases(nc);
                            db.ref('users/' + user.id + '/cases/daily/freeCount').set(1);
                        }
                    }
                }, 1000);
                
                return () => clearInterval(timer);
            }, [dailyCaseRemainMs, user?.id]);
            
            // Olympus countdown
            const [olympusTimer, setOlympusTimer] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
            const [manWinterTimer, setManWinterTimer] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
            
            useEffect(() => {
                const timer = setInterval(() => {
                    const now = Date.now();
                    const diff = OLYMPUS_DATE - now;
                    
                    if (diff > 0) {
                        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                        
                        setOlympusTimer({ days, hours, minutes, seconds });
                        setManWinterTimer({ days, hours, minutes, seconds });
                    }
                }, 1000);
                
                return () => clearInterval(timer);
            }, []);
            
            const formatDailyTimer = (ms) => {
                if (!ms || ms <= 0) return '';
                const hours = Math.floor(ms / (1000 * 60 * 60));
                const minutes = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((ms % (1000 * 60)) / 1000);
                return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            };
            
            const getCasePrice = (ct) => {
                const c = cases[ct];
                if (!c) return 0;
                if (c.freeCount > 0) return 0;
                if (c.discountPrice && c.discountPrice !== c.price) return c.discountPrice;
                return c.price;
            };
            
            const openCase = async (caseType) => {
                if (caseType === 'collector' && cases.collector?.locked) {
                    alert('Кейс «Коллекционер» заблокирован!');
                    return;
                }
                
                // Проверка для ежедневного кейса
                if (caseType === 'daily') {
                    if (cases.daily?.freeCount <= 0 && dailyCaseRemainMs > 0) {
                        return; // Нельзя открыть, только просмотр
                    }
                }
                
                const price = getCasePrice(caseType);
                const isFree = cases[caseType]?.freeCount > 0;
                const isElite = caseType === 'elite';
                const hasFreeElite = isElite && freeEliteSpin > 0;
                
                if (!hasFreeElite && !isFree && price > 0 && balance < price) {
                    alert('Недостаточно звёзд!');
                    return;
                }
                
                let newBal = balance;
                
                if (isFree) {
                    const nf = cases[caseType].freeCount - 1;
                    setCases(prev => ({ ...prev, [caseType]: { ...prev[caseType], freeCount: nf } }));
                    await db.ref(`users/${user.id}/cases/${caseType}/freeCount`).set(nf);
                    
                    // Для ежедневного кейса запускаем таймер
                    if (caseType === 'daily') {
                        const newRemain = 23 * 60 * 60 * 1000;
                        setDailyCaseRemainMs(newRemain);
                        await db.ref(`users/${user.id}/dailyCaseRemainMs`).set(newRemain);
                    }
                } else if (hasFreeElite) {
                    const ns = freeEliteSpin - 1;
                    setFreeEliteSpin(ns);
                    await db.ref(`users/${user.id}/freeEliteSpin`).set(ns);
                } else if (price > 0) {
                    newBal = balance - price;
                    setBalance(newBal);
                    await db.ref('users/' + user.id + '/balance').set(newBal);
                }
                
                // reset animation state completely before new spin
                setIsSpinning(false);
                setSpinResult(null);
                setFakeItems([]);
                setRouletteOffset(0);
                setSelectedCase({ ...cases[caseType], id: caseType });
                
                // force re-mount of roulette for each spin
                setRouletteKey(prev => prev + 1);
                
                const items = CASE_REWARDS[caseType];
                
                // Для случайного кейса
                if (caseType === 'daily' && items.find(i => i.id === 'case_box')) {
                    const rand = Math.random() * 100;
                    let cum = 0, won = items[0];
                    for (const item of items) {
                        cum += item.realChance;
                        if (rand <= cum) {
                            won = item;
                            break;
                        }
                    }
                    
                    const tape = [];
                    for (let i = 0; i < 80; i++) {
                        tape.push(i === 70 ? won : items[Math.floor(Math.random() * items.length)]);
                    }
                    
                    setIsSpinning(true);
                    setTimeout(() => {
                        setFakeItems(tape);
                        setRouletteOffset(0);
                        setTimeout(() => {
                            const cw = rouletteContainerRef.current ? rouletteContainerRef.current.offsetWidth : window.innerWidth;
                            const ifw = 136;
                            const target = (70 * ifw + ifw / 2 - cw / 2);
                            setRouletteOffset(-target);
                        }, 50);
                    }, 50);
                    
                    setTimeout(async () => {
                        setSpinResult(won);
                        setIsSpinning(false);
                        
                        if (won.type === 'stars') {
                            const fb = newBal + won.value;
                            setBalance(fb);
                            await db.ref(`users/${user.id}/balance`).set(fb);
                        } else if (won.type === 'random_case') {
                            // Выдача случайного кейса
                            const randomCases = ['cardboard', 'coal', 'platinum', 'diamond', 'money', 'gold', 'elite', 'collector'];
                            const randomCase = randomCases[Math.floor(Math.random() * randomCases.length)];
                            const nc = { ...cases, [randomCase]: { ...cases[randomCase], freeCount: (cases[randomCase].freeCount || 0) + 1 } };
                            setCases(nc);
                            await db.ref(`users/${user.id}/cases/${randomCase}/freeCount`).set((cases[randomCase].freeCount || 0) + 1);
                            alert(`Получен случайный кейс: ${cases[randomCase].name}!`);
                        } else {
                            await addToInventory(won);
                        }
                    }, 6600);
                    return;
                }
                
                const rand = Math.random() * 100;
                let cum = 0, won = items[0];
                for (const item of items) {
                    cum += item.realChance;
                    if (rand <= cum) {
                        won = item;
                        break;
                    }
                }
                
                const tape = [];
                for (let i = 0; i < 80; i++) {
                    tape.push(i === 70 ? won : items[Math.floor(Math.random() * items.length)]);
                }
                
                setIsSpinning(true);
                setTimeout(() => {
                    setFakeItems(tape);
                    setRouletteOffset(0);
                    setTimeout(() => {
                        const cw = rouletteContainerRef.current ? rouletteContainerRef.current.offsetWidth : window.innerWidth;
                        const ifw = 136;
                        const target = (70 * ifw + ifw / 2 - cw / 2);
                        setRouletteOffset(-target);
                    }, 50);
                }, 50);
                
                setTimeout(async () => {
                    setSpinResult(won);
                    setIsSpinning(false);
                    
                    if (won.type === 'stars') {
                        const fb = newBal + won.value;
                        setBalance(fb);
                        await db.ref(`users/${user.id}/balance`).set(fb);
                    } else if (won.type === 'man_bonus_elite') {
                        const ns = freeEliteSpin + 1;
                        setFreeEliteSpin(ns);
                        await db.ref(`users/${user.id}/freeEliteSpin`).set(ns);
                        alert('🎖 Получен бесплатный кейс «Элита»!');
                    } else {
                        await addToInventory(won);
                    }
                }, 6600);
            };
            
            const addToInventory = async (item) => {
                if (inventory.length >= inventorySlots) {
                    alert('Инвентарь полон!');
                    return;
                }
                const ni = [...inventory, { ...item, uniqueId: Date.now(), collected: Date.now() }];
                setInventory(ni);
                await db.ref(`users/${user.id}/inventory`).set(ni);
            };
            
            const sellItem = async (item) => {
                if (item.type === 'ice_gift') {
                    setSelectedIceGift(item);
                    setShowIceGiftModal(true);
                    return;
                }
                if (item.type === 'man_item' || item.type === 'man_bonus_elite') {
                    setSelectedManItem(item);
                    setShowManItemModal(true);
                    return;
                }
                if (item.type === 'collectible') {
                    setSelectedCollectible(item);
                    setShowCollectibleModal(true);
                    return;
                }
                if (confirm(`Продать ${item.name} за ${item.sellPrice}⭐️?`)) {
                    const nb = balance + item.sellPrice;
                    const ni = inventory.filter(i => i.uniqueId !== item.uniqueId);
                    setBalance(nb);
                    setInventory(ni);
                    await db.ref(`users/${user.id}`).update({ balance: nb, inventory: ni });
                }
            };
            
            const checkPromo = async () => {
                const code = promoCode.toUpperCase().trim();
                setPromoError('');
                setPromoSuccess('');
                
                if (!code) return;
                if (usedPromos.includes(code)) {
                    setPromoError('Уже использован!');
                    return;
                }
                
                if (code === 'FEBRUARY') {
                    const nc = { ...cases, man: { ...cases.man, freeCount: (cases.man.freeCount || 0) + 4 } };
                    setCases(nc);
                    setPromoSuccess('+4 кейса «Мужык 💪»!');
                    const np = [...usedPromos, code];
                    setUsedPromos(np);
                    setPromoCode('');
                    await db.ref(`users/${user.id}/usedPromos`).set(np);
                    await db.ref(`users/${user.id}/cases/man/freeCount`).set((cases.man.freeCount || 0) + 4);
                } else if (code === 'DELLKO') {
                    if (!wonPromos.includes('DELLKO')) {
                        setPromoError('Только если выиграли в Ледяном Катке!');
                        return;
                    }
                    const nc = { ...cases, money: { ...cases.money, freeCount: (cases.money.freeCount || 0) + 3 } };
                    setCases(nc);
                    await addToInventory({ name: '🧊 Лёд (1/3)', emoji: '🧊', type: 'ice', part: 1 });
                    setPromoSuccess('+3 денежных кейса + 🧊!');
                    const np = [...usedPromos, code];
                    setUsedPromos(np);
                    setPromoCode('');
                    await db.ref(`users/${user.id}/usedPromos`).set(np);
                } else if (code === 'DIAMOND') {
                    const nc = { ...cases, diamond: { ...cases.diamond, freeCount: (cases.diamond.freeCount || 0) + 2 } };
                    setCases(nc);
                    setPromoSuccess('+2 кейса Алмаз!');
                    const np = [...usedPromos, code];
                    setUsedPromos(np);
                    setPromoCode('');
                    await db.ref(`users/${user.id}/usedPromos`).set(np);
                } else if (code === 'DEFENDER') {
                    const nc = { ...cases, man: { ...cases.man, freeCount: (cases.man.freeCount || 0) + 5 } };
                    setCases(nc);
                    setPromoSuccess('+5 кейсов «Мужык 💪»!');
                    const np = [...usedPromos, code];
                    setUsedPromos(np);
                    setPromoCode('');
                    await db.ref(`users/${user.id}/usedPromos`).set(np);
                } else if (code === 'PROMO') {
                    const nb = balance + 275;
                    setBalance(nb);
                    setPromoSuccess('✅ Начислено 275⭐️!');
                    const np = [...usedPromos, code];
                    setUsedPromos(np);
                    setPromoCode('');
                    await db.ref(`users/${user.id}`).update({ balance: nb, usedPromos: np });
                } else {
                    setPromoError('Неверный промокод');
                }
            };
            
            const completeTask = async (taskId) => {
                if (taskId === 'subscribe') {
                    window.open('https://t.me/stepbystepdelision', '_blank');
                    setTimeout(async () => {
                        if (!tasks.subscribe?.completed) {
                            const nt = { ...tasks, subscribe: { completed: true } };
                            const nc = { ...cases, elite: { ...cases.elite, freeCount: (cases.elite.freeCount || 0) + 1 } };
                            setTasks(nt);
                            setCases(nc);
                            await db.ref(`users/${user.id}`).update({ tasks: nt, cases: nc });
                            alert('🎉 Получен 1 кейс «Элита»!');
                        }
                    }, 2000);
                } else if (taskId === 'inviteThree') {
                    window.open('https://t.me/share/url?url=' + encodeURIComponent(`https://t.me/stepbystep_game_bot?start=${user.id}`), '_blank');
                } else if (taskId === 'deposit' || taskId === 'depositMajor') {
                    setShowTopUp(true);
                }
            };
            
            const checkAdminLogin = () => {
                if (adminLogin === 'REMOVED' && adminPassword === 'REMOVED') {
                    setIsAdmin(true);
                    setShowAdminLogin(false);
                    db.ref('users').once('value').then(snap => {
                        const u = [];
                        snap.forEach(c => u.push({ id: c.key, ...c.val() }));
                        setAllUsers(u);
                    });
                } else {
                    alert('Неверный логин или пароль!');
                }
            };
            
            const [searchQuery, setSearchQuery] = useState('');
            const filteredUsers = allUsers.filter(u => 
                u.name?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                u.username?.toLowerCase().includes(searchQuery.toLowerCase())
            );
            
            const adminGiveReward = async (tid, reward) => {
                const snap = await db.ref('users/' + tid).once('value');
                const ud = snap.val() || {};
                
                if (reward.type === 'stars') {
                    const nb = (ud.balance || 0) + reward.amount;
                    await db.ref('users/' + tid + '/balance').set(nb);
                    if (tid === user.id) setBalance(nb);
                } else if (reward.type === 'case') {
                    const cur = ud.cases?.[reward.caseType]?.freeCount || 0;
                    await db.ref(`users/${tid}/cases/${reward.caseType}/freeCount`).set(cur + reward.count);
                    if (tid === user.id) {
                        setCases(prev => ({
                            ...prev,
                            [reward.caseType]: { ...prev[reward.caseType], freeCount: cur + reward.count }
                        }));
                    }
                } else if (reward.type === 'unlock_collector') {
                    await db.ref(`users/${tid}/cases/collector/locked`).set(false);
                    if (tid === user.id) {
                        setCases(prev => ({ ...prev, collector: { ...prev.collector, locked: false } }));
                    }
                } else if (reward.type === 'daily') {
                    // Сброс таймера ежедневного кейса
                    await db.ref(`users/${tid}/cases/daily/freeCount`).set(1);
                    await db.ref(`users/${tid}/dailyCaseRemainMs`).set(0);
                    if (tid === user.id) {
                        setCases(prev => ({ ...prev, daily: { ...prev.daily, freeCount: 1 } }));
                        setDailyCaseRemainMs(0);
                    }
                }
                
                alert('Награда выдана!');
            };
            
            // ===== ICE LOBBY SCREEN =====
            // ... (код лобби остаётся без изменений)
            
            // ===== ADMIN =====
            if (isAdmin) {
                return (
                    <div className="min-h-screen bg-gray-900 p-4">
                        <div className="max-w-4xl mx-auto">
                            <div className="flex justify-between items-center mb-6">
                                <h1 className="text-2xl font-bold text-white">🔐 Админ-панель</h1>
                                <button onClick={() => setIsAdmin(false)} className="text-gray-400 hover:text-white">Выйти</button>
                            </div>
                            <div className="flex gap-2 mb-6 overflow-x-auto">
                                {['stats', 'users', 'rewards', 'settings'].map(tab => (
                                    <button key={tab} onClick={() => setAdminScreen(tab)} className={`px-4 py-2 rounded-lg ${adminScreen === tab ? 'bg-indigo-600' : 'bg-gray-700'} text-sm`}>
                                        {tab === 'stats' ? '📊 Стат.' : tab === 'users' ? '👥 Юзеры' : tab === 'rewards' ? '🎀 Награды' : '⚙️ Настр.'}
                                    </button>
                                ))}
                            </div>
                            <div className="glass rounded-xl p-6">
                                {adminScreen === 'stats' && (
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Игроков</div><div className="text-3xl font-bold">{allUsers.length}</div></div>
                                        <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Онлайн</div><div className="text-3xl font-bold text-green-400">{onlineCount}</div></div>
                                        <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Общий баланс</div><div className="text-2xl font-bold">{allUsers.reduce((s, u) => s + (u.balance || 0), 0).toFixed(0)}⭐️</div></div>
                                        <div className="bg-gray-800 p-4 rounded-lg"><div className="text-gray-400 text-sm">Предметов</div><div className="text-3xl font-bold">{allUsers.reduce((s, u) => s + (u.inventory?.length || 0), 0)}</div></div>
                                    </div>
                                )}
                                {adminScreen === 'users' && !selectedUser && (
                                    <div className="space-y-2 max-h-96 overflow-y-auto">
                                        <h3 className="font-bold mb-2">Выберите игрока:</h3>
                                        <input
                                            type="text"
                                            placeholder="🔍 Поиск по нику..."
                                            value={searchQuery}
                                            onChange={e => setSearchQuery(e.target.value)}
                                            className="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-3 mb-4 text-center text-sm"
                                        />
                                        {filteredUsers.map(u => (
                                            <div key={u.id} onClick={() => setSelectedUser(u)} className="bg-gray-800 p-3 rounded-lg cursor-pointer hover:bg-gray-700 flex justify-between">
                                                <div><div className="font-bold text-sm">{u.name}</div><div className="text-xs text-gray-400">{u.username || u.id.slice(0,12)}</div></div>
                                                <div className="text-yellow-400 text-sm">{(u.balance || 0).toFixed(0)}⭐️</div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                {adminScreen === 'users' && selectedUser && (
                                    <div>
                                        <h3 className="font-bold mb-4 text-lg">👤 {selectedUser.name}</h3>
                                        <div className="grid grid-cols-3 gap-2 mb-4">
                                            <button onClick={() => adminGiveReward(selectedUser.id, { type: 'stars', amount: 100 })} className="bg-green-600 p-2 rounded text-sm">+100⭐️</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, { type: 'stars', amount: 500 })} className="bg-green-600 p-2 rounded text-sm">+500⭐️</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, { type: 'stars', amount: 1000 })} className="bg-green-600 p-2 rounded text-sm">+1000⭐️</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, { type: 'case', caseType: 'diamond', count: 5 })} className="bg-blue-600 p-2 rounded text-sm">+5💎</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, { type: 'case', caseType: 'elite', count: 2 })} className="bg-red-600 p-2 rounded text-sm">+2🎖</button>
                                            <button onClick={() => adminGiveReward(selectedUser.id, { type: 'unlock_collector' })} className="bg-pink-800 p-2 rounded text-sm">🔓 Коллекц.</button>
                                        </div>
                                        <button onClick={() => setSelectedUser(null)} className="w-full bg-gray-600 p-2 rounded text-sm">← Назад</button>
                                    </div>
                                )}
                                {adminScreen === 'rewards' && (
                                    <div>
                                        <h3 className="text-lg mb-4">Выдать себе:</h3>
                                        <div className="grid grid-cols-3 gap-2 mb-4">
                                            <button onClick={() => adminGiveReward(user.id, { type: 'stars', amount: 10000 })} className="bg-indigo-600 p-3 rounded text-sm">+10000⭐️</button>
                                            <button onClick={() => adminGiveReward(user.id, { type: 'case', caseType: 'diamond', count: 10 })} className="bg-blue-600 p-3 rounded text-sm">+10💎</button>
                                            <button onClick={() => adminGiveReward(user.id, { type: 'unlock_collector' })} className="bg-pink-800 p-3 rounded text-sm">🔓 Коллекц.</button>
                                        </div>
                                        <h3 className="text-lg mb-4 mt-6">Начислить кейс Ежедневный 🗓️</h3>
                                        <button onClick={() => adminGiveReward(user.id, { type: 'daily' })} className="w-full bg-teal-600 p-3 rounded text-sm">
                                            🗓️ Сделать ежедневный кейс доступным
                                        </button>
                                    </div>
                                )}
                                {adminScreen === 'settings' && (
                                    <div>
                                        <h3 className="text-lg mb-4">Сбросить аккаунт</h3>
                                        <button onClick={async () => {
                                            if (confirm('Удалить ВСЕ данные?')) {
                                                await db.ref('users/' + user.id).remove();
                                                localStorage.removeItem('sbs_user_id');
                                                window.location.reload();
                                            }
                                        }} className="bg-red-600 px-4 py-2 rounded-lg text-sm">🗑 Сбросить</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }
            
            // ===== MAIN =====
            const specialCases = ['daily', 'winter', 'man', 'collector'];
            const regularCases = Object.values(cases).filter(c => !specialCases.includes(c.id) && !c.locked);
            const lockedCases = Object.values(cases).filter(c => c.locked);
            
            const formatTimer = (timer) => {
                return `${timer.days}д ${timer.hours}ч ${timer.minutes}м ${timer.seconds}с`;
            };
            
            return (
                <div className="min-h-screen pb-24">
                    <header className="p-4 flex justify-between items-center glass sticky top-0 z-50">
                        <h1 className="text-xl font-bold cursor-pointer select-none hover:text-cyan-300 transition">Step By Step Game</h1>
                        <button onClick={() => setShowTopUp(true)} className="bg-gradient-to-r from-yellow-400 to-orange-500 px-4 py-2 rounded-full font-bold text-gray-900 shadow-lg text-sm">
                            {balance.toFixed(2)} ⭐️
                        </button>
                    </header>
                    
                    <main className="p-4 max-w-md mx-auto">
                        {currentScreen === 'cases' && (
                            <div>
                                <h2 className="text-2xl font-bold mb-4 text-center">🎰 Кейсы</h2>
                                
                                {cases.diamond?.freeCount > 0 && <div className="bg-green-500/20 border border-green-500 rounded-lg p-3 mb-3 text-center text-sm animate-pulse">🎁 Бесплатных кейсов Алмаз: {cases.diamond.freeCount}</div>}
                                {cases.elite?.freeCount > 0 && <div className="bg-green-500/20 border border-green-500 rounded-lg p-3 mb-3 text-center text-sm animate-pulse">🎁 Бесплатных кейсов Элита: {cases.elite.freeCount}</div>}
                                {freeEliteSpin > 0 && <div className="bg-green-500/20 border border-green-500 rounded-lg p-3 mb-3 text-center text-sm animate-pulse">🎁 Бесплатных прокрутов Элита: {freeEliteSpin}</div>}
                                
                                {/* ОСОБЫЕ КЕЙСЫ */}
                                <div className="mb-6">
                                    <div className="text-center mb-4 special-glow">
                                        <h3 className="text-2xl font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-purple-400 bg-clip-text text-transparent">
                                            🔮 Особые 🔮
                                        </h3>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        {specialCases.map(caseId => {
                                            const c = cases[caseId];
                                            if (!c) return null;
                                            
                                            const isDailyAvailable = caseId === 'daily' && (c.freeCount > 0 || !dailyCaseRemainMs);
                                            const showTimer = caseId === 'daily' && dailyCaseRemainMs && dailyCaseRemainMs > 0;
                                            
                                            return (
                                                <div key={c.id} className={`glass rounded-xl p-4 relative hover:scale-105 transition ${c.id === 'cardboard' ? 'case-cardboard' : c.id === 'collector' ? 'case-collector' : ''}`}>
                                                    {c.isNew && <span className="absolute -top-2 -right-2 bg-red-500 text-xs px-2 py-1 rounded-full animate-pulse">Новое!</span>}
                                                    
                                                    {(c.id === 'diamond' || c.id === 'coal' || c.id === 'winter' || c.id === 'gold') && !c.freeCount && c.discountPrice && c.discountPrice !== c.price && (
                                                        <span className="absolute -top-2 -left-2 bg-green-500 text-xs px-2 py-1 rounded-full animate-pulse text-white font-bold">Скидка!</span>
                                                    )}
                                                    
                                                    {caseId === 'man' || caseId === 'winter' ? (
                                                        <span className="absolute -top-2 -left-2 bg-orange-500 text-xs px-2 py-1 rounded-full animate-pulse text-white font-bold">⏳</span>
                                                    ) : null}
                                                    
                                                    <div className={`w-16 h-16 mx-auto rounded-lg ${c.id === 'cardboard' || c.id === 'collector' ? 'bg-white/20' : `bg-gradient-to-br ${c.color}`} flex items-center justify-center text-3xl mb-2 shadow-lg`}>{c.emoji}</div>
                                                    <h3 className="font-bold text-center text-sm">{c.name}</h3>
                                                    
                                                    <p className="text-center text-xs opacity-75 mb-2">
                                                        {showTimer ? (
                                                            <span className="text-cyan-400 font-bold">⏳ {formatDailyTimer(dailyCaseRemainMs)}</span>
                                                        ) : c.freeCount > 0 ? (
                                                            <span className="text-green-400 font-bold">Бесплатно!</span>
                                                        ) : c.discountPrice && c.discountPrice !== c.price ? (
                                                            <span>
                                                                <span style={{ textDecoration: 'line-through', color: '#9ca3af', marginRight: '8px' }}>{c.originalPrice || c.price}⭐️</span>
                                                                <span className="text-white font-bold">{c.discountPrice}⭐️</span>
                                                            </span>
                                                        ) : (
                                                            `${c.price}⭐️`
                                                        )}
                                                    </p>
                                                    
                                                    {caseId === 'man' || caseId === 'winter' ? (
                                                        <p className="text-center text-xs text-orange-400 mb-2">⏳ {formatTimer(manWinterTimer)}</p>
                                                    ) : null}
                                                    
                                                    <button onClick={() => setSelectedCase(c)} disabled={!isDailyAvailable} className={`w-full py-2 rounded-lg font-bold text-sm bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 transition ${!isDailyAvailable ? 'opacity-50 cursor-not-allowed' : ''}`}>
                                                        {showTimer ? '👁 Просмотр' : 'Открыть'}
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                                
                                {/* РАЗДЕЛИТЕЛЬ */}
                                <div className="border-t-2 border-gradient-to-r from-purple-500 to-yellow-500 my-6"></div>
                                
                                {/* ОБЫЧНЫЕ КЕЙСЫ */}
                                <div className="mb-6">
                                    <div className="text-center mb-4 regular-glow">
                                        <h3 className="text-2xl font-bold bg-gradient-to-r from-yellow-400 via-orange-400 to-yellow-400 bg-clip-text text-transparent">
                                            🎁 Обычные 🎁
                                        </h3>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        {regularCases.map(c => (
                                            <div key={c.id} className={`glass rounded-xl p-4 relative hover:scale-105 transition ${c.id === 'cardboard' ? 'case-cardboard' : c.id === 'collector' ? 'case-collector' : ''}`}>
                                                {c.isNew && <span className="absolute -top-2 -right-2 bg-red-500 text-xs px-2 py-1 rounded-full animate-pulse">Новое!</span>}
                                                
                                                {(c.id === 'diamond' || c.id === 'coal' || c.id === 'winter' || c.id === 'gold') && !c.freeCount && c.discountPrice && c.discountPrice !== c.price && (
                                                    <span className="absolute -top-2 -left-2 bg-green-500 text-xs px-2 py-1 rounded-full animate-pulse text-white font-bold">Скидка!</span>
                                                )}
                                                
                                                <div className={`w-16 h-16 mx-auto rounded-lg ${c.id === 'cardboard' || c.id === 'collector' ? 'bg-white/20' : `bg-gradient-to-br ${c.color}`} flex items-center justify-center text-3xl mb-2 shadow-lg`}>{c.emoji}</div>
                                                <h3 className="font-bold text-center text-sm">{c.name}</h3>
                                                
                                                <p className="text-center text-xs opacity-75 mb-2">
                                                    {c.freeCount > 0 ? (
                                                        <span className="text-green-400 font-bold">Бесплатно!</span>
                                                    ) : c.discountPrice && c.discountPrice !== c.price ? (
                                                        <span>
                                                            <span style={{ textDecoration: 'line-through', color: '#9ca3af', marginRight: '8px' }}>{c.originalPrice || c.price}⭐️</span>
                                                            <span className="text-white font-bold">{c.discountPrice}⭐️</span>
                                                        </span>
                                                    ) : (
                                                        `${c.price}⭐️`
                                                    )}
                                                </p>
                                                
                                                <button onClick={() => setSelectedCase(c)} className="w-full py-2 rounded-lg font-bold text-sm bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 transition">Открыть</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                
                                {lockedCases.map(c => (
                                    <div key={c.id} className="glass rounded-xl p-4 relative opacity-50 mb-4">
                                        <div className="absolute inset-0 bg-black/70 rounded-xl flex items-center justify-center"><span className="text-2xl">🔒</span></div>
                                        <div className={`w-16 h-16 mx-auto rounded-lg bg-gradient-to-br ${c.color} flex items-center justify-center text-3xl mb-2`}>{c.emoji}</div>
                                        <h3 className="font-bold text-center text-sm">{c.name}</h3>
                                        <p className="text-center text-xs mb-2">{c.price}⭐️</p>
                                        <button className="w-full py-2 rounded-lg font-bold text-sm bg-gray-600 cursor-not-allowed">Недоступно</button>
                                    </div>
                                ))}
                            </div>
                        )}
                        
                        {currentScreen === 'events' && (
                            <div className="relative">
                                {/* Фон с Олимпом */}
                                <div className="absolute inset-0 z-0">
                                    <img
                                        src="https://i.pinimg.com/originals/7c/9e/8d/7c9e8d0c0b0b0b0b0b0b0b0b0b0b0b0b.jpg"
                                        alt="Olympus"
                                        className="w-full h-full object-cover blur-sm opacity-50"
                                    />
                                </div>
                                
                                <div className="relative z-10">
                                    <h2 className="text-3xl font-bold mb-6 text-center event-glow">🏛️ Олимп</h2>
                                    
                                    <div className="glass rounded-2xl p-6 mb-6 border-2 border-yellow-500/50 shadow-2xl bg-black/60">
                                        <div className="text-center mb-4">
                                            <h3 className="text-2xl font-bold event-glow mb-2">Доберитесь до ОЛИМПА</h3>
                                            <p className="text-yellow-400 text-sm mb-4">1.03.26</p>
                                            
                                            <div className="text-4xl font-bold event-glow mb-4">
                                                {olympusTimer.days}д {olympusTimer.hours}ч {olympusTimer.minutes}м {olympusTimer.seconds}с
                                            </div>
                                            
                                            <p className="text-cyan-400 font-bold mb-2">⚡ Событие скоро начнется!</p>
                                            <p className="text-white text-sm">Готовься к восхождению ⚡</p>
                                        </div>
                                    </div>
                                    
                                    <h3 className="text-xl font-bold text-center mb-4 text-yellow-400">Что вас ждет?</h3>
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="glass rounded-xl p-4 bg-gradient-to-br from-purple-600/50 to-purple-800/50 border border-purple-500/50">
                                            <div className="text-3xl mb-2 text-center">🎁</div>
                                            <p className="font-bold text-center text-sm">Огромные розыгрыши</p>
                                        </div>
                                        <div className="glass rounded-xl p-4 bg-gradient-to-br from-blue-600/50 to-blue-800/50 border border-blue-500/50">
                                            <div className="text-3xl mb-2 text-center">🔮</div>
                                            <p className="font-bold text-center text-sm">Секретный кейс!</p>
                                        </div>
                                        <div className="glass rounded-xl p-4 bg-gradient-to-br from-green-600/50 to-green-800/50 border border-green-500/50">
                                            <div className="text-3xl mb-2 text-center">🎉</div>
                                            <p className="font-bold text-center text-sm">Новые подарки!</p>
                                        </div>
                                        <div className="glass rounded-xl p-4 bg-gradient-to-br from-orange-600/50 to-orange-800/50 border border-orange-500/50">
                                            <div className="text-3xl mb-2 text-center">🏪</div>
                                            <p className="font-bold text-center text-sm">Эксклюзивный магазин!</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {currentScreen === 'tasks' && (
                            <div>
                                <h2 className="text-2xl font-bold mb-4 text-center">📋 Задания</h2>
                                <div className="space-y-3">
                                    <div className={`glass rounded-xl p-4 ${tasks.subscribe?.completed ? 'bg-green-500/20' : ''}`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <h3 className="font-bold text-sm">Подпишись на канал</h3>
                                                <p className="text-xs opacity-75">Награда: 1 кейс «Элита» 🎖</p>
                                            </div>
                                            {tasks.subscribe?.completed && <span className="text-green-400 text-xl">✅</span>}
                                        </div>
                                        <button onClick={() => completeTask('subscribe')} disabled={tasks.subscribe?.completed} className={`w-full py-2 rounded-lg text-sm ${tasks.subscribe?.completed ? 'bg-green-600' : 'bg-blue-600 hover:bg-blue-500'} transition`}>
                                            {tasks.subscribe?.completed ? 'Выполнено' : 'Подписаться'}
                                        </button>
                                    </div>
                                    <div className={`glass rounded-xl p-4 ${tasks.inviteThree?.completed ? 'bg-green-500/20' : ''}`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <h3 className="font-bold text-sm">Пригласить 3 друзей</h3>
                                                <p className="text-xs opacity-75">Награда: 25 ⭐️</p>
                                                {!tasks.inviteThree?.completed && (
                                                    <p className="text-xs text-cyan-400 mt-0.5">Прогресс: {tasks.inviteThree?.count || 0}/3</p>
                                                )}
                                            </div>
                                            {tasks.inviteThree?.completed && <span className="text-green-400 text-xl">✅</span>}
                                        </div>
                                        <button onClick={() => completeTask('inviteThree')} disabled={tasks.inviteThree?.completed} className={`w-full py-2 rounded-lg text-sm ${tasks.inviteThree?.completed ? 'bg-green-600' : 'bg-blue-600 hover:bg-blue-500'} transition`}>
                                            {tasks.inviteThree?.completed ? 'Выполнено' : 'Пригласить'}
                                        </button>
                                    </div>
                                    <div className={`glass rounded-xl p-4 ${tasks.deposit?.completed ? 'bg-green-500/20' : ''}`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <h3 className="font-bold text-sm">Пополнить на 100 ⭐️</h3>
                                                <p className="text-xs opacity-75">Награда: 1 золотой кейс 👑</p>
                                            </div>
                                            {tasks.deposit?.completed && <span className="text-green-400 text-xl">✅</span>}
                                        </div>
                                        <button onClick={() => completeTask('deposit')} disabled={tasks.deposit?.completed} className={`w-full py-2 rounded-lg text-sm ${tasks.deposit?.completed ? 'bg-green-600' : 'bg-blue-600 hover:bg-blue-500'} transition`}>
                                            {tasks.deposit?.completed ? 'Выполнено' : 'Пополнить'}
                                        </button>
                                    </div>
                                    <div className={`glass rounded-xl p-4 ${tasks.depositMajor?.completed ? 'bg-green-500/20' : ''}`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <h3 className="font-bold text-sm">Пополнить на 350 ⭐️</h3>
                                                <p className="text-xs opacity-75">Награда: Кейс «Коллекционер» + 1 прокрут</p>
                                            </div>
                                            {tasks.depositMajor?.completed && <span className="text-green-400 text-xl">✅</span>}
                                        </div>
                                        <button onClick={() => completeTask('depositMajor')} disabled={tasks.depositMajor?.completed} className={`w-full py-2 rounded-lg text-sm ${tasks.depositMajor?.completed ? 'bg-green-600' : 'bg-blue-600 hover:bg-blue-500'} transition`}>
                                            {tasks.depositMajor?.completed ? 'Выполнено' : 'Пополнить'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {currentScreen === 'profile' && (
                            <div>
                                <div className="glass rounded-xl p-3 mb-4 flex justify-between items-center">
                                    <span className="text-gray-400 text-sm">🟢 Онлайн:</span>
                                    <span className="font-bold text-green-400 text-sm">{onlineCount} игроков</span>
                                </div>
                                <h2 className="text-2xl font-bold mb-4 text-center">👤 Мой Профиль</h2>
                                <div className="glass rounded-xl p-5 text-center mb-4">
                                    <div className="w-20 h-20 mx-auto rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-3xl mb-3 overflow-hidden border-2 border-white/20">
                                        {user?.avatar ? <img src={user.avatar} alt="" className="w-full h-full object-cover" /> : user?.name?.charAt(0).toUpperCase()}
                                    </div>
                                    <h3 className="text-lg font-bold">{user?.name}</h3>
                                    {user?.username && <p className="text-gray-400 text-sm">{user.username}</p>}
                                </div>
                                <div className="flex gap-2 mb-4">
                                    <button onClick={() => setShowTopUp(true)} className="flex-1 bg-gradient-to-r from-yellow-400 to-orange-500 text-gray-900 font-bold py-3 rounded-xl shadow-lg transition text-sm">💎 Пополнить</button>
                                </div>
                                <div className="mb-4">
                                    <button onClick={() => setShowWithdrawModal(true)} disabled={!tasks.depositMajor?.completed} className="w-full bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                                        {tasks.depositMajor?.completed ? '🏆 Вывести призы 🏆' : '🔒 Вывести призы (нужно 350⭐️)'}
                                    </button>
                                </div>
                                <div className="glass rounded-xl p-4 mb-4">
                                    <h3 className="font-bold mb-2 text-sm">🎁 Промокод</h3>
                                    <div className="flex gap-2">
                                        <input type="text" placeholder="ПРОМОКОД" value={promoCode} onChange={e => setPromoCode(e.target.value)} className="flex-1 bg-gray-700/50 border border-gray-600 rounded-lg px-3 py-2 text-center uppercase text-sm" />
                                        <button onClick={checkPromo} className="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-bold transition text-sm">OK</button>
                                    </div>
                                    {promoError && <p className="text-red-400 text-xs mt-2 text-center">{promoError}</p>}
                                    {promoSuccess && <p className="text-green-400 text-xs mt-2 text-center">{promoSuccess}</p>}
                                </div>
                                <div className="glass rounded-xl p-4">
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="font-bold text-sm">🎒 Инвентарь</h3>
                                        <span className="text-xs text-gray-400">{inventory.length}/{inventorySlots}</span>
                                    </div>
                                    <div className="grid grid-cols-5 gap-2 mb-3">
                                        {[...Array(inventorySlots)].map((_, i) => (
                                            <div key={i} className="aspect-square bg-gray-700/50 rounded-lg flex items-center justify-center text-2xl hover:bg-gray-600/50 transition cursor-pointer">
                                                {inventory[i] ? <span onClick={() => sellItem(inventory[i])} className="hover:scale-110 transition">{inventory[i].emoji}</span> : <span className="text-gray-600 text-xs">○</span>}
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={async () => {
                                        if (balance < 50) { alert('Недостаточно звёзд!'); return; }
                                        if (confirm('Разблокировать слот за 50⭐️?')) {
                                            const nb = balance - 50, ns = inventorySlots + 1;
                                            setBalance(nb);
                                            setInventorySlots(ns);
                                            await db.ref(`users/${user.id}`).update({ balance: nb, inventorySlots: ns });
                                        }
                                    }} disabled={balance < 50} className="w-full bg-gray-700 hover:bg-gray-600 disabled:opacity-50 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-2 transition">
                                        🔓 Разблокировать слот (50⭐️)
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                    
                    {selectedCase && (
                        <div className="fullscreen-modal flex items-center justify-center p-4">
                            <div className="w-full max-w-lg" ref={rouletteContainerRef}>
                                <div className="flex justify-between items-center mb-5">
                                    <h3 className="text-2xl font-bold">{selectedCase.emoji} {selectedCase.name}</h3>
                                    <button onClick={() => { setSelectedCase(null); setSpinResult(null); setFakeItems([]); }} className="text-3xl hover:text-red-400 transition">×</button>
                                </div>
                                
                                <div className="roulette-container mb-5">
                                    <div className="roulette-pointer" />
                                    <div key={rouletteKey} className="roulette-inner" style={{ transform: `translateX(${rouletteOffset}px)` }}>
                                        {fakeItems.length > 0 ? fakeItems.map((item, i) => (
                                            <div key={i} className="roulette-item">
                                                <div className="emoji">{item.emoji}</div>
                                                <div className="name">{item.name}</div>
                                            </div>
                                        )) : [...Array(80)].map((_, i) => <div key={i} className="roulette-item"><div className="emoji">❓</div></div>)}
                                    </div>
                                </div>
                                
                                <div className="glass rounded-xl p-4 mb-5 max-h-40 overflow-y-auto">
                                    <p className="font-bold mb-2 text-center text-sm">Возможные награды:</p>
                                    <div className="space-y-1">
                                        {CASE_REWARDS[selectedCase.id]?.map((r, i) => (
                                            <div key={i} className="flex justify-between py-1 border-b border-white/10 last:border-0 text-xs">
                                                <span>{r.emoji} {r.name}</span>
                                                <span className="text-yellow-400 font-bold">{r.displayChance}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                
                                {spinResult ? (
                                    <div className="text-center">
                                        <p className="text-xl font-bold mb-2">🎉 Выпало: {spinResult.name}!</p>
                                        {spinResult.type === 'collectible' && <p className="text-yellow-400 text-xs mb-4">⭐️ Коллекционный предмет!</p>}
                                        <button onClick={() => setSpinResult(null)} className="w-full bg-green-600 hover:bg-green-500 py-3 rounded-xl font-bold mb-2 transition">Забрать и открыть ещё</button>
                                        <button onClick={() => { setSelectedCase(null); setSpinResult(null); setFakeItems([]); }} className="w-full bg-gray-600 hover:bg-gray-500 py-2.5 rounded-xl font-bold transition text-sm">К кейсам</button>
                                    </div>
                                ) : (
                                    <button onClick={() => openCase(selectedCase.id)} disabled={isSpinning || (selectedCase.id === 'daily' && dailyCaseRemainMs && dailyCaseRemainMs > 0)} className="w-full bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 py-4 rounded-xl font-bold text-lg disabled:opacity-50 shadow-lg transition">
                                        {isSpinning ? '🌀 Крутим...' : selectedCase.id === 'daily' && dailyCaseRemainMs && dailyCaseRemainMs > 0 ? `⏳ ${formatDailyTimer(dailyCaseRemainMs)}` : `Открыть за ${getCasePrice(selectedCase.id) === 0 ? 'Бесплатно' : getCasePrice(selectedCase.id) + '⭐️'}`}
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                    
                    {showTopUp && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div className="glass rounded-2xl p-5 max-w-sm w-full">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold">💳 Пополнение</h3>
                                    <button onClick={() => setShowTopUp(false)} className="text-2xl hover:text-red-400 transition">×</button>
                                </div>
                                <p className="text-xs text-gray-400 text-center mb-3">⭐️ Telegram Stars</p>
                                <div className="space-y-2 mb-4">
                                    {STARS_PACKAGES.map(pkg => (
                                        <button key={pkg.stars} onClick={() => {
                                            // Логика покупки звёзд
                                            alert(`Покупка ${pkg.stars} звёзд за ${pkg.price}`);
                                        }} className="w-full glass p-3 rounded-xl flex justify-between items-center hover:bg-white/10 transition border border-white/10">
                                            <span className="font-bold text-yellow-400 text-sm">+{pkg.stars} ⭐️</span>
                                            <span className="text-gray-300 text-xs">Купить</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <nav className="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-2">
                        <div className="max-w-md mx-auto flex justify-around">
                            {[
                                { id: 'tasks', emoji: '📋', label: 'Задания' },
                                { id: 'cases', emoji: '🎁', label: 'Кейсы' },
                                { id: 'events', emoji: '🏛️', label: 'Ивенты' },
                                { id: 'profile', emoji: '👤', label: 'Профиль' }
                            ].map(s => (
                                <button key={s.id} onClick={() => setCurrentScreen(s.id)} className={`flex flex-col items-center p-2 rounded-lg transition ${currentScreen === s.id ? 'text-blue-400 scale-110' : 'text-gray-400 hover:text-white'}`}>
                                    <span className="text-2xl">{s.emoji}</span>
                                    <span className="text-xs font-bold">{s.label}</span>
                                </button>
                            ))}
                        </div>
                    </nav>
                </div>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
