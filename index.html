                                        <p className="text-center text-xs opacity-75 mb-2 h-4">
                                            {c.freeCount>0?<span className="text-green-400 font-bold">Бесплатно!</span>:(c.discountPrice&&c.discountPrice!==c.price?<span><span className="line-thru">{c.originalPrice||c.price}⭐️</span> <span className="font-bold text-white">{c.discountPrice}⭐️</span></span>:c.price+'⭐️')}
                                        </p>
                                        <button onClick={()=>handleSelectCase(c)} className="w-full py-2 rounded-lg font-bold text-sm bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 transition">Открыть</button>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Locked ordinary cases */}
                        {Object.values(cases).filter(c=>c.locked&&!c.type).length>0 && (
                            <div className="grid grid-cols-2 gap-4">
                                {Object.values(cases).filter(c=>c.locked&&!c.type).map(c=>(
                                    <div key={c.id} className="glass rounded-xl p-4 relative opacity-50">
                                        <div className="absolute inset-0 bg-black/70 rounded-xl flex items-center justify-center"><span className="text-2xl">🔒</span></div>
                                        <div className={`w-16 h-16 mx-auto rounded-lg bg-gradient-to-br ${c.color} flex items-center justify-center text-3xl mb-2`}>{c.emoji}</div>
                                        <h3 className="font-bold text-center text-sm">{c.name}</h3>
                                        <p className="text-center text-xs mb-2">{c.price}⭐️</p>
                                        <button className="w-full py-2 rounded-lg font-bold text-sm bg-gray-600 cursor-not-allowed">Недоступно</button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                )}

                {/* ══ GAMES SCREEN ══ */}
                {currentScreen==='games' && (
                    <div>
                        <h2 className="text-2xl font-bold mb-4 text-center">🎮 Игры</h2>
                        <div className="space-y-4">
                            <div className="glass rounded-xl p-5 border border-yellow-500/30" style={{backgroundImage:`url('gerakl.jpg')`,backgroundSize:'cover',backgroundPosition:'center',backgroundBlendMode:'overlay'}}>
                                <h3 className="text-xl font-bold mb-1 text-center text-yellow-300">🪬 13 Подвиг Геракла 🌊</h3>
                                <p className="text-gray-300 mb-1 text-center text-xs">Соверши 13 подвиг!</p>
                                <p className="text-yellow-400 text-center text-xs mb-3">Пройди 10 раундов и получи сундук 📦</p>
                                <button onClick={()=>setCurrentGame({type:'gerakl'})} className="w-full bg-gradient-to-r from-yellow-600 to-orange-600 hover:from-yellow-500 hover:to-orange-500 py-3 rounded-xl font-bold transition text-sm">Войти</button>
                            </div>
                            <div className="glass rounded-xl p-5 opacity-50 text-center"><h3 className="text-lg font-bold">В разработке... 👲</h3></div>
                        </div>
                    </div>
                )}

                {/* ══ EVENTS SCREEN ══ */}
                {currentScreen==='events' && (<div>
                    {/* MAIN EVENT */}
                    {eventScreen==='main' && (
                        <div className="event-bg">
                            <div className="event-overlay" />
                            <div className="relative z-10 p-4 flex flex-col items-center" style={{minHeight:'520px'}}>
                                <h2 className="text-3xl font-bold text-center mb-6 olympus-title olympus-font-black" style={{letterSpacing:'1px'}}>🏛️ ИВЕНТ ОЛИМП ⚡️</h2>

                                {/* Герои Олимпа — ВВЕРХУ, по центру */}
                                <button onClick={()=>setEventScreen('heroes')} className="olympus-btn mb-5 w-full max-w-xs text-center">
                                    🏆 Герои Олимпа
                                </button>

                                {/* Сокровище и Лавка — СЛЕВА */}
                                <div className="w-full flex flex-col items-start gap-4 pl-0">
                                    <button onClick={()=>setEventScreen('treasure')} className="olympus-btn w-64">
                                        ⚡️ Сокровище Олимпа
                                    </button>
                                    <button onClick={()=>setShowGefestModal(true)} className="olympus-btn w-64">
                                        🏵️ Лавка Гефеста
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TREASURE */}
                    {eventScreen==='treasure' && (
                        <div className="olympus-font">
                            <button onClick={()=>setEventScreen('main')} className="mb-3 text-yellow-300 hover:text-yellow-400 font-bold transition text-sm">← Назад</button>
                            <div className="rounded-2xl overflow-hidden mb-4 treasure-bg-wrap" style={{backgroundImage:`url('${treasureBg}')`,backgroundBlendMode:'overlay',background:'rgba(20,10,30,0.82)'}}>
                                <div className="p-4">
                                    <h3 className="text-2xl font-bold text-center mb-3 olympus-title olympus-font-black">⚡️ Сокровище Олимпа</h3>

                                    {/* Bg upload */}
                                    <div className="glass rounded-xl p-3 mb-4">
                                        <p className="text-center text-xs olympus-label mb-2">📸 Загрузить фон (сохраняется в браузере)</p>
                                        <input type="file" accept="image/*" className="w-full text-xs mb-2"
                                            onChange={e=>{ const f=e.target.files?.[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ const d=String(rd.result||''); localStorage.setItem('olymp_bg',d); setTreasureBg(d); }; rd.readAsDataURL(f); }} />
                                        <button className="w-full bg-gray-800/60 hover:bg-gray-800 py-1.5 rounded-lg text-xs font-bold" onClick={()=>{ localStorage.removeItem('olymp_bg'); setTreasureBg('case.jpg'); }}>Сбросить на case.jpg</button>
                                    </div>

                                    {/* Olympus Case */}
                                    <div className="glass rounded-2xl p-4 mb-4 text-center border-2 border-yellow-500/50" style={{boxShadow:'0 0 30px rgba(251,191,36,0.3)'}}>
                                        <div className="w-28 h-28 mx-auto mb-3 rounded-xl bg-gradient-to-br from-yellow-400 to-amber-600 flex items-center justify-center text-6xl shadow-xl border-2 border-yellow-300/50" style={{boxShadow:'0 0 25px rgba(251,191,36,0.6)'}}>⚡️</div>
                                        <h4 className="text-xl font-bold mb-1 olympus-label olympus-font-black">Кейс «Олимп⚡️»</h4>
                                        <p className="text-sm text-gray-300 mb-1">Цена: <span className="font-bold text-yellow-400 text-base">77⭐️</span></p>
                                        {(cases.olympus?.freeCount||0)>0 && <p className="text-green-400 font-bold text-sm mb-2">🎁 Бесплатных: {cases.olympus.freeCount}</p>}
                                        <button onClick={()=>{ const oc=cases.olympus||{id:'olympus',name:'Олимп⚡️',emoji:'⚡️',price:77,freeCount:0,type:'event'}; handleSelectCase(oc); }} className="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 py-3 rounded-xl font-bold transition olympus-label" style={{boxShadow:'0 0 20px rgba(251,191,36,0.5)'}}>
                                            Открыть ⭐️
                                        </button>
                                        {/* Rewards list */}
                                        <div className="mt-3 text-left max-h-36 overflow-y-auto">
                                            {CASE_REWARDS.olympus.map((r,i)=>(
                                                <div key={i} className="flex justify-between py-1 border-b border-white/10 last:border-0 text-xs">
                                                    <span>{r.emoji} {r.name}</span>
                                                    <span className="text-yellow-400 font-bold">{r.displayChance}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Progress ladder */}
                                    <div className="glass rounded-2xl p-4 border border-yellow-500/30">
                                        <h4 className="text-lg font-bold text-center mb-2 olympus-label olympus-font-black">🏆 Лестница прогресса</h4>
                                        <p className="text-center text-xs olympus-label mb-2">Открыто кейсов: <span className="text-yellow-300 font-bold">{olympusOpens}</span></p>
                                        <div className="w-full h-3 bg-black/60 rounded-full overflow-hidden mb-3 border border-yellow-400/40">
                                            <div className="h-full bg-gradient-to-r from-yellow-400 to-amber-500 rounded-full transition-all" style={{width:`${Math.min(100,(olympusOpens/150)*100)}%`}} />
                                        </div>
                                        <div className="space-y-2 max-h-72 overflow-y-auto">
                                            {OLYMPUS_PROGRESS.map((step,idx)=>{
                                                const done=olympusProgress.includes(step.opens);
                                                const active=olympusOpens>=step.opens&&!done;
                                                return (
                                                    <div key={idx} className={`progress-step ${done?'completed':''} ${active?'active':''}`}>
                                                        <div className="flex justify-between items-center">
                                                            <span className="text-xs font-bold olympus-label">{step.opens} открытий</span>
                                                            {done && <span className="text-green-400 font-bold">✓ Получено</span>}
                                                            {active && <span className="text-yellow-400 text-xs animate-pulse">→ Забрать!</span>}
                                                        </div>
                                                        <p className="text-xs text-gray-200 mt-1">{step.name}</p>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* HEROES */}
                    {eventScreen==='heroes' && (
                        <div className="olympus-font">
                            <button onClick={()=>setEventScreen('main')} className="mb-3 text-yellow-300 hover:text-yellow-400 font-bold transition text-sm">← Назад</button>
                            <div className="rounded-2xl p-5 hero-bg" style={{backgroundBlendMode:'overlay',background:'rgba(10,5,30,0.80)',minHeight:'400px'}}>
                                <h2 className="text-2xl font-bold text-center mb-5 olympus-title olympus-font-black">🏆 Герои Олимпа 🏆</h2>
                                {olympusTopPlayers.length===0 && <p className="text-center text-gray-400 text-sm">Пока нет героев. Открой кейс «Олимп⚡️» первым!</p>}
                                <div className="space-y-3 mb-5">
                                    {olympusTopPlayers.map((p,idx)=>(
                                        <div key={p.id} className="glass rounded-xl p-3 flex items-center gap-3 border border-yellow-500/20">
                                            <span className="text-3xl">{idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':`${idx+1}.`}</span>
                                            {p.avatar ? <img src={p.avatar} alt="" className="w-12 h-12 rounded-full border-2 border-yellow-400/50" /> : <div className="w-12 h-12 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-white font-bold text-xl">{(p.name||'?').charAt(0)}</div>}
                                            <div className="flex-1">
                                                <div className="font-bold text-sm olympus-label">{p.name}</div>
                                                <div className="text-xs text-gray-300">Открыто: <span className="text-yellow-400 font-bold">{p.olympusOpens}</span></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <p className="text-center olympus-label text-sm" style={{textShadow:'0 0 10px #fbbf24'}}>🏅 Топ 3 получат дополнительные награды в конце ивента!</p>
                            </div>
                        </div>
                    )}
                </div>)}

                {/* ══ TASKS SCREEN ══ */}
                {currentScreen==='tasks' && (
                    <div>
                        <h2 className="text-2xl font-bold mb-4 text-center">📋 Задания</h2>
                        <div className="space-y-3">
                            {/* Subscribe */}
                            <div className={`glass rounded-xl p-4 ${tasks.subscribe?.completed?'bg-green-500/20':''}`}>
                                <div className="flex justify-between items-start mb-2">
                                    <div><h3 className="font-bold text-sm">Подпишись на канал</h3><p className="text-xs opacity-75">Награда: 1 кейс «Элита» 🎖</p></div>
                                    {tasks.subscribe?.completed && <span className="text-green-400 text-xl">✅</span>}
                                </div>
                                <button onClick={()=>completeTask('subscribe')} disabled={tasks.subscribe?.completed} className={`w-full py-2 rounded-lg text-sm ${tasks.subscribe?.completed?'bg-green-600':'bg-blue-600 hover:bg-blue-500'} transition`}>{tasks.subscribe?.completed?'Выполнено':'Подписаться'}</button>
                            </div>
                            {/* Invite */}
                            <div className={`glass rounded-xl p-4 ${tasks.inviteThree?.completed?'bg-green-500/20':''}`}>
                                <div className="flex justify-between items-start mb-2">
                                    <div><h3 className="font-bold text-sm">Пригласить 3 друзей</h3><p className="text-xs opacity-75">Награда: 25 ⭐️</p>{!tasks.inviteThree?.completed&&<p className="text-xs text-cyan-400 mt-0.5">Прогресс: {tasks.inviteThree?.count||0}/3</p>}</div>
                                    {tasks.inviteThree?.completed&&<span className="text-green-400 text-xl">✅</span>}
                                </div>
                                <button onClick={()=>completeTask('inviteThree')} disabled={tasks.inviteThree?.completed} className={`w-full py-2 rounded-lg text-sm ${tasks.inviteThree?.completed?'bg-green-600':'bg-blue-600 hover:bg-blue-500'} transition`}>{tasks.inviteThree?.completed?'Выполнено':'Пригласить'}</button>
                            </div>
                            {/* Cardboard x7 */}
                            <div className={`glass rounded-xl p-4 ${tasks.cardboard7?.completed?'bg-green-500/20':''}`}>
                                <div className="flex justify-between items-start mb-2">
                                    <div><h3 className="font-bold text-sm">Прокрути кейс «Картон📦» 7 раз</h3><p className="text-xs opacity-75">Награда: 1 кейс «Алмаз💎»</p>{!tasks.cardboard7?.completed&&<p className="text-xs text-cyan-400 mt-0.5">Прогресс: {tasks.cardboard7?.count||0}/7</p>}</div>
                                    {tasks.cardboard7?.completed&&<span className="text-green-400 text-xl">✅</span>}
                                </div>
                                <div className={`w-full py-2 rounded-lg text-sm text-center font-bold ${tasks.cardboard7?.completed?'bg-green-600':'bg-gray-600 opacity-70'}`}>{tasks.cardboard7?.completed?'Выполнено':'Открывайте кейс «Картон»'}</div>
                            </div>
                            {/* Deposit 50 */}
                            <div className={`glass rounded-xl p-4 ${tasks.deposit50?.completed?'bg-green-500/20':''}`}>
                                <div className="flex justify-between items-start mb-2">
                                    <div><h3 className="font-bold text-sm">Пополни баланс на 50⭐️</h3><p className="text-xs opacity-75">Награда: 50⭐️</p></div>
                                    {tasks.deposit50?.completed&&<span className="text-green-400 text-xl">✅</span>}
                                </div>
                                <button onClick={()=>completeTask('deposit50')} disabled={tasks.deposit50?.completed} className={`w-full py-2 rounded-lg text-sm ${tasks.deposit50?.completed?'bg-green-600':'bg-blue-600 hover:bg-blue-500'} transition`}>{tasks.deposit50?.completed?'Выполнено':'Пополнить'}</button>
                            </div>
                            {/* Deposit 100 */}
                            <div className={`glass rounded-xl p-4 ${tasks.deposit?.completed?'bg-green-500/20':''}`}>
                                <div className="flex justify-between items-start mb-2">
                                    <div><h3 className="font-bold text-sm">Пополнить на 100 ⭐️</h3><p className="text-xs opacity-75">Награда: 1 золотой кейс 👑</p></div>
                                    {tasks.deposit?.completed&&<span className="text-green-400 text-xl">✅</span>}
                                </div>
                                <button onClick={()=>completeTask('deposit')} disabled={tasks.deposit?.completed} className={`w-full py-2 rounded-lg text-sm ${tasks.deposit?.completed?'bg-green-600':'bg-blue-600 hover:bg-blue-500'} transition`}>{tasks.deposit?.completed?'Выполнено':'Пополнить'}</button>
                            </div>
                            {/* Deposit 350 */}
                            <div className={`glass rounded-xl p-4 ${tasks.depositMajor?.completed?'bg-green-500/20':''}`}>
                                <div className="flex justify-between items-start mb-2">
                                    <div><h3 className="font-bold text-sm">Пополнить на 350 ⭐️</h3><p className="text-xs opacity-75">Награда: Кейс «Коллекционер» + 1 прокрут</p></div>
                                    {tasks.depositMajor?.completed&&<span className="text-green-400 text-xl">✅</span>}
                                </div>
                                <button onClick={()=>completeTask('depositMajor')} disabled={tasks.depositMajor?.completed} className={`w-full py-2 rounded-lg text-sm ${tasks.depositMajor?.completed?'bg-green-600':'bg-blue-600 hover:bg-blue-500'} transition`}>{tasks.depositMajor?.completed?'Выполнено':'Пополнить'}</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* ══ PROFILE SCREEN ══ */}
                {currentScreen==='profile' && (
                    <div>
                        <div className="glass rounded-xl p-3 mb-4 flex justify-between items-center">
                            <span className="text-gray-400 text-sm">🟢 Онлайн:</span>
                            <span className="font-bold text-green-400 text-sm">{onlineCount} игроков</span>
                        </div>
                        <h2 className="text-2xl font-bold mb-4 text-center">👤 Мой Профиль</h2>
                        <div className="glass rounded-xl p-5 text-center mb-4">
                            <div className="w-20 h-20 mx-auto rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-3xl mb-3 overflow-hidden border-2 border-white/20">
                                {user?.avatar?<img src={user.avatar} alt="" className="w-full h-full object-cover" />:user?.name?.charAt(0).toUpperCase()}
                            </div>
                            <h3 className="text-lg font-bold">{user?.name}</h3>
                            {user?.username&&<p className="text-gray-400 text-sm">{user.username}</p>}
                        </div>
                        <div className="flex gap-2 mb-4">
                            <button onClick={()=>setShowTopUp(true)} className="flex-1 bg-gradient-to-r from-yellow-400 to-orange-500 text-gray-900 font-bold py-3 rounded-xl shadow-lg transition text-sm">💎 Пополнить</button>
                        </div>
                        <div className="mb-4">
                            <button onClick={()=>setShowWithdrawModal(true)} className="w-full bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm">🏆 Вывести призы 🏆</button>
                        </div>
                        <div className="glass rounded-xl p-4 mb-4">
                            <h3 className="font-bold mb-2 text-sm">🎁 Промокод</h3>
                            <div className="flex gap-2">
                                <input type="text" placeholder="ПРОМОКОД" value={promoCode} onChange={e=>setPromoCode(e.target.value)} className="flex-1 bg-gray-700/50 border border-gray-600 rounded-lg px-3 py-2 text-center uppercase text-sm" />
                                <button onClick={checkPromo} className="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-bold transition text-sm">OK</button>
                            </div>
                            {promoError&&<p className="text-red-400 text-xs mt-2 text-center">{promoError}</p>}
                            {promoSuccess&&<p className="text-green-400 text-xs mt-2 text-center">{promoSuccess}</p>}
                        </div>
                        <div className="glass rounded-xl p-4">
                            <div className="flex justify-between items-center mb-3">
                                <h3 className="font-bold text-sm">🎒 Инвентарь</h3>
                                <span className="text-xs text-gray-400">{inventory.length}/{inventorySlots}</span>
                            </div>
                            <div className="grid grid-cols-5 gap-2 mb-3">
                                {[...Array(inventorySlots)].map((_,i)=>(
                                    <div key={i} className="aspect-square bg-gray-700/50 rounded-lg flex items-center justify-center text-2xl hover:bg-gray-600/50 transition cursor-pointer">
                                        {inventory[i]?<span onClick={()=>sellItem(inventory[i])} className="hover:scale-110 transition">{inventory[i].emoji}</span>:<span className="text-gray-600 text-xs">○</span>}
                                    </div>
                                ))}
                            </div>
                            <button onClick={unlockSlot} disabled={balance<50} className="w-full bg-gray-700 hover:bg-gray-600 disabled:opacity-50 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-2 transition">🔓 Разблокировать слот (50⭐️)</button>
                        </div>
                    </div>
                )}
            </main>

            {/* ─── ROULETTE MODAL ─── */}
            {selectedCase && (
                <div className="fullscreen-modal flex items-center justify-center p-4">
                    <div className="w-full max-w-lg" ref={rouletteContainerRef}>
                        <div className="flex justify-between items-center mb-5">
                            <h3 className="text-2xl font-bold">{selectedCase.emoji} {selectedCase.name}</h3>
                            <button onClick={()=>{ setSelectedCase(null); setSpinResult(null); setFakeItems([]); }} className="text-3xl hover:text-red-400 transition">×</button>
                        </div>
                        <div className="roulette-container mb-5">
                            <div className="roulette-pointer" />
                            <div key={rouletteKey} className="roulette-inner" style={{transform:`translateX(${rouletteOffset}px)`}}>
                                {fakeItems.length>0?fakeItems.map((item,i)=>(
                                    <div key={i} className="roulette-item"><div className="emoji">{item.emoji}</div><div className="name">{item.name}</div></div>
                                )):[...Array(80)].map((_,i)=><div key={i} className="roulette-item"><div className="emoji">❓</div></div>)}
                            </div>
                        </div>
                        <div className="glass rounded-xl p-4 mb-5 max-h-40 overflow-y-auto">
                            <p className="font-bold mb-2 text-center text-sm">Возможные награды:</p>
                            <div className="space-y-1">
                                {(CASE_REWARDS[selectedCase.id]||[]).map((r,i)=>(
                                    <div key={i} className="flex justify-between py-1 border-b border-white/10 last:border-0 text-xs">
                                        <span>{r.emoji} {r.name}</span>
                                        <span className="text-yellow-400 font-bold">{r.displayChance}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                        {spinResult?(
                            <div className="text-center">
                                <p className="text-xl font-bold mb-2">🎉 Выпало: {spinResult.name}!</p>
                                {spinResult.type==='collectible'&&<p className="text-yellow-400 text-xs mb-4">⭐️ Коллекционный предмет!</p>}
                                <button onClick={()=>{ setSpinResult(null); openCase(selectedCase.id); }} className="w-full bg-green-600 hover:bg-green-500 py-3 rounded-xl font-bold mb-2 transition">Забрать и открыть ещё</button>
                                <button onClick={()=>{ setSelectedCase(null); setSpinResult(null); setFakeItems([]); }} className="w-full bg-gray-600 hover:bg-gray-500 py-2.5 rounded-xl font-bold transition text-sm">К кейсам</button>
                            </div>
                        ):(
                            <button onClick={()=>openCase(selectedCase.id)} disabled={isSpinning||(selectedCase.id==='daily'&&selectedCase.freeCount===0)} className="w-full bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 py-4 rounded-xl font-bold text-lg disabled:opacity-50 shadow-lg transition">
                                {isSpinning?'🌀 Крутим...':(selectedCase.id==='daily'&&selectedCase.freeCount===0?dailyCaseTimeLeft:`Открыть за ${getCasePrice(selectedCase.id)===0?'Бесплатно':getCasePrice(selectedCase.id)+'⭐️'}`)}
                            </button>
                        )}
                    </div>
                </div>
            )}

            {/* ─── BOTTOM NAV ─── */}
            <nav className="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-2 z-40">
                <div className="max-w-md mx-auto flex justify-around">
                    {[{id:'tasks',emoji:'📋',label:'Задания'},{id:'cases',emoji:'🎁',label:'Кейсы'},{id:'events',emoji:'🏛️',label:'Ивенты'},{id:'games',emoji:'🎮',label:'Игры'},{id:'profile',emoji:'👤',label:'Профиль'}].map(s=>(
                        <button key={s.id} onClick={()=>{ setCurrentScreen(s.id); if(s.id==='events') setEventScreen('main'); }} className={`flex flex-col items-center p-2 rounded-lg transition ${currentScreen===s.id?'events-tab-active text-yellow-400 scale-110':'text-gray-400 hover:text-white'}`}>
                            <span className="text-2xl">{s.emoji}</span>
                            <span className="text-xs font-bold">{s.label}</span>
                        </button>
                    ))}
                </div>
            </nav>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
