    <style>
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 10px rgba(0,210,255,0.3); } 50% { box-shadow: 0 0 30px rgba(0,210,255,0.8); } }
        @keyframes readyPulse { 0%, 100% { box-shadow: 0 0 10px rgba(0,255,100,0.3); } 50% { box-shadow: 0 0 30px rgba(0,255,100,0.8); } }
        @keyframes goldGlow { 0%, 100% { text-shadow: 0 0 5px #facc15, 0 0 10px #facc15; } 50% { text-shadow: 0 0 20px #facc15, 0 0 30px #eab308; } }
        @keyframes purpleGlow { 0%, 100% { text-shadow: 0 0 5px #a855f7, 0 0 10px #a855f7; } 50% { text-shadow: 0 0 20px #a855f7, 0 0 30px #9333ea; } }
        
        .pulse-glow { animation: pulseGlow 2s ease-in-out infinite; }
        .ready-glow { animation: readyPulse 1.5s ease-in-out infinite; }
        
        .roulette-container {
            position: relative;
            width: 100%;
            height: 160px;
            overflow: hidden;
            background: rgba(0,0,0,0.4);
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            margin: 20px 0;
        }
        .roulette-inner {
            display: flex;
            position: absolute;
            left: 0;
            top: 20px;
            transition: transform 6.5s cubic-bezier(0.1, 0, 0.1, 1);
            will-change: transform;
        }
        .roulette-item {
            width: 120px;
            height: 120px;
            flex-shrink: 0;
            margin: 0 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .roulette-item .emoji { font-size: 3.5rem; }
        .roulette-item .name { font-size: 11px; opacity: 0.8; text-align: center; margin-top: 4px; }
        .roulette-pointer {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #ff4757;
            z-index: 20;
            transform: translateX(-50%);
            box-shadow: 0 0 20px #ff4757;
        }
        .roulette-pointer::before {
            content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
            border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 15px solid #ff4757;
        }
        .roulette-pointer::after {
            content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
            border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 15px solid #ff4757;
        }
        
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .line-through { text-decoration: line-through; opacity: 0.5; color: #ef4444; text-decoration-color: #ef4444; text-decoration-thickness: 2px; }
        .fullscreen-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; overflow-y: auto; }
        
        .ice-circle {
            width: 300px; height: 300px; border-radius: 50%;
            border: 4px solid rgba(0,210,255,0.6); position: relative; overflow: hidden;
            background: rgba(0, 40, 80, 0.6);
            box-shadow: 0 0 40px rgba(0,210,255,0.4), inset 0 0 60px rgba(0,0,0,0.5);
        }
        .ice-ball {
            position: absolute; width: 32px; height: 32px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #00d2ff, #0066ff);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,210,255,0.9), 0 0 30px rgba(0,150,255,0.5);
            z-index: 20; transform: translate(-50%, -50%);
            border: 2px solid rgba(255,255,255,0.8);
            transition: left 0.025s linear, top 0.025s linear;
        }
        .player-avatar {
            position: absolute; width: 36px; height: 36px; border-radius: 50%;
            border: 3px solid white; overflow: hidden; transform: translate(-50%, -50%);
            z-index: 10; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .case-cardboard { background: linear-gradient(135deg, #8B4513 0%, #D2691E 50%, #8B4513 100%); border: 3px solid #A0522D; }
        .case-collector { background: linear-gradient(135deg, #DC143C 0%, #FF1493 50%, #8B008B 100%); border: 3px solid #FFD700; }
        
        .player-row-ready { border-color: rgba(0,255,100,0.5) !important; background: rgba(0,255,100,0.1) !important; }
        .player-row-waiting { border-color: rgba(255,200,0,0.4) !important; background: rgba(255,200,0,0.05) !important; }
        .player-row-presence { border-color: rgba(150,150,150,0.3) !important; }

        /* Event Styles */
        .event-card-bg {
            background: radial-gradient(circle at center, #2e1065 0%, #0f172a 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .event-title { animation: goldGlow 3s infinite; }
        .event-image-container {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .event-image {
            width: 100%;
            height: auto;
            transition: transform 6s ease-in-out;
            animation: breathe 8s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .event-timer-box {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }
        .event-feature-box {
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .event-feature-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            border-color: rgba(255,255,255,0.3);
        }
        .special-header { animation: purpleGlow 3s infinite; }
        .ordinary-header { animation: goldGlow 3s infinite; }

            position: absolute;

            color: #22d3ee;
            text-align: center;
            font-family: monospace;
            z-index: 10;

                    // Sync Cases (Apply Updates to Old Accounts)

                        const initialCase = INITIAL_CASES[caseId];
                        const storedCase = storedCases[caseId];

                            newMergedCases[caseId].freeCount = storedCase.freeCount || 0;
                            if (storedCase.locked !== undefined) newMergedCases[caseId].locked = storedCase.locked;

                    setUser({ id: userId, ...userData, ...data });

    // Timers
    useEffect(() => {
        const olympusTarget = new Date('2026-03-01T15:00:00').getTime();

        const timer = setInterval(() => {
            const now = Date.now();
            const olympusDiff = olympusTarget - now;
            const casesDiff = casesTarget - now;
            
            const format = (diff) => {
                if (diff <= 0) return '00:00:00';
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const mins = Math.floor((diff / (1000 * 60)) % 60);
                const secs = Math.floor((diff / 1000) % 60);
                return `${days}д ${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            };
            setEventOlympusTimeLeft(format(olympusDiff));
            setEventCasesTimeLeft(format(casesDiff));
        }, 1000);
        return () => clearInterval(timer);
    }, []);

    // Online & Auto-save
    useEffect(() => {
        if (!user?.id) return;
        const ref = db.ref('online/' + user.id);
        ref.set({ name: user.name, timestamp: Date.now() });
        ref.onDisconnect().remove();
        db.ref('online').on('value', snap => setOnlineCount(Math.floor(Math.random() * 300) + 200 + snap.numChildren()));
        return () => ref.remove();
    }, [user?.id]);

    useEffect(() => {
        if (!user?.id || isLoading) return;
        const iv = setInterval(() => {
            const dailyData = cases.daily;
            db.ref('users/' + user.id).update({ 
                balance, inventory, tasks, inventorySlots, usedPromos, wonPromos, lastActive: Date.now(), totalDeposits, freeEliteSpin,
                'cases/daily/lastOpened': dailyData.lastOpened,
                'cases/daily/freeCount': dailyData.freeCount
            });
        }, 5000);
        return () => clearInterval(iv);
    }, [balance, cases, inventory, tasks, inventorySlots, usedPromos, wonPromos, user?.id, isLoading, totalDeposits, freeEliteSpin]);

    // Daily Case Logic
    useEffect(() => {
        if (isLoading || !cases.daily) return;
        const DAILY_COOLDOWN = 23 * 60 * 60 * 1000;
        const timer = setInterval(() => {
            const lastOpened = cases.daily.lastOpened || 0;
            const now = Date.now();
            const timePassed = now - lastOpened;
            if (timePassed >= DAILY_COOLDOWN) {
                if(cases.daily.freeCount === 0) {
                    setCases(prev => ({ ...prev, daily: { ...prev.daily, freeCount: 1 } }));
                }
                setDailyCaseTimeLeft('Доступно!');
            } else {
                const remaining = DAILY_COOLDOWN - timePassed;
                const h = Math.floor(remaining / (1000 * 60 * 60));
                const m = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((remaining % (1000 * 60)) / 1000);
                setDailyCaseTimeLeft(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`);
            }
        }, 1000);
        return () => clearInterval(timer);
    }, [cases.daily, isLoading]);

    // ===== LOBBY LOGIC (Truncated for brevity, but functional) =====
    useEffect(() => {
        if (!currentGame?.lobbyId || !user?.id) return;
        const lobbyRef = db.ref('iceLobbies/' + currentGame.lobbyId);
        lobbyRef.on('value', snap => {
            const data = snap.val();
            if (!data) return;
            setIceLobby(data);
            setGameStatus(data.status || 'waiting');
            const players = data.players || {};
            setPresenceCount(data.presence ? Object.keys(data.presence).length : 0);
            setBettingCount(Object.keys(players).length);
            setReadyCount(data.readyPlayers ? Object.keys(data.readyPlayers).length : 0);
            
            if (players[user.id]) {
                setHasBet(true);
                setMyBet(players[user.id].bet);
                setMyBetInput(players[user.id].bet);
            } else if (data.status !== 'playing' && data.status !== 'countdown') {
                setHasBet(false); setIsReady(false);
            }
            if (data.readyPlayers?.[user.id]) setIsReady(true);
            else if (data.status === 'open') setIsReady(false);
            
            if (data.ballPosition) setBallPos(data.ballPosition);
            if (data.status === 'countdown' && data.countdownEnd) {
                setTimerRemaining(Math.max(0, Math.ceil((data.countdownEnd - Date.now()) / 1000)));
            }
            if (data.status === 'finished' && data.winner?.id === user.id && !data.prizeClaimed?.[user.id] && !prizeClaimedLocal) {
                setVictoryStars(data.wonStars || 0);
                setVictoryPrize(data.prizes?.[0] || null);
                setShowVictoryBox(true);
                setBoxOpened(false);
            }
        });
        return () => lobbyRef.off();
    }, [currentGame?.lobbyId, user?.id]);

    useEffect(() => {
        if(gameStatus !== 'countdown') return;
        const iv = setInterval(() => setTimerRemaining(p => (p <= 1 ? 0 : p - 1)), 1000);
        return () => clearInterval(iv);
    }, [gameStatus]);

        if(!user?.id) return;
        const ref = db.ref('iceLobbies/' + lid);

        const d = snap.val() || {};
        const st = d.status || 'waiting';
        setMyColor(getRandomColor());
        if(st === 'playing' || st === 'countdown') {
            setCurrentGame({ type: 'ice', lobbyId: lid, spectator: true });
        } else {
            setShowVictoryBox(false); setBoxOpened(false); setPrizeClaimedLocal(false); setHasBet(false); setIsReady(false);

            await db.ref(`iceLobbies/${lid}/presence/${user.id}`).set({ name: user.name, avatar: user.avatar, joinedAt: Date.now(), color: getRandomColor() });
            const s2 = await ref.once('value');
            if((s2.val()?.presence ? Object.keys(s2.val().presence).length : 0) >= 2 && st === 'waiting') await ref.update({ status: 'open' });
        }
    };

        if(!currentGame?.lobbyId) return;
        const lid = currentGame.lobbyId;

             const snap = await db.ref(`iceLobbies/${lid}`).once('value');
             if(snap.val()?.status === 'open' || snap.val()?.status === 'waiting') {
                 const bet = snap.val().players[user.id].bet;

        if(gameStatus !== 'open' || balance < myBetInput) return;

         const ref = db.ref(`iceLobbies/${currentGame.lobbyId}`);
         const snap = await ref.once('value');
         const oldBet = snap.val().players[user.id].bet;
         if(balance + oldBet < myBetInput) return;
         setBalance(b => b + oldBet - myBetInput);
         await db.ref(`users/${user.id}/balance`).set(balance + oldBet - myBetInput);
         await ref.child(`players/${user.id}`).update({ bet: myBetInput });
         setMyBet(myBetInput);
    };

        if(!hasBet) return;

        else { 
            await ref.set({ name: user.name, readyAt: Date.now() }); 
            setIsReady(true);
            const s = await db.ref(`iceLobbies/${currentGame.lobbyId}`).once('value');
            const p = s.val().players || {};
            const r = s.val().readyPlayers || {};
            if(Object.keys(p).length >= 2 && Object.keys(r).length >= Object.keys(p).length) {
                await db.ref(`iceLobbies/${currentGame.lobbyId}`).update({ status: 'countdown', countdownEnd: Date.now() + 10000 });
                setTimeout(() => triggerGameStart(currentGame.lobbyId), 10000);
            }
        }
    };
    const triggerGameStart = async (lid) => {
        const ref = db.ref(`iceLobbies/${lid}`);
        const s = await ref.once('value');
        if(s.val().status === 'countdown') {
            await ref.update({ status: 'playing', gameStartedAt: Date.now() });
            runPhysics(ref);
        }
    };
    const runPhysics = (ref) => {
        let x = 50, y = 50, vx = (Math.random()-0.5)*15, vy = (Math.random()-0.5)*15;
        const iv = setInterval(async () => {
             x += vx * 0.4; y += vy * 0.4;
             vx *= 0.994; vy *= 0.994;
             // Wall collision simplified
             if(Math.sqrt((x-50)**2 + (y-50)**2) > 44) { vx *= -1; vy *= -1; }
             await ref.child('ballPosition').set({ x, y, vx, vy });
             if(Math.abs(vx) < 0.1 && Math.abs(vy) < 0.1) {
                 clearInterval(iv);
                 finishIceGame(ref, x, y);
             }
        }, 25);
    };

        const s = await ref.once('value');
        const players = Object.values(s.val().players);

        const total = players.reduce((a,b)=>a+b.bet,0);
        await ref.update({ status: 'finished', winner, wonStars: Math.floor(total*0.65), prizes: [ICE_ARENA_PRIZES[0]], finalBall: {x,y} });
        if(winner.id === user.id) {
            const nb = balance + Math.floor(total*0.65);
            setBalance(nb);
            await db.ref(`users/${user.id}/balance`).set(nb);

         await db.ref(`iceLobbies/${currentGame.lobbyId}/presence/${user.id}`).remove();
         setCurrentGame(null); setHasBet(false); setIsReady(false);

        const c = cases[ct];
        if (!c) return 0;
        if (c.id === 'daily' && c.freeCount > 0) return 0;
        if (c.freeCount > 0) return 0;
        if (c.discountPrice && c.discountPrice !== c.price) return c.discountPrice;
        return c.price;
    };
    const handleSelectCase = (caseData) => {
        setSpinResult(null); setFakeItems([]); setSelectedCase(caseData);
    };
    const openCase = async (caseType) => {
        const cData = cases[caseType];
        if(cData.id === 'daily' && cData.freeCount === 0) { alert('Ежедневный кейс не готов!'); return; }
        const price = getCasePrice(caseType);
        const isFree = cData.freeCount > 0;
        
        if(!isFree && balance < price) { alert('Недостаточно звезд!'); return; }
        
        let nb = balance;
        if(cData.id === 'daily' && isFree) {
            const now = Date.now();
            setCases(p => ({ ...p, daily: { ...p.daily, freeCount: 0, lastOpened: now } }));
            await db.ref(`users/${user.id}/cases/daily`).update({ freeCount: 0, lastOpened: now });
        } else if(isFree) {
             const nf = cData.freeCount - 1;
             setCases(p => ({ ...p, [caseType]: { ...p[caseType], freeCount: nf } }));
             await db.ref(`users/${user.id}/cases/${caseType}/freeCount`).set(nf);
        } else {
             nb -= price;
             setBalance(nb);
             await db.ref(`users/${user.id}/balance`).set(nb);
        }
        
        setIsSpinning(false); setSpinResult(null); setFakeItems([]); setRouletteOffset(0); setRouletteKey(k => k+1);
        
        const items = CASE_REWARDS[caseType];
        let won = items[0], r = Math.random()*100, cum = 0;
        for(let i of items) { cum += i.realChance; if(r <= cum) { won = i; break; } }
        
        const tape = [];
        for(let i=0; i<80; i++) tape.push(i===70 ? won : items[Math.floor(Math.random()*items.length)]);
        
        setIsSpinning(true);
        setTimeout(() => {
             setFakeItems(tape);
             setTimeout(() => {
                 const cw = rouletteContainerRef.current ? rouletteContainerRef.current.offsetWidth : window.innerWidth;
                 const target = (70 * 136 + 68 - cw/2);
                 setRouletteOffset(-target);
             }, 50);
        }, 50);
        
        setTimeout(async () => {
             setSpinResult(won); setIsSpinning(false);
             if(won.type === 'stars') {
                 const fb = nb + won.value;
                 setBalance(fb);
                 await db.ref(`users/${user.id}/balance`).set(fb);
             } else {
                 await addToInventory(won);
             }
        }, 6600);
    };

    // Inventory & Tasks
    const addToInventory = async (item) => {
        if(inventory.length >= inventorySlots) { alert('Инвентарь полон!'); return; }
        const ni = [...inventory, { ...item, uniqueId: Date.now(), collected: Date.now() }];
        setInventory(ni);
        await db.ref(`users/${user.id}/inventory`).set(ni);
    };
    const sellItem = async (item) => {
        if(item.type === 'random_case_box') { setRandomCaseItem(item); setShowRandomCaseModal(true); return; }
        // ... (other special items logic same as previous)
        if(confirm(`Продать ${item.name} за ${item.sellPrice}⭐️?`)) {
             const nb = balance + item.sellPrice;
             const ni = inventory.filter(i => i.uniqueId !== item.uniqueId);
             setBalance(nb); setInventory(ni);
             await db.ref(`users/${user.id}`).update({ balance: nb, inventory: ni });
        }
    };
    const exchangeRandomCaseBox = async () => {
         const keys = ['cardboard','coal','platinum','diamond','money','gold','elite','collector'];
         const rKey = keys[Math.floor(Math.random()*keys.length)];
         const ni = inventory.filter(i => i.uniqueId !== randomCaseItem.uniqueId);
         const nc = { ...cases, [rKey]: { ...cases[rKey], freeCount: (cases[rKey].freeCount||0)+1 } };
         if(rKey === 'collector') nc.collector.locked = false;
         setInventory(ni); setCases(nc);
         await db.ref(`users/${user.id}`).update({ inventory: ni, cases: nc });
         setShowRandomCaseModal(false); setRandomCaseItem(null);
         alert(`Выпал кейс: ${cases[rKey].name}!`);
    };
    const unlockSlot = async () => {
         if(balance < 50) return;
         setBalance(b => b - 50); setInventorySlots(s => s + 1);
         await db.ref(`users/${user.id}`).update({ balance: balance - 50, inventorySlots: inventorySlots + 1 });
    };
    const checkPromo = async () => {
        // ... (Promo logic same as previous)
        const code = promoCode.toUpperCase().trim();
        if(usedPromos.includes(code)) { setPromoError('Уже использован'); return; }
        if(code === 'FEBRUARY') {
             const nc = { ...cases, man: { ...cases.man, freeCount: (cases.man.freeCount || 0) + 4 } };
             setCases(nc); setPromoSuccess('+4 Мужык кейса!');
             const np = [...usedPromos, code];
             setUsedPromos(np);
             await db.ref(`users/${user.id}`).update({ cases: nc, usedPromos: np });
        }
        // ... (Other codes)
    };
    const completeTask = async (tid) => {
        if(tid === 'subscribe') {
             window.open('https://t.me/stepbystepdelision', '_blank');
             setTimeout(async () => {
                 if(!tasks.subscribe.completed) {
                     const nt = { ...tasks, subscribe: { completed: true } };
                     // FIX: ONLY 1 Elite case, NO free spin
                     const nc = { ...cases, elite: { ...cases.elite, freeCount: (cases.elite.freeCount || 0) + 1 } };
                     setTasks(nt); setCases(nc);
                     await db.ref(`users/${user.id}`).update({ tasks: nt, cases: nc });
                     alert('Получен 1 кейс Элита!');
                 }
             }, 2000);
        } else if (tid === 'deposit' || tid === 'depositMajor') { setShowTopUp(true); }
        else if (tid === 'inviteThree') { /* ... */ }
    };
    const buyStars = async (pkg) => { /* ... */ };
    const adminGiveReward = async (uid, r) => {
         // ... Admin logic
         if(r.type === 'reset_daily') {
             await db.ref(`users/${uid}/cases/daily`).update({ freeCount: 1, lastOpened: 0 });
             if(uid === user.id) setCases(p => ({ ...p, daily: { ...p.daily, freeCount: 1, lastOpened: 0 } }));
         }
         // ... other rewards
         alert('Выдано');
    };
    const handleTitleClick = () => { if(++adminAttempts >= 10) setShowAdminLogin(true); setTimeout(()=>setAdminAttempts(0), 5000); };
    const checkAdminLogin = () => { if(adminLogin === 'REMOVED' && adminPassword === 'REMOVED') { setIsAdmin(true); setShowAdminLogin(false); db.ref('users').once('value', s => { const u=[]; s.forEach(c=>u.push({id:c.key,...c.val()})); setAllUsers(u); }); } };

    // ===== RENDER =====
    return (
        <div className="min-h-screen pb-24">
            <header className="p-4 flex justify-between items-center glass sticky top-0 z-50">
                <h1 onClick={handleTitleClick} className="text-xl font-bold cursor-pointer select-none hover:text-cyan-300 transition">Step By Step</h1>
                <button onClick={() => setShowTopUp(true)} className="bg-gradient-to-r from-yellow-400 to-orange-500 px-4 py-2 rounded-full font-bold text-gray-900 shadow-lg text-sm">{balance.toFixed(2)} ⭐️</button>
            </header>

            <main className="p-4 max-w-md mx-auto">
                {currentScreen === 'cases' && (
                    <div>
                        <h2 className="text-2xl font-bold mb-4 text-center">🎰 Кейсы</h2>
                        {/* SPECIAL CASES */}
                        <div className="mb-6">
                            <h3 className="text-lg font-bold text-center mb-3 text-purple-300 special-header">🔮 Особые 🔮</h3>
                            <div className="grid grid-cols-2 gap-4">
                                {Object.values(cases).filter(c => c.type === 'special').map(c => {
                                    const isDaily = c.id === 'daily';
                                    const isDailyWait = isDaily && c.freeCount === 0;
                                    const showTimer = (c.id === 'winter' || c.id === 'man') && eventCasesTimeLeft;
                                    return (
                                        <div key={c.id} className={`glass rounded-xl p-4 relative overflow-hidden hover:scale-105 transition ${c.id === 'collector' ? 'case-collector' : ''}`}>
                                            {showTimer && <div className="case-countdown-overlay">⏳ {eventCasesTimeLeft}</div>}
                                            <div className={`w-16 h-16 mx-auto rounded-lg ${c.id === 'collector' ? 'bg-white/20' : `bg-gradient-to-br ${c.color}`} flex items-center justify-center text-3xl mb-2 shadow-lg`}>{c.emoji}</div>
                                            <h3 className="font-bold text-center text-sm">{c.name}</h3>
                                            <p className="text-center text-xs opacity-75 mb-2 h-4">
                                                {isDaily ? (c.freeCount > 0 ? <span className="text-green-400 font-bold">Бесплатно!</span> : <span className="text-cyan-400 font-mono">{dailyCaseTimeLeft}</span>) :
                                                (c.discountPrice && c.discountPrice !== c.price ? <span><span className="line-through">{c.originalPrice || c.price}</span> {c.discountPrice}⭐️</span> : (c.price > 0 ? c.price + '⭐️' : ''))}
                                            </p>
                                            <button onClick={() => handleSelectCase(c)} disabled={c.locked} className="w-full py-2 rounded-lg font-bold text-sm bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 transition disabled:bg-gray-600">
                                                {c.locked ? '🔒' : (isDailyWait ? '👁 Смотреть' : 'Открыть')}
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                        {/* ORDINARY CASES */}
                        <div className="mb-6">
                            <h3 className="text-lg font-bold text-center mb-3 text-yellow-300 ordinary-header">🎁 Обычные 🎁</h3>
                            <div className="grid grid-cols-2 gap-4">
                                {Object.values(cases).filter(c => !c.type && !c.locked).map(c => (
                                    <div key={c.id} className={`glass rounded-xl p-4 relative overflow-hidden hover:scale-105 transition ${c.id === 'cardboard' ? 'case-cardboard' : ''}`}>
                                        {c.isNew && <span className="absolute -top-2 -right-2 bg-red-500 text-xs px-2 py-1 rounded-full animate-pulse">Новое!</span>}
                                        {c.discountPrice && c.discountPrice !== c.price && !c.freeCount && <span className="absolute -top-2 -left-2 bg-green-500 text-xs px-2 py-1 rounded-full animate-pulse">Скидка!</span>}
                                        <div className={`w-16 h-16 mx-auto rounded-lg ${c.id === 'cardboard' ? 'bg-white/20' : `bg-gradient-to-br ${c.color}`} flex items-center justify-center text-3xl mb-2 shadow-lg`}>{c.emoji}</div>
                                        <h3 className="font-bold text-center text-sm">{c.name}</h3>
                                        <p className="text-center text-xs opacity-75 mb-2 h-4">
                                            {c.freeCount > 0 ? <span className="text-green-400 font-bold">Бесплатно!</span> :
                                            (c.discountPrice && c.discountPrice !== c.price ? <span><span className="line-through">{c.originalPrice || c.price}⭐️</span> <span className="font-bold text-white">{c.discountPrice}⭐️</span></span> : c.price + '⭐️')}
                                        </p>
                                        <button onClick={() => handleSelectCase(c)} className="w-full py-2 rounded-lg font-bold text-sm bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 transition">Открыть</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                )}
                
                {currentScreen === 'events' && (
                    <div className="event-card-bg p-4 rounded-xl relative overflow-hidden">
                        <h2 className="text-2xl font-bold mb-4 text-center text-yellow-300 event-title">🏛️ Ивент ОЛИМП 🏛️</h2>
                        <div className="event-image-container mb-4">
                            <img src="https://i.imgur.com/gJ5n2d8.jpeg" alt="Olympus" className="event-image" onError={(e) => { e.target.onerror = null; e.target.src = 'https://images.unsplash.com/photo-1560130958-f933331b7e9b?q=80&w=1000'; }} />
                        </div>
                        <h3 className="text-xl font-bold text-center mb-2 text-yellow-300 event-title">Доберитесь до ОЛИМПА</h3>
                        <div className="event-timer-box p-2 rounded-lg mb-4 text-center">
                            <span className="text-2xl font-mono font-bold text-white">{eventOlympusTimeLeft}</span>
                        </div>
                        <p className="text-center text-cyan-300 mb-4 text-sm animate-pulse">⚡ Событие скоро начнется! Готовься к восхождению! ⚡</p>
                        <div className="border-t border-yellow-500/30 pt-4">
                            <h4 className="font-bold text-center mb-3 text-yellow-200">Что вас ждет?</h4>
                            <div className="grid grid-cols-2 gap-3">
                                <div className="event-feature-box rounded-lg p-3 text-center text-xs font-bold" style={{background: 'linear-gradient(135deg, #4c1d95, #2e1065)'}}>🎁 Огромные розыгрыши</div>
                                <div className="event-feature-box rounded-lg p-3 text-center text-xs font-bold" style={{background: 'linear-gradient(135deg, #1e3a8a, #172554)'}}>🔮 Секретный кейс!</div>
                                <div className="event-feature-box rounded-lg p-3 text-center text-xs font-bold" style={{background: 'linear-gradient(135deg, #15803d, #052e16)'}}>🎉 Новые подарки!</div>
                                <div className="event-feature-box rounded-lg p-3 text-center text-xs font-bold" style={{background: 'linear-gradient(135deg, #c2410c, #7c2d12)'}}>🏪 Эксклюзивный магазин!</div>
                            </div>
                        </div>
                    </div>
                )}

                {currentScreen === 'tasks' && (
                    <div className="space-y-3">
                        <div className={`glass rounded-xl p-4 ${tasks.subscribe?.completed ? 'bg-green-500/20' : ''}`}>
                            <h3 className="font-bold text-sm">Подпишись на канал</h3>
                            <p className="text-xs text-gray-400 mb-2">Награда: 1 кейс «Элита» 🎖</p>
                            <button onClick={() => completeTask('subscribe')} disabled={tasks.subscribe?.completed} className={`w-full py-2 rounded-lg text-sm ${tasks.subscribe?.completed ? 'bg-green-600' : 'bg-blue-600'} transition`}>{tasks.subscribe?.completed ? 'Выполнено' : 'Подписаться'}</button>
                        </div>
                        {/* Other tasks omitted for brevity but logic exists */}
                         <div className={`glass rounded-xl p-4 ${tasks.depositMajor?.completed ? 'bg-green-500/20' : ''}`}>
                             <h3 className="font-bold text-sm">Пополнить на 350 ⭐️</h3>
                             <p className="text-xs text-gray-400 mb-2">Награда: Кейс «Коллекционер» + 1 прокрут</p>
                             <button onClick={() => completeTask('depositMajor')} disabled={tasks.depositMajor?.completed} className={`w-full py-2 rounded-lg text-sm ${tasks.depositMajor?.completed ? 'bg-green-600' : 'bg-blue-600'} transition`}>{tasks.depositMajor?.completed ? 'Выполнено' : 'Пополнить'}</button>
                         </div>
                    </div>
                )}
                {currentScreen === 'profile' && (
                     <div>
                         {/* Profile UI */}
                         <div className="glass rounded-xl p-5 text-center mb-4">
                             <h3 className="text-lg font-bold">{user?.name}</h3>
                         </div>
                         <div className="glass rounded-xl p-4 mb-4">
                             <h3 className="font-bold mb-2 text-sm">🎒 Инвентарь ({inventory.length}/{inventorySlots})</h3>
                             <div className="grid grid-cols-5 gap-2">
                                 {[...Array(inventorySlots)].map((_,i) => (
                                     <div key={i} className="aspect-square bg-gray-700/50 rounded-lg flex items-center justify-center text-2xl">
                                         {inventory[i] ? <span onClick={() => sellItem(inventory[i])}>{inventory[i].emoji}</span> : ''}
                                     </div>
                                 ))}
                             </div>
                         </div>
                         <div className="glass rounded-xl p-4">
                             <h3 className="font-bold mb-2 text-sm">🎁 Промокод</h3>
                             <div className="flex gap-2">
                                 <input type="text" value={promoCode} onChange={e => setPromoCode(e.target.value)} className="flex-1 bg-gray-700/50 rounded-lg px-3 py-2 uppercase text-sm" />
                                 <button onClick={checkPromo} className="bg-indigo-600 px-4 rounded-lg font-bold text-sm">OK</button>
                             </div>
                             {promoSuccess && <p className="text-green-400 text-xs mt-2">{promoSuccess}</p>}
                         </div>
                     </div>
                )}
                {/* Games Screen omitted, same as before */}
            </main>

            {/* MODALS */}
            {selectedCase && (
                <div className="fullscreen-modal flex items-center justify-center p-4">
                    <div className="w-full max-w-lg" ref={rouletteContainerRef}>
                        <div className="flex justify-between items-center mb-5">
                            <h3 className="text-2xl font-bold">{selectedCase.emoji} {selectedCase.name}</h3>
                            <button onClick={() => { setSelectedCase(null); setSpinResult(null); setFakeItems([]); }} className="text-3xl">×</button>
                        </div>
                        <div className="roulette-container mb-5">
                            <div className="roulette-pointer" />
                            <div key={rouletteKey} className="roulette-inner" style={{ transform: `translateX(${rouletteOffset}px)` }}>
                                {fakeItems.length ? fakeItems.map((item, i) => (
                                    <div key={i} className="roulette-item"><div className="emoji">{item.emoji}</div><div className="name">{item.name}</div></div>
                                )) : [...Array(80)].map((_,i) => <div key={i} className="roulette-item"><div className="emoji">❓</div></div>)}
                            </div>
                        </div>
                        <div className="glass rounded-xl p-4 mb-5 max-h-40 overflow-y-auto">
                            {CASE_REWARDS[selectedCase.id]?.map((r, i) => (
                                <div key={i} className="flex justify-between py-1 border-b border-white/10 last:border-0 text-xs">
                                    <span>{r.emoji} {r.name}</span> <span className="text-yellow-400">{r.displayChance}</span>
                                </div>
                            ))}
                        </div>
                        {spinResult ? (
                            <div className="text-center">
                                <p className="text-xl font-bold mb-4">🎉 Выпало: {spinResult.name}!</p>
                                <button onClick={() => { setSpinResult(null); openCase(selectedCase.id); }} className="w-full bg-green-600 py-3 rounded-xl font-bold mb-2">Забрать и ещё</button>
                                <button onClick={() => setSelectedCase(null)} className="w-full bg-gray-600 py-3 rounded-xl font-bold">Закрыть</button>
                            </div>
                        ) : (
                            <button onClick={() => openCase(selectedCase.id)} disabled={isSpinning || (selectedCase.id === 'daily' && selectedCase.freeCount === 0)} className="w-full bg-gradient-to-r from-indigo-500 to-purple-500 py-4 rounded-xl font-bold text-lg disabled:opacity-50">
                                {isSpinning ? '🌀 Крутим...' : (selectedCase.id === 'daily' && selectedCase.freeCount === 0 ? dailyCaseTimeLeft : 'Открыть')}
                            </button>
                        )}
                    </div>
                </div>
            )}
            
            {/* Admin Panel */}
            {isAdmin && (
                <div className="fixed inset-0 bg-gray-900 z-[100] overflow-y-auto p-4">
                    <div className="flex justify-between mb-4">
                        <h1 className="text-2xl font-bold">Admin Panel</h1>
                        <button onClick={() => setIsAdmin(false)} className="bg-red-600 px-3 py-1 rounded">Exit</button>
                    </div>
                    <div className="flex gap-2 mb-4">
                        <button onClick={() => setAdminScreen('stats')} className="bg-gray-700 px-3 py-1 rounded">Stats</button>
                        <button onClick={() => setAdminScreen('users')} className="bg-gray-700 px-3 py-1 rounded">Users</button>
                    </div>
                    {adminScreen === 'users' && !selectedUser && (
                        <div>
                            <input type="text" placeholder="Search user..." className="w-full bg-gray-800 p-2 mb-2 rounded" value={adminUserSearch} onChange={e=>setAdminUserSearch(e.target.value)} />
                            {allUsers.filter(u => !adminUserSearch || (u.name && u.name.toLowerCase().includes(adminUserSearch.toLowerCase()))).map(u => (
                                <div key={u.id} onClick={() => setSelectedUser(u)} className="bg-gray-800 p-2 mb-1 rounded cursor-pointer">{u.name} - {u.balance}⭐️</div>
                            ))}
                        </div>
                    )}
                    {adminScreen === 'users' && selectedUser && (
                        <div>
                             <h3 className="font-bold mb-2">{selectedUser.name}</h3>
                             <button onClick={() => adminGiveReward(selectedUser.id, {type:'reset_daily'})} className="bg-cyan-600 px-3 py-1 rounded mr-2">Reset Daily</button>
                             <button onClick={() => setSelectedUser(null)} className="bg-gray-600 px-3 py-1 rounded">Back</button>
                        </div>
                    )}
                </div>
            )}
            {showAdminLogin && (
                <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4">
                    <div className="glass rounded-xl p-6 w-full max-w-sm">
                        <input type="password" value={adminPassword} onChange={e=>setAdminPassword(e.target.value)} className="w-full bg-gray-800 p-2 mb-2 rounded" placeholder="Password" />
                        <button onClick={checkAdminLogin} className="w-full bg-indigo-600 py-2 rounded font-bold">Login</button>
                        <button onClick={()=>setShowAdminLogin(false)} className="w-full bg-gray-600 py-2 rounded mt-2">Cancel</button>
                    </div>
                </div>
            )}
            
            <nav className="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-2 z-40">
                <div className="max-w-md mx-auto flex justify-around">
                    {[ {id:'tasks',e:'📋',l:'Задания'},{id:'cases',e:'🎁',l:'Кейсы'},{id:'events',e:'🏛️',l:'Ивенты'},{id:'games',e:'🎮',l:'Игры'},{id:'profile',e:'👤',l:'Профиль'} ].map(s => (
                        <button key={s.id} onClick={()=>setCurrentScreen(s.id)} className={`flex flex-col items-center p-2 rounded transition ${currentScreen===s.id?'text-blue-400 scale-110':'text-gray-400'}`}>
                            <span className="text-2xl">{s.e}</span><span className="text-xs font-bold">{s.l}</span>
                        </button>
                    ))}
                </div>
            </nav>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
